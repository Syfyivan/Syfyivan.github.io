name: Sync Token Usage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update token usage JSON
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          # Optional: set repo variables to enable USD estimation in token-usage.json
          # TOKEN_PRICE_INPUT_PER_1M_USD: <number>
          # TOKEN_PRICE_OUTPUT_PER_1M_USD: <number>
          TOKEN_PRICE_INPUT_PER_1M_USD: ${{ vars.TOKEN_PRICE_INPUT_PER_1M_USD }}
          TOKEN_PRICE_OUTPUT_PER_1M_USD: ${{ vars.TOKEN_PRICE_OUTPUT_PER_1M_USD }}
        run: |
          python3 tools/token_usage_sync.py --out source/stats/token-usage.json

      - name: Commit token usage JSON
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if git diff --quiet -- source/stats/token-usage.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source/stats/token-usage.json
          git commit -m "chore: sync token usage"
          git push

      - name: Install dependencies
        run: |
          rm -rf package-lock.json yarn.lock node_modules
          npm install --force
          npm install hexo

      - name: Build Hexo
        run: npx hexo generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
