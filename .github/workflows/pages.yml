name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22.23.1 currently bundles npm 10.9.8, which exits from `npm ci`
          # with "Exit handler never called" on this lockfile. Pin the last
          # verified runtime so Pages remains reproducible.
          node-version: '22.22.0'
          cache: 'npm'
      - name: Install Dependencies
        # The only install hooks are fsevents (macOS-only) and hexo-util's
        # already-published highlight alias generator. Skipping lifecycle hooks
        # avoids the hosted runner's reproducible npm exit-handler deadlock.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Hexo
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
