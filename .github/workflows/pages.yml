name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22.23.1 currently bundles npm 10.9.8, which exits from `npm ci`
          # with "Exit handler never called" on this lockfile. Pin the last
          # verified runtime so Pages remains reproducible.
          node-version: '22.22.0'
      - name: Install Dependencies
        # npm 10.9.8 aborts after extraction on GitHub's Ubuntu image for both
        # `ci` and `install`. pnpm consumes the separately committed frozen lock
        # and avoids that hosted npm defect without weakening dependency pins.
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
      - name: Build Hexo
        run: pnpm run build
      - name: Verify blog behavior and generated routes
        run: node --test tools/blog-regression.test.cjs tools/blog-built.test.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
