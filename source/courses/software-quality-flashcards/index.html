<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>软件测试与质量保证 · 冲刺复习</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1d2638; --line:#2a3550;
    --text:#e6ecf7; --muted:#93a1bd; --accent:#4A90D9; --accent2:#7EC8E3;
    --p0:#ff5d6c; --p1:#f5a623; --p2:#5fb878; --ok:#3ddc84;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:50;background:rgba(15,20,32,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .bar{flex:1;min-width:180px;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .4s}
  .pct{font-size:12px;color:var(--muted);min-width:80px;text-align:right}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  input#q{flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 11px;border-radius:8px;font-size:14px;outline:none}
  input#q:focus{border-color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:8px;
    cursor:pointer;font-size:13px;user-select:none;white-space:nowrap}
  .btn:hover{color:var(--text);border-color:var(--accent)}
  .btn.on{color:#fff;border-color:transparent}
  .btn.f0.on{background:var(--p0)} .btn.f1.on{background:var(--p1)} .btn.f2.on{background:var(--p2);color:#04210f}
  .btn.fall.on{background:var(--accent)}
  .btn.mode.on{background:var(--accent2);color:#062330}
  nav{position:fixed;top:97px;left:0;bottom:0;width:236px;overflow-y:auto;padding:14px 10px 40px;
    border-right:1px solid var(--line);background:var(--panel);font-size:13px;z-index:40}
  nav .nt{font-size:11px;color:var(--muted);letter-spacing:1px;margin:0 6px 10px;font-weight:700}
  nav a{display:block;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;margin-bottom:2px;
    border-left:2px solid transparent;transition:.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav a:hover{color:var(--text);background:var(--panel2)}
  nav a.active{color:#fff;background:var(--panel2);border-left-color:var(--accent);font-weight:600}
  main{margin-left:256px;max-width:1040px;padding:14px 22px 80px}
  @media(max-width:820px){nav{position:static;width:auto;height:auto;display:flex;flex-wrap:wrap;gap:6px;
    border-right:none;border-bottom:1px solid var(--line)}nav .nt{width:100%}
    nav a{border-left:none;border:1px solid var(--line);border-radius:20px;padding:3px 9px}main{margin-left:0}}
  .sec{margin-top:26px}
  .sec>h2{font-size:18px;border-left:4px solid var(--accent);padding-left:10px;margin:0 0 12px;
    scroll-margin-top:120px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;
    transition:border-color .2s}
  .card:hover{border-color:#3a4straight;border-color:var(--accent)}
  .card.done{opacity:.55}
  .card.done .ct{text-decoration:line-through;text-decoration-color:var(--muted)}
  .chead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
  .pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex:none;margin-top:3px;letter-spacing:.5px}
  .p0{background:rgba(255,93,108,.18);color:var(--p0);border:1px solid rgba(255,93,108,.4)}
  .p1{background:rgba(245,166,35,.16);color:var(--p1);border:1px solid rgba(245,166,35,.4)}
  .p2{background:rgba(95,184,120,.16);color:var(--p2);border:1px solid rgba(95,184,120,.4)}
  .ct{font-weight:600;font-size:14.5px;flex:1}
  .chk{flex:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;margin-top:1px}
  .chk:hover{border-color:var(--ok)}
  .card.done .chk{background:var(--ok);border-color:var(--ok);color:#04210f}
  .body{font-size:13.5px;color:#d4ddee}
  .body ul{margin:5px 0;padding-left:18px} .body li{margin:2px 0}
  .body b{color:var(--accent2)} .body .hl{color:var(--p1);font-weight:600}
  .body code{background:#0b1020;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px;
    color:#ffd479;font-family:"SF Mono",Consolas,monospace}
  .body table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12.5px}
  .body th,.body td{border:1px solid var(--line);padding:4px 7px;text-align:left}
  .body th{background:var(--panel2);color:var(--accent2)}
  .body pre{background:#0b1020;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;
    font-size:12px;color:#cfe0ff;font-family:"SF Mono",Consolas,monospace;line-height:1.5}
  /* flashcard hidden */
  body.flip .hideable{filter:blur(6px);cursor:pointer;user-select:none;position:relative}
  body.flip .hideable::after{content:"👆 点击查看";position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;color:var(--accent2);font-size:13px;filter:none;font-weight:600}
  body.flip .hideable.show{filter:none}
  body.flip .hideable.show::after{display:none}
  /* 翻面卡 */
  .flipbtn{flex:none;font-size:11px;color:var(--accent2);background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;padding:3px 8px;cursor:pointer;margin-top:0;white-space:nowrap;user-select:none}
  .flipbtn:hover{border-color:var(--accent2);color:#fff}
  .qhead{font-size:12px;color:var(--accent2);margin-bottom:9px;font-weight:600}
  .qitem{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:9px;background:#0d1424}
  .qitem:last-child{margin-bottom:0}
  .qt{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .qtype{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(74,144,217,.22);color:var(--accent2)}
  .qid{font-size:11px;color:var(--muted)}
  .qstem{font-size:13.5px;color:#e9eff8;line-height:1.7}
  .qa{margin-top:8px;padding:8px 11px;background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.28);
    border-radius:7px;font-size:13px;color:#c2ead2;line-height:1.7}
  .qa b{color:#9be3b4}
  .card.hasq{border-color:rgba(126,200,227,.35)}
  .hint{color:var(--muted);font-size:12px;margin:2px 0 0}
  .mnemo{margin-top:9px;padding:8px 11px;background:rgba(245,166,35,.12);border:1px dashed rgba(245,166,35,.55);
    border-radius:9px;font-size:13px;color:#ffd479;line-height:1.55}
  .mnemo b{color:#ffe9a8}
  .tip{background:linear-gradient(135deg,rgba(74,144,217,.12),rgba(126,200,227,.08));
    border:1px solid rgba(74,144,217,.3);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:13.5px}
  .tip b{color:var(--accent2)}
  .trap{border-left:3px solid var(--p0)}
  .full{grid-column:1/-1}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a3550;border-radius:6px}
  .x{color:var(--p0);font-weight:700}.v{color:var(--ok);font-weight:700}
  @media print{header,nav,.controls,.chk{display:none}body{background:#fff;color:#000}.card{break-inside:avoid;border:1px solid #ccc}
    body.flip .hideable{filter:none}}
</style>
</head>
<body class="flip">
<header>
  <div class="htop">
    <a href="/courses/" class="btn" style="text-decoration:none">← 课程</a>
    <h1>软件测试与质量保证 <small>冲刺复习 · 全书考点</small></h1>
    <div class="bar"><i id="prog"></i></div>
    <span class="pct" id="pct">0 / 0 已背</span>
  </div>
  <div class="controls">
    <input id="q" placeholder="🔍 搜索知识点（如 环路复杂度 / 等价类 / 桩模块）">
    <button class="btn fall on" data-f="all">全部</button>
    <button class="btn f0" data-f="0">P0 必背</button>
    <button class="btn f1" data-f="1">P1 重点</button>
    <button class="btn f2" data-f="2">P2 了解</button>
    <button class="btn mode on" id="modeBtn">翻卡模式：开</button>
    <button class="btn" id="resetBtn">清空进度</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>🔄 蓝色边框的卡片＝已绑定云班课练习题（来自你练习区导入的云班课 quiz，按关键词匹配到对应知识点）：默认显示题目，先做、再点「🔄 看知识点」翻面对答案 · 数据存本机浏览器 · 可 Ctrl/⌘+P 打印</footer>

<script>
/* ============== 数据：p=优先级(0最高) t=标题 b=内容HTML  flip=可隐藏(默认true) ============== */
const D=[
{g:"⭐ 设计题套路（46分·必练）",items:[
 {p:0,t:"逻辑覆盖 6 种（强度由弱到强）",b:`口诀：<b>语→判→条→判/条→组合→路径</b><table><tr><th>覆盖</th><th>要求</th></tr><tr><td>语句</td><td>每条<span class=hl>语句</span>至少执行1次（最弱）</td></tr><tr><td>判定</td><td>每判定<span class=hl>真假分支</span>各≥1次</td></tr><tr><td>条件</td><td>每个<span class=hl>条件</span>取真/假各≥1次</td></tr><tr><td>判定/条件</td><td>同时满足上两者</td></tr><tr><td>条件组合</td><td>判定内条件<span class=hl>所有组合</span>≥1次（除路径外最强）</td></tr><tr><td>路径</td><td>每条<span class=hl>路径</span>≥1次（最强/最彻底）</td></tr></table>关系：<b>路径⊇判定⊇语句</b>；条件覆盖<span class=x>不一定</span>满足判定覆盖；100%覆盖<span class=x>不能</span>保证程序正确。`},
 {p:0,t:"白盒例题：语句覆盖 & 路径覆盖",b:`<pre>int main(x,y,z){
 int n=1;
 if(x>0||y&lt;0) n=n+x;   //D1(2条件)
 else            n=n+y;
 if(z>0)         n=n+z;   //D2
 return n;}</pre><b>语句覆盖(最少2例)</b>：(1,1,1)走n+x、n+z；(-1,1,-1)走n+y。<br><b>路径覆盖(4例=2判定×2)</b>：TT(1,1,1)、TF(1,1,-1)、FT(-1,1,1)、FF(-1,1,-1)。<br>诀窍：D1要假 → x≤0 <b>且</b> y≥0 同时成立。`},
 {p:0,t:"环路复杂度 V(G) 三公式（必背）",b:`<table><tr><th>方法</th><th>公式</th></tr><tr><td>区域法</td><td>V(G)=<span class=hl>封闭区域数+1</span>(含图外)</td></tr><tr><td>边点法</td><td>V(G)=<span class=hl>E−N+2</span>(E边,N结点)</td></tr><tr><td>判定法</td><td>V(G)=<span class=hl>P+1</span>(P=判定结点数)⭐最快</td></tr></table>含义：=<b>基本独立路径条数</b>=覆盖所有语句所需用例数<b>上界</b>。例：边14结点10 → 14−10+2=<span class=hl>6</span>。建议V(G)≤10。`,m:"记三个：<b>区域数</b> / <b>边减点加2</b>(E-N+2) / <b>判定加1</b>(P+1)。考试用 P+1 最快"},
 {p:0,t:"基本路径测试 4 步骤",b:`<b>①画控制流图</b>（顺序语句合并成1结点；分支汇合处补汇聚结点；复合条件 <code>a&&b</code> 拆成多个判定结点）→ <b>②算V(G)</b>(用P+1，E−N+2验证) → <b>③列独立路径</b>(每条至少含1条新边，共V(G)条) → <b>④设计用例</b>(给每路径凑输入)。<br>注意：基本路径只要 <span class=hl>V(G)</span> 条独立路径，不是全部组合。`},
 {p:0,t:"边界值分析法（一般法 9 用例）",b:`定义：对输入/输出<b>边界</b>取值，是等价类的<b>补充</b>。<br>范围[a,b]取 <code>a,a+1,…,b-1,b</code>（含越界 a-1、b+1）；个数取 最小/最大/最小-1/最大+1。<br><b>例</b> f(x,y),x∈[100,200],y∈[5,15]：每次一个变量取边界、另一个取标称 → x∈{100,101,199,200}+y标称(4)、y∈{5,6,14,15}+x标称(4)、全标称(1)=<span class=hl>9个</span>。`},
 {p:0,t:"等价类划分法",b:`分<b>有效等价类</b>(合理输入,验证功能)/<b>无效等价类</b>(不合理)。<br><b>划分原则</b>：范围/个数→1有效+<span class=hl>2无效</span>；"必须如何"/集合/布尔→1有效+1无效；n值分别处理→n有效+1无效。<br><b>选用例</b>：有效用例<b>尽量多覆盖</b>未盖有效类；无效用例每次<b>只覆盖1个</b>未盖无效类。<br>黑盒策略首选等价类。`},
 {p:1,t:"因果图法",b:`适合<b>输入条件的各种组合</b>，最终生成<b>判定表(决策表)</b>。<br>步骤：分析原因/结果→画因果图→标约束→转判定表→每列设计用例。<br>符号：<b>恒等/非~/或∨/与∧</b>；约束 <b>E互斥、I包含、O唯一、R要求、M屏蔽</b>。`},
 {p:1,t:"功能图法 / 状态图",b:`功能图=<b>状态迁移图+逻辑功能模型</b>(黑+白盒混合)。<br>状态迁移图：<b>结点=状态Sn，弧=迁移/条件Mn</b>，本质即控制流程图。<br>设计题要点：①每界面/状态设Sn ②每动作/判断设Mn ③箭头连接(出错回S0) ④<b>另起一表写清Sn/Mn含义</b>。<span class=x>不能画成流程图！</span>常接着画控制流图→算V(G)→列独立路径。`},
 {p:1,t:"循环测试 & 测试方法选择策略",b:`循环4类：简单/嵌套/连锁/非结构。简单循环测：0次、1次、2次、m次、n-1/n/n+1次。<br><b>选择策略</b>：先等价类→<b>任何情况必用边界值(查错最强)</b>→错误推测补充→查逻辑覆盖→组合情况用因果图/判定表。`},
]},

{g:"第一章 质量",items:[
 {p:0,t:"质量的定义",b:`一组<b>固有特性</b>满足<b>要求</b>的程度。两层含义：①本身特征特性 ②是否满足客户要求。<br>IEEE：系统/部件/过程满足客户明确需求或期望的不同程度。`},
 {p:0,t:"质量的5个属性",b:`<b>客户、成本、社会、可测、可预见</b>性。（客户属性=质量相对客户存在）`,m:"首字编故事「<b>客</b>人<b>成</b>了<b>社</b>会名流，<b>可测</b>量、<b>可预见</b>」→ 客·成·社·测·见"},
 {p:1,t:"与质量相关的6概念",b:`<b>组织、过程、产品、服务、客户、体系</b>。过程=将输入转化为输出的活动。`},
 {p:1,t:"质量概念3层次",b:`①符合性质量(合标准) ②适用性质量(让客户满意) ③广义质量(让客户愉快,超出期望)。`},
 {p:1,t:"4种质量观点 & 客户关系",b:`制造者(符合规格)/产品(固有性能)/用户(满足使用目的)/价值(愿付报酬)。最终:<b>客户决定质量</b>。<br>客户与质量<b>相互依赖</b>：客户是接受者，质量由客户判定。`},
 {p:1,t:"质量管理三步曲（朱兰）",b:`<b>质量策划、质量控制、质量改进</b>。质量方针由<b>最高管理者</b>批准。`},
 {p:2,t:"内/外部客户、质量管理体系",b:`内部客户(组织内部门/员工,分职级/职能/工序/流程)；外部客户(受组织影响的外部个人/组织)。<br>质量管理体系=在质量方面<b>指挥和控制</b>组织的管理体系。`},
]},

{g:"第二章 软件质量",items:[
 {p:0,t:"软件缺陷定义（内/外）",b:`<b>内部</b>看=开发/维护中的错误、毛病等问题；<b>外部</b>看=系统所需功能的<b>失效或违背</b>。`},
 {p:0,t:"软件质量 3A 特性",b:`<b>可说明性 Accountability、有效性 Availability、易用性 Accessibility</b>。`,m:"三个都是 <b>A</b> 开头 → 「3个A」：A可说明·A有效·A易用"},
 {p:0,t:"软件质量 3 维特性",b:`<b>功能性、可靠性、性能</b>。`,m:"谐音「<b>功靠性</b>」：功能·可靠·性能"},
 {p:0,t:"软件质量3方面 & ISO9126六特性",b:`质量3方面：软件<b>产品</b>质量、<b>开发过程</b>质量、<b>商业环境</b>质量。<br>ISO9126：<b>功能性、可靠、易用、效率、可维护、可移植</b>。<br>💡「<b>功靠用，效维移</b>」<br>ANSI/IEEE STD729：软件产品满足规定的和隐含的与<b>需求能力</b>有关的全部特征和特性。`},
 {p:1,t:"V模型 & 极限编程XP",b:`V模型缺点：需求阶段隐藏问题拖到验收测试才发现。<br>XP理念：个体交互>过程工具、可工作软件>文档、客户合作>合同、响应变化>计划。格言:<b>沟通/简化/反馈/勇气</b>。<br>XP适合:<b>小团队(2-10)、高风险、需求快变、强调可测试性</b>。`},
 {p:1,t:"软件缺陷表现 & 产生原因",b:`表现：功能未实现/设计缺陷/结果不符/运行出错/数据不正确/不可接受问题。<br>产生：期限压力、复杂度、沟通不良、疲劳、缺经验、不懂需求 + 技术问题(算法/语法/精度/接口)。<br>主要原因(选择题)：<b>软件需求规格说明错误</b>。`},
 {p:1,t:"软硬件可靠性区别",b:`软件每个拷贝完全一样；硬件同规格也有微小差别。软件不会"耗损"，设计阶段质量尤其重要。`},
 {p:2,t:"软件开发基本过程",b:`需求分析→设计(概要+详细)→编程→测试→维护。`},
]},

{g:"第三章 软件质量工程体系",items:[
 {p:0,t:"软件质量工作4层次",b:`<b>质量方针 → 质量管理 → (质量控制 + 质量保证 + 质量改进)</b>。<br>质量控制:设标准→测结果→判定→补救。质量保证:有计划有组织活动,提供<b>信任</b>(内部/外部)。质量管理:增强满足质量要求的能力(持续过程)。`},
 {p:0,t:"质量改进 6西格玛 DMAIC",b:`<b>界定→测量→分析→改进→控制</b>(Define-Measure-Analyze-Improve-Control)。达6σ=百万分之3~4瑕疵。`,m:"DMAIC=「<b>定·测·析·改·控</b>」：界定→测量→分析→改进→控制"},
 {p:0,t:"质量改进 IDEAL 模型",b:`<b>初始化→诊断→建立→行动→学习</b>。`,m:"IDEAL 本身=「<b>理想</b>」：<b>I</b>nitiating初始·<b>D</b>iagnosing诊断·<b>E</b>stablishing建立·<b>A</b>cting行动·<b>L</b>earning学习"},
 {p:0,t:"软件质量成本（经典模型）",b:`<b>质量成本=保证成本+损失成本</b>；<b>保证成本=预防成本+评价成本</b>；损失成本=内部失效+外部失效。<br>劣质成本(PONC/COPQ)高达46%~80%，分:故障/过程/损失成本。修复缺陷最贵的阶段=<b>发布</b>。`,m:"保证成本=<b>预防+评价</b>(事前花钱)；损失成本=<b>内部+外部</b>(出事赔钱)"},
 {p:1,t:"软件6品质要素",b:`<b>正确性、可靠性、易用性、效率、可维护性、可移植性</b>。`,m:"谐音「<b>正靠用，效维移</b>」(就是把ISO9126的'功能'换成'正确')"},
 {p:1,t:"三大质量模型评价（简答）",b:`McCall(1977,11指标,产品操作/修订/转移)、Boehm(1978)、ISO(6目标)。<br>评价:有<b>差别</b>(定义不一致)、思想<b>接近</b>、目的<b>相同</b>(因素-准则-度量)；<b>ISO一二层关系清楚,不像另两个有交叉</b>。McCall产品修订维度:可维护性/灵活性/可测试性。`},
 {p:2,t:"质量指标 vs 质量因素",b:`质量指标:衡量可识别质量特性的项目。质量因素:<b>影响质量特性/指标的参数</b>。标准体系层次:原理标准/要素标准/指南补充。`},
]},

{g:"第四章 软件质量度量",items:[
 {p:0,t:"测量 / 度量 / 指标",b:`<b>测量</b>:对某属性提供<b>定量指示</b>。<b>度量</b>:范围广泛的<b>定量测量</b>。<b>指标</b>:一组度量组合,提供全面评价。`},
 {p:0,t:"质量度量3类研究对象",b:`<b>项目</b>质量度量、<b>产品</b>质量度量、<b>过程</b>质量度量。`},
 {p:0,t:"测量标准最重要2指标",b:`<b>有效性</b>(结果正确反映实际)和<b>可靠性</b>(多次测量值一致)。可靠性差=技术待改进;有效性差=原则性错误。`},
 {p:1,t:"度量4尺度",b:`<b>分类、序列、间隔、比值</b>尺度。间隔无绝对零、比值有绝对零。`},
 {p:1,t:"项目度量内容",b:`<b>规模、复杂度、缺陷、进度、风险、工作量</b>度量。风险=概率×损失。规模度量法:德尔菲法、构造性成本模型、代码行、功能点、对象点(无历史数据用<b>德尔菲法/功能点</b>)。`},
 {p:1,t:"缺陷度量 & 复杂性度量",b:`缺陷密度(每KLOC缺陷数,规模上分布)、缺陷率(时间分布)、缺陷清除率。<br>复杂性:McCabe环形复杂度(拓扑结构度量,只适合模块内部,不考虑模块间耦合);语法构造法 缺陷率=<code>0.15+0.23 DO WHILE+0.22 SELECT+0.07 IF-THEN-ELSE</code>。`},
 {p:1,t:"测量原则（简答）",b:`基于正确理论+定目标、一致客观无二义、有说服力、简单可计算、可剪裁可自动化、用统计技术、可靠、有反馈机制。`},
 {p:2,t:"统计分析 & Pareto",b:`Pareto规则:80%缺陷由20%主要因素造成,分离这20%。直接度量(缺陷数/性能)vs间接度量(复杂性/满意度)。`},
]},

{g:"第五章 软件质量标准",items:[
 {p:0,t:"CMMI 五级（必背）",b:`<b>初始级→可重复级→已定义级→已管理级→优化级</b>。<br>已管理级(4级):设质量/生产目标并量化测量;优化级(5级):统计技术持续改进。`,m:"「<b>初·重·定·管·优</b>」一级比一级成熟：初次→可重复→已定义→已管理→优化"},
 {p:0,t:"CMMI 内容3级别 & 流程改进3步",b:`内容:<b>必需的(目标)、期望的(方法)、提供信息的</b>。<br>流程改进:<b>确定总体框架→细化框架内要求→明确度量方法与标准</b>。`},
 {p:1,t:"标准的5层次",b:`<b>国际标准</b>(ISO)→<b>国家标准</b>(GB/ANSI)→<b>行业标准</b>(IEEE/GJB)→<b>企业规范</b>→<b>项目规范</b>。`,m:"「<b>国际→国家→行业→企业→项目</b>」适用范围由大到小"},
 {p:1,t:"软件过程能力成熟度",b:`指一个特定过程被明确<b>定义、管理、测量、控制</b>并且<b>有效</b>的程度。每级含若干KPA(关键过程域)。每个软件企业均具备1级。`},
 {p:2,t:"ISO9001-3 vs CMM / 常用标准",b:`都以全面质量管理为基础,但属两个体系。ISO9000-3=软件实施指南;CMM=描述软件过程能力的模型(SEI,卡内基梅隆)。IEEE1012=验证与确认。`},
]},

{g:"第六章 软件评审",items:[
 {p:0,t:"评审5方法（最不正式→最正式）",b:`<b>临时评审→轮查→走查→小组评审→审查</b>。<br><b>审查(Inspection)最正式、最严格、最有效</b>。评审越正式效率越高。`,m:"「<b>临·轮·走·组·审</b>」正式度递增，审查(Inspection)最正式最有效"},
 {p:0,t:"走查 vs 审查（简答）",b:`区别在<b>正式性等级</b>,审查更正式。走查只限被评审文档意见;审查还结合<b>改进开发方法自身</b>,贡献更大。`},
 {p:0,t:"为什么要评审（简答）",b:`<b>成本</b>:缺陷越晚纠正越贵,尽早发现减少返工;<b>技术</b>:前阶段错误会累积放大;<b>效率</b>:开发/项目/测试/维护各方受益。`},
 {p:1,t:"评审4内容 & 文档评审",b:`<b>管理评审</b>(最高管理者发起,评适宜/有效/充分性)、<b>技术评审</b>(产品及各阶段输出)、<b>文档评审</b>(需求/设计/代码/质量验证)、<b>过程评审</b>(监控流程是否遵守)。`},
 {p:1,t:"评审会议4结果",b:`<b>接受 / 有条件接受 / 不能接受 / 评审未完成</b>。注意事项:防人身攻击、防无休止争论、防偏离中心、鼓励发言。`},
 {p:2,t:"评审技术 & 成功要素",b:`缺陷检查表、规则集、评审工具(ARM)、不同角色、场景。主观因素(培训/防冲突/排进度);客观因素(异步评审/分布式评审)。`},
]},

{g:"第七章 SQA组织",items:[
 {p:0,t:"三种SQA组织结构（简答）",b:`<b>独立SQA部门</b>:优=独立客观/资源共享,缺=难深入/问题难及时解决。<br><b>独立SQA工程师</b>:优=深入项目/及时解决,缺=缺沟通/独立性不足。<br><b>独立SQA小组</b>:综合二者优点(最完善)。`},
 {p:0,t:"质量保证人员主要工作（简答）",b:`定SQA计划、参与过程描述、<b>评审</b>工程活动、<b>审计</b>工作产品、记录偏差、报告并跟踪、协调变更/收集度量。<br>SQA目标:独立审查监控生产、提供质量信息、辅助工程组得高质量产品。<b>不负责</b>:生产产品、制定质量计划。`},
 {p:1,t:"评审Review vs 审核Audit",b:`<b>评审</b>:过程进行时对过程检查(评审会);<b>审核</b>:工作产品生成时对产品检查。SEPG="立法",SQA="监督"。`},
 {p:1,t:"SQA与各角色关系",b:`与项目经理=合作;与开发=沟通合作(忌对立);与测试=都是第三方,SQA管流程、测试管产品;与SEPG=SEPG定过程、SQA保证执行。`},
 {p:2,t:"SQA人员要求 & 六西格玛带",b:`要求:技术基础/沟通/敏锐客观/积极/独立。认证:CSQA/CSQE。6σ等级:<b>绿带→黑带→黑带大师→倡导者</b>。理想开发:测试=1:2。`},
]},

{g:"第八章 提高软件设计质量",items:[
 {p:0,t:"耦合 & 内聚（简答常考）",b:`指导思想:<b>降低耦合、提高内聚</b>。<br>耦合从高到低(越低越好):<b>内容→公共环境→控制→数据</b>。<br>内聚从高到低(越高越好):<b>功能→顺序→通信→过程→时间→逻辑→偶然</b>。`,m:"耦合「<b>内·公·控·数</b>」越后越低越好；内聚「<b>功·顺·通·过·时·逻·偶</b>」越前越好(功能最好、偶然最差)"},
 {p:0,t:"软件设计7技术原则",b:`<b>开-闭、单一职责、里氏代换、依赖倒转、接口隔离、合成/聚合复用、迪米特</b>(最少知识)。<br>开闭:对扩展开放、对修改封闭。里氏:基类出现处子类一定能出现。依赖倒转:针对接口编程。`,m:"「<b>开·单·里·依·接·合·迪</b>」：开闭·单一职责·里氏·依赖倒转·接口隔离·合成复用·迪米特"},
 {p:1,t:"软件设计两阶段 & 目标",b:`<b>概要设计</b>(总体/体系结构,需求→数据结构+系统结构+子系统接口) + <b>详细设计</b>(细化得数据结构和算法)。基本原则:以质量为目标、越简单越好。`},
 {p:1,t:"体系结构模型 & 分类",b:`模型:<b>结构/框架/动态/过程/功能</b>模型。分类:单用户、<b>C/S</b>(客户机服务器)、<b>B/S</b>(浏览器服务器,C/S改进)、中间件多层分布式(客户与资源分开,降服务器负载)。`},
 {p:1,t:"设计模式（GoF三类）",b:`<b>创建型</b>(抽象实例化)、<b>结构型</b>(组合接口/对象)、<b>行为型</b>(算法+职责分配)。4要素:<b>模式名称、问题、解决方案、效果</b>。`},
 {p:2,t:"详细设计表示方法 & 界面",b:`流程图、伪码、IPO图、PAD问题分析图、判定表。界面原则:一致性、自助功能、易懂。Windows规则:易用/规范/帮助/美观/独特/快捷键/错误保护。`},
 {p:2,t:"J2EE / .Net / 数据库",b:`J2EE四层(客户/Web/业务逻辑/EIS);.Net三层(UI/业务逻辑/数据层)。数据字典:对数据项/结构/流/存储/逻辑/外部实体定义描述。`},
]},

{g:"第九章 高质量编程",items:[
 {p:0,t:"const 用法（填空高频）",b:`参数是<b>指针且仅作输入</b>用→类型前加 <code>const</code> 防意外修改。const只能修饰<b>输入</b>参数。值传递对象宜改 <code>const&amp;</code> 省构造析构。`},
 {p:1,t:"命名规则",b:`类名/函数名:大写字母开头单词组合;变量/参数:小写开头;常量:全大写+下划线。静态变量前缀 <code>s_</code>,全局 <code>g_</code>,类数据成员 <code>m_</code>。变量用名词;全局函数用动词。`},
 {p:1,t:"基本语句 if 规则",b:`布尔:<code>if(flag)</code>不可与TRUE/1比;整型:<code>if(value==0)</code>直接比;浮点:<span class=x>不可</span>用==/!=,转 <code>(x&gt;=-EPS&&x&lt;=EPS)</code>;指针:与NULL比。`},
 {p:1,t:"内存管理 & 野指针",b:`3种分配:静态存储区/栈/堆(malloc/new动态)。对策:申请后查NULL、赋初值、申请释放配对、free/delete后<b>立即置NULL</b>(防野指针)。野指针≠NULL指针,if判断不起作用。`},
 {p:2,t:"文件结构 & 版式",b:`定义文件3部分:版权版本声明、头文件引用、实现体。头文件用 <code>ifndef/define/endif</code> 防重复引用,只放声明不放定义。一行只做一件事,return错误标志、输出参数取正常值。`},
]},

{g:"第十章 软件测试",items:[
 {p:0,t:"软件测试定义 & 目标",b:`测试是为<b>发现错误</b>而执行程序的过程。目标:更快更早找问题、促程序员解决、提供高质量产品。`},
 {p:0,t:"测试原则",b:`标准建立在<b>用户需求</b>之上;尽早不断测试;预先定义质量标准;给出<b>预期结果</b>;<b>穷举测试不可能</b>;<b>第三方</b>测试更客观;对发现错误多的程序段更深入测;保留测试用例至产品废弃。`},
 {p:0,t:"测试 vs 调试（简答）",b:`测试=<b>找错</b>(已知条件/预知结果/有计划/独立组/工具支持);调试=<b>改错/推理</b>(未知内部条件/结果不可预见/开发者做)。`},
 {p:0,t:"回归测试（简答）",b:`修改代码后用<b>原有用例重测</b>,确认修改没引入新错/不影响原有功能。目的:修改达预定目的且不影响原功能正确性。`},
 {p:0,t:"单元/集成/系统测试侧重（简答）",b:`<b>单元</b>=模块内部正确性(最低级,程序员做);<b>集成</b>=模块间<b>接口/参数传递</b>(专门测试组);<b>系统</b>=整个系统运行+兼容性(站用户角度)。`},
 {p:1,t:"验证V&V & 桩/驱动模块",b:`<b>验证Verification</b>=building right?符合规格;<b>确认Validation</b>=building right product?满足用户需求。<br><b>桩模块</b>=模拟被调用的<b>下级</b>;<b>驱动模块</b>=模拟<b>上级主程序</b>。`},
 {p:1,t:"测试 vs SQA 关系",b:`相同:都贯穿全生命周期、相辅相成。不同:SQA侧重<b>流程过程管理控制</b>,测试是控制策略的<b>具体执行</b>(质量控制最主要手段)。`},
 {p:1,t:"验收测试 α/β & 回归策略",b:`α测试=内部人员模拟用户;β测试=外部典型用户实际使用。回归包选择:全测/基于风险/基于操作剖面/测修改部分。`},
 {p:2,t:"测试脚本5种 & 测试3信息",b:`线性/结构化/共享/数据驱动/关键字驱动脚本。测试需3类信息:软件配置、测试配置、测试工具。集成方式:一次性组装、增殖性组装(自顶向下/自底向上)。`},
]},

{g:"第十一章 白盒测试",items:[
 {p:0,t:"白盒测试定义",b:`又称<b>结构测试/逻辑驱动测试</b>。按程序内部结构测试,检验每条通路。适合<b>单元、集成</b>测试,不适合系统测试。根据<b>内部逻辑</b>设计用例。`},
 {p:0,t:"白盒测试重点5项（简答）",b:`<b>接口</b>(进出数据)、<b>局部数据结构</b>(完整性)、<b>边界条件</b>(临界值)、<b>独立路径</b>(计算/判定/控制流错)、<b>错误处理</b>(内部错误设施)。`},
 {p:1,t:"程序插装 & 变异测试",b:`<b>程序插装</b>:插入探针抛出运行特征数据,获控制流/数据流信息。<b>变异测试</b>:对源程序细小修改生成变异体,评判用例集完备性(理论完备但耗资源)。`},
 {p:2,t:"控制流图简化注意",b:`复合条件(逻辑运算符连接)需拆成单条件嵌套判定。独立路径=含1条以前没处理过的边。基路径测试给出测试上限。`},
]},

{g:"第十二章 黑盒测试",items:[
 {p:0,t:"黑盒测试定义",b:`又称<b>功能测试/数据驱动测试</b>。不考虑内部结构,在接口测试功能。适合功能/易用性/验收/确认测试,不适合单元/集成。<br>发现错误:功能错误遗漏、界面、数据结构、性能、初始化终止。`},
 {p:0,t:"黑盒用例设计方法（清单）",b:`<b>等价类划分、边界值分析、因果图(判定表驱动)、功能图、错误推测法</b>。<span class=x>逻辑覆盖/变异测试不属于黑盒</span>。`,m:"「<b>等·边·因·功·错</b>」：等价类·边界值·因果图·功能图·错误推测"},
 {p:1,t:"等价类典型坑",b:`年龄16-40 → 1有效+<b>2无效</b>。1&lt;X&lt;100边界取0,1,2,99,100,101(不取的:仅说X=0/101不全)。错误推测法=凭经验列可能错误选用例。`},
]},

{g:"第十三章 集成测试",items:[
 {p:0,t:"集成测试定义 & vs单元",b:`单元测试基础上把多模块组装测试,主要查<b>模块间接口</b>。单元看接口=从内部查实参形参匹配;集成看接口=<b>穿越接口的数据是否正确/丢失</b>。`},
 {p:1,t:"集成测试5任务",b:`①模块连接数据是否丢失 ②子功能组合能否达预期 ③模块功能是否互相不利影响 ④全局数据结构是否被异常修改 ⑤误差累积是否放大到不可接受。`},
 {p:1,t:"集成测试方法 & 过程",b:`非增量式 / 增量式(<b>自顶向下、自底向上</b>)。自底向上需写<b>驱动程序</b>。过程3阶段:<b>计划→设计实现→执行评估</b>。主要发现<b>概要设计</b>阶段错误。`},
]},

{g:"第十四章 系统测试",items:[
 {p:0,t:"系统测试定义 & 范围",b:`将通过集成测试的软件,与硬件/外设/支撑软件组合进行测试,与<b>需求定义</b>比较找不符。范围含软件+硬件+外设+接口。站<b>用户角度</b>评价,主要用<b>黑盒</b>技术。`},
 {p:0,t:"负载/容量/强度测试区别（简答）",b:`<b>负载</b>=一定负荷下的响应时间;<b>强度(压力)</b>=长时间/超负荷连续运行的影响,检测最高限度;<b>容量</b>=极限值下仍正常运行。`},
 {p:1,t:"系统测试主要方法",b:`性能、强度(压力)、安全性、兼容性、恢复、GUI、安装、可靠性、配置、可用性、文档、网站测试。性能2方面:时间性能(响应时间)/空间性能(系统资源)。`},
 {p:1,t:"性能测试（简答）",b:`用自动化工具模拟<b>正常/峰值/异常</b>负载测各项性能指标。含<b>客户端、网络、服务器端</b>三方面。环境尽量与生产一致。`},
 {p:2,t:"安全性两级 & 恢复/可靠性",b:`安全性:应用程序级 + 系统级。恢复测试查<b>容错能力</b>。可靠性指标:平均无故障时间MTBF、停机时间。配置测试:各种软硬件平台。`},
]},

{g:"第十五章 验收测试",items:[
 {p:0,t:"验收测试定义",b:`功能测试和系统测试之后、<b>产品发布之前</b>的测试,<b>技术测试最后阶段</b>,也称交付测试。由<b>用户和测试部门共同</b>执行,在<b>实际用户运行环境</b>中进行。`},
 {p:1,t:"用户界面7要素",b:`<b>符合标准和规范、直观性、一致性、灵活性、舒适性、正确性、实用性</b>。易用性测试主观性强、无量化指标。`,m:"「<b>标·直·一·灵·舒·正·用</b>」：符合标准·直观·一致·灵活·舒适·正确·实用"},
 {p:1,t:"验收内容 & α/β",b:`内容:易用性、兼容性、安装、文档测试。产品规格说明书审核可去除60%错误。α(内部模拟用户)→β版本→β(外部典型用户)。`},
 {p:2,t:"兼容性 & 安装/恢复",b:`兼容:硬件/软件/数据;向后兼容=可用以前版本,向前兼容=可用未来版本。恢复测试查容错,强制故障验证恢复。文档测试查正确性/完备性/可理解性。`},
]},

{g:"🚨 判断题陷阱集（看到=判错）",items:[

<tr><td>软件测试就是软件质量保证</td><td class=x>✗</td></tr>
<tr><td>软件缺陷可以绝对避免/消除</td><td class=x>✗</td></tr>
<tr><td>劣质成本最终可以被消除</td><td class=x>✗</td></tr>
<tr><td>程序的正确性足以体现软件价值</td><td class=x>✗</td></tr>
<tr><td>100%逻辑覆盖率就能保证程序正确/揭露所有缺陷</td><td class=x>✗</td></tr>
<tr><td>文档编写与否不影响质量</td><td class=x>✗</td></tr>
<tr><td>测量和度量都是定性测量</td><td class=x>✗(定量)</td></tr>
<tr><td>单元测试能发现约80%缺陷</td><td class=x>✗</td></tr>
<tr><td>客户期望值比产品质量更重要</td><td class=x>✗</td></tr>
<tr><td>降低内聚、提高耦合(反了)</td><td class=x>✗</td></tr>
<tr><td>需求分析是转化用户需求的唯一途径</td><td class=x>✗(软件设计才是)</td></tr>
<tr><td>资深程序员的程序无需测试</td><td class=x>✗</td></tr>
<tr><td>自动化测试一定比手工发现更多缺陷</td><td class=x>✗</td></tr>
<tr><td>严格测试后软件可以没有缺陷</td><td class=x>✗</td></tr>
<tr><td>软件测试=程序测试 / 是开发末期才做</td><td class=x>✗</td></tr>
</table>`,flip:false},
 {p:0,t:"6条「正确」说法（判对）",b:`<table><tr><th>说法</th><th>判</th></tr>
<tr><td>故障是软件缺陷的外在表现</td><td class=v>✓</td></tr>
<tr><td>发现错误多的模块,残留错误也多(缺陷群集)</td><td class=v>✓</td></tr>
<tr><td>测试已扩展到错误预防范畴</td><td class=v>✓</td></tr>
<tr><td>软件测试是有风险的,并非所有缺陷都能修复</td><td class=v>✓</td></tr>
<tr><td>审查是最正式有效的评审方法</td><td class=v>✓</td></tr>
<tr><td>自底向上集成需写驱动程序</td><td class=v>✓</td></tr></table>`,flip:false},
]},

{g:"🎯 选择题易错锚点 & 口诀",items:[
 {p:0,t:"选择题死记答案",b:`<ul><li>软件错误主要原因→<b>需求规格说明错误</b></li><li>发现错误最弱→<b>语句覆盖</b>;最强→<b>条件组合覆盖</b></li><li>不属白盒技术→<b>边界值分析</b>(黑盒)</li><li>基本路径最少用例数→<b>环路复杂度V(G)</b></li><li>与设计用例无关文档→<b>项目开发计划</b></li><li>软件工程最终目标→<b>使软件生产工程化</b></li><li>测试用例两部分→输入数据+<b>预期输出结果</b></li><li>黑盒首选→<b>等价类划分</b>;必用→<b>边界值</b></li><li>测试人员介入最佳阶段→<b>需求阶段</b></li><li>修复缺陷最贵阶段→<b>发布</b></li></ul>`,flip:false},
 {p:0,t:"必背口诀汇总",b:`<ul><li>质量3A:可说明/有效/易用</li><li>质量3维:功能/可靠/性能</li><li>质量属性:客户/成本/社会/可测/可预见</li><li>DMAIC:界定测量分析改进控制</li><li>IDEAL:初始化诊断建立行动学习</li><li>CMMI五级:初始→可重复→已定义→已管理→优化</li><li>逻辑覆盖:语判条/判条/组合路径(弱→强)</li><li>V(G)三公式:区域 / E−N+2 / P+1</li><li>评审5法:临时轮查走查小组审查</li><li>质量成本=保证(预防+评价)+损失(内+外)</li></ul>`,flip:false},
]},
];

{i:`17-07`,z:`17`,c:`06`,t:`填空`,q:`评审的方法包括 （填空1） 、 （填空2） 、 （填空3） 、 （填空4） 、 （填空5）`,a:`填空1: 临时评审；填空2: 轮查；填空3: 走查；填空4: 小组评审；填空5: 审查`},
{i:`17-08`,z:`17`,c:`06`,t:`多选`,q:`过程评审作用如下： A. 评估主要的质量保证流程 B. 考虑如何处理和解决评审过程中发现的不符合问题 C. 总结和共享好的经验 D. 指出需要进一步完善和改进的部分`,a:`A. 评估主要的质量保证流程；B. 考虑如何处理和解决评审过程中发现的不符合问题；C. 总结和共享好的经验；D. 指出需要进一步完善和改进的部分`},
{i:`17-09`,z:`17`,c:`06`,t:`判断`,q:`程评审的评审对象是质量保证流程，以及针对产品质量或其他形式的工作产出。`,a:`错误。 正确说法：过程评审主要评审软件过程或质量保证流程；产品评审才侧重产品质量和阶段工作产出。`},
{i:`17-10`,z:`17`,c:`06`,t:`多选`,q:`过程评审是 A. 对软件开发过程的评审 B. 通过对流程的监控，保证SQA组织定义的软件过程在项目中得到了遵循 C. 保证质量保证方针能得到更快更好的执行 D. 出现异常情况时，系统如何响应`,a:`A. 对软件开发过程的评审；B. 通过对流程的监控，保证SQA组织定义的软件过程在项目中得到了遵循；C. 保证质量保证方针能得到更快更好的执行`},
{i:`17-11`,z:`17`,c:`06`,t:`判断`,q:`文档评审分为格式评审和内容评审。`,a:`正确`},
{i:`17-12`,z:`17`,c:`06`,t:`多选`,q:`技术评审作为一项软件质量保证活动，作用如下： A. 揭示软件在逻辑、执行以及功能和函数上的错误 B. 验证软件是否符合需求 C. 确保软件的一致性 D. 确保使用的术语具有唯一性`,a:`A. 揭示软件在逻辑、执行以及功能和函数上的错误；B. 验证软件是否符合需求；C. 确保软件的一致性`},
{i:`17-13`,z:`17`,c:`06`,t:`判断`,q:`管理评审是对产品以及各阶段的输出内容进行评估。`,a:`错误。 正确说法：管理评审主要评价质量管理体系、过程执行和管理状态；对产品及阶段输出的评估通常属于技术评审或产品评审。`},
{i:`17-14`,z:`17`,c:`06`,t:`填空`,q:`管理评审要求各部门对管理体系目前的状况，包括 （填空1） 性、 （填空2） 性、 （填空3） 性等进行评审。`,a:`填空1: 适宜；填空2: 有效；填空3: 充分`},
{i:`17-15`,z:`17`,c:`06`,t:`多选`,q:`评审小组一般由以下角色构成 A. 协调人 B. SQA人员 C. 作者 D. 评审员`,a:`A. 协调人；C. 作者；D. 评审员`},
{i:`17-16`,z:`17`,c:`06`,t:`多选`,q:`评审可以帮助开发工程师 A. 减少修订缺陷的时间 B. 提高编程效率 C. 增强产品的可维护性 D. 减少测试和调试时间`,a:`A. 减少修订缺陷的时间；B. 提高编程效率；D. 减少测试和调试时间`},
{i:`17-17`,z:`17`,c:`06`,t:`判断`,q:`管理者、开发人员、客户有时都反对评审，因为评审会浪费时间，减缓项目的进度。`,a:`错误。 正确说法：评审的目的正是尽早发现缺陷、减少返工和降低成本，整体上有助于质量和进度控制。`},
{i:`17-18`,z:`17`,c:`06`,t:`判断`,q:`评审是对软件元素或者项目状态的一种评估手段。`,a:`正确`},
{i:`17-19`,z:`17`,c:`06`,t:`判断`,q:`评审是质量控制方面一种非常有效的方法。`,a:`正确`},
{i:`17-20`,z:`17`,c:`06`,t:`判断`,q:`同行评审的主要目标在于检测错误、核对与标准的偏离。`,a:`正确`},
{i:`17-21`,z:`17`,c:`06`,t:`单选`,q:`软件评审作为质量控制的一个重要手段，已经被业界广泛使用。评审分为内部评审和外部评审。关于内部评审的叙述，正确的包括。①对软件的每个开发阶段都要进行内部评审②评审人员由软件开发组、质量管理和配置管理人员组成，可邀请用户参与③评审人数根据实际情况确定，比如根据软件的规模等级和安全性等级等指标而定④内部评审由用户单位主持，由信息系统建设单位组织，应成立评审委员会 A. ①②④ B. ①②③ C. ②③④ D. ①②③④`,a:`B. ①②③`},
{i:`17-22`,z:`17`,c:`06`,t:`填空`,q:`管理评审由 （填空1） 发起。`,a:`填空1: 最高管理者`},
{i:`17-23`,z:`17`,c:`06`,t:`判断`,q:`代码评审是检查源代码是否达到模块设计的要求。`,a:`错误。 正确说法：代码评审不仅检查代码是否符合设计，还要检查逻辑正确性、接口、可读性、编码规范、可维护性和潜在缺陷。`},
{i:`17-24`,z:`17`,c:`06`,t:`判断`,q:`技术评审即是一种技术手段，也是一种质量管理手段。`,a:`正确`},
{i:`17-25`,z:`17`,c:`06`,t:`多选`,q:`在软件设计中，设计复审是和软件设计本身一样重要的环节，其主要的目的和作用是为了能够____________ A. 减少测试工作量 B. 避免后期付出高代价 C. 保证软件质量 D. 缩短软件开发周期`,a:`B. 避免后期付出高代价`},
{i:`17-26`,z:`17`,c:`06`,t:`多选`,q:`软件测试计划评审会需要哪些人员参加____________？ A. 项目经理 B. SQA 负责人 C. 配置负责人 D. 测试组`,a:`A. 项目经理；B. SQA 负责人；C. 配置负责人；D. 测试组`},
{i:`17-27`,z:`17`,c:`06`,t:`单选`,q:`在软件设计中，设计复审是和软件设计本身一样重要的环节，其主要的目的和作用是为了能够______。 A. 减少测试工作量 B. 避免后期付出高代价 C. 保证软件质量 D. 缩短软件开发周期`,a:`B. 避免后期付出高代价`},
{i:`17-28`,z:`17`,c:`06`,t:`填空`,q:`评审的方法包括 （填空1） 、 （填空2） 、 （填空3） 、 （填空4） 、 （填空5） 。`,a:`填空1: 临时评审；填空2: 轮查；填空3: 走查；填空4: 小组评审；填空5: 审查`},
{i:`4-01`,z:`4`,c:`07`,t:`填空`,q:`为了保证项目组能够采用合适的技术和工具，我们应该进行 （填空1）`,a:`填空1: 软件工具的评估`},
{i:`4-02`,z:`4`,c:`07`,t:`判断`,q:`审核是对工作流程的评审，而评审则主要侧重产品本身。`,a:`错误。 正确说法：审核关注活动、过程和工作产品是否符合标准与规程；评审也可以评审产品、过程或文档，不能简单归结为“审核看流程、评审看产品”。`},
{i:`4-03`,z:`4`,c:`07`,t:`判断`,q:`SQA组织负责生产高质量的软件产品和制定质量计划，责任是审计软件经理和软件工程组的质量活动并鉴别活动中出现的偏差。`,a:`错误。 正确说法：软件产品由项目和开发团队生产；SQA负责制定或协助制定质量保证计划、监督过程、审计活动并报告偏差。`},
{i:`4-04`,z:`4`,c:`07`,t:`判断`,q:`为了让SQA人员可以全心投入本职工作，所以SQA人员必须是全职的。`,a:`错误。 正确说法：SQA人员可以是全职也可以是兼职，关键是职责明确、具备独立性并能有效执行质量保证活动。`},
{i:`4-05`,z:`4`,c:`07`,t:`单选`,q:`以下三种组织结构中，哪种相对完善一些 A. 独立的SQA工程师（非独立SQA小组） B. 独立的SQA部门 C. 独立的SQA工程师（独立的SQA小组）`,a:`C. 独立的SQA工程师（独立的SQA小组）`},
{i:`4-06`,z:`4`,c:`07`,t:`判断`,q:`创建SQA部门的时候，与企业本身实际相比，更重要的是参考业界流行的各种标准（如ISO、CMMI等）。`,a:`错误。 正确说法：创建SQA组织要结合企业规模、项目特点、文化和资源情况，ISO、CMMI等标准只能作为参考和裁剪依据。`},
{i:`4-07`,z:`4`,c:`07`,t:`判断`,q:`软件工程过程组类似于一个“立法”机构，而SQA则类似于一个“监督”机构。`,a:`正确`},
{i:`4-08`,z:`4`,c:`07`,t:`判断`,q:`任何不符合客户需求的地方都可以认为是缺陷。`,a:`正确`},
{i:`4-09`,z:`4`,c:`07`,t:`多选`,q:`在企业中，最常见的质量保证组织是______。 A. 软件测试部门 B. 软件质量保证组织 C. 生产车间 D. 技术部门`,a:`A. 软件测试部门；B. 软件质量保证组织`},
{i:`4-10`,z:`4`,c:`07`,t:`判断`,q:`软件质量系统之间各不相同，说明机构SQA系统构建存在固有灵活性。`,a:`正确`},
{i:`3-01`,z:`3`,c:`07`,t:`填空`,q:`为了保证项目组能够采用合适的技术和工具，我们应该进行 （填空1）`,a:`填空1: 软件工具的评估`},
{i:`3-02`,z:`3`,c:`07`,t:`判断`,q:`审核是对工作流程的评审，而评审则主要侧重产品本身。`,a:`错误。 正确说法：审核关注活动、过程和工作产品是否符合标准与规程；评审也可以评审产品、过程或文档，不能简单归结为“审核看流程、评审看产品”。`},
{i:`3-03`,z:`3`,c:`07`,t:`单选`,q:`SQA计划实施步骤的第一步是 A. 选择SQA任务 B. 估计SQA的工作量和资源 C. 了解项目的需求，明确项目SQA计划的要求和范围 D. 安排SQA任务和日程`,a:`C. 了解项目的需求，明确项目SQA计划的要求和范围`},
{i:`3-04`,z:`3`,c:`07`,t:`判断`,q:`SQA组织负责生产高质量的软件产品和制定质量计划，责任是审计软件经理和软件工程组的质量活动并鉴别活动中出现的偏差。`,a:`错误。 正确说法：软件产品由项目和开发团队生产；SQA负责制定或协助制定质量保证计划、监督过程、审计活动并报告偏差。`},
{i:`3-05`,z:`3`,c:`07`,t:`判断`,q:`SQA人员与开发工程师本质上是对立的。`,a:`错误。 正确说法：SQA和开发工程师的共同目标都是交付高质量软件，二者应协作并相互制衡，而不是本质对立。`},
{i:`3-06`,z:`3`,c:`07`,t:`判断`,q:`为了让SQA人员可以全心投入本职工作，所以SQA人员必须是全职的。`,a:`错误。 正确说法：SQA人员可以是全职也可以是兼职，关键是职责明确、具备独立性并能有效执行质量保证活动。`},
{i:`3-07`,z:`3`,c:`07`,t:`单选`,q:`以下三种组织结构中，哪种相对完善一些 A. 独立的SQA工程师（非独立SQA小组） B. 独立的SQA部门 C. 独立的SQA工程师（独立的SQA小组）`,a:`C. 独立的SQA工程师（独立的SQA小组）`},
{i:`3-08`,z:`3`,c:`07`,t:`多选`,q:`以下属于独立SQA部门优点的是： A. 能够深入项目发现实质性问题 B. 保护SQA工程师的独立性和客观性 C. 便于部门之间经验的分享 D. 有利于资源的共享`,a:`B. 保护SQA工程师的独立性和客观性；D. 有利于资源的共享`},
{i:`3-09`,z:`3`,c:`07`,t:`判断`,q:`创建SQA部门的时候，与企业本身实际相比，更重要的是参考业界流行的各种标准（如ISO、CMMI等）。`,a:`错误。 正确说法：创建SQA组织要结合企业规模、项目特点、文化和资源情况，ISO、CMMI等标准只能作为参考和裁剪依据。`},
{i:`3-10`,z:`3`,c:`07`,t:`填空`,q:`六西格玛组织结构从上到下分为 （填空1） 、 黑带主管(大师)、 （填空2） 、 （填空3） 。`,a:`填空1: 倡导者；填空2: 黑带；填空3: 绿带`},
{i:`3-11`,z:`3`,c:`07`,t:`判断`,q:`软件工程过程组类似于一个“立法”机构，而SQA则类似于一个“监督”机构。`,a:`正确`},
{i:`3-12`,z:`3`,c:`07`,t:`判断`,q:`任何不符合客户需求的地方都可以认为是缺陷。`,a:`正确`},
{i:`3-13`,z:`3`,c:`07`,t:`多选`,q:`在企业中，最常见的质量保证组织是______。 A. 软件测试部门 B. 软件质量保证组织 C. 生产车间 D. 技术部门`,a:`A. 软件测试部门；B. 软件质量保证组织`},
{i:`3-14`,z:`3`,c:`07`,t:`判断`,q:`所有SQA活动和项目里程碑的完成或项目里程碑的检验是同时发生的。`,a:`错误。 正确说法：SQA活动贯穿项目生命周期，可以发生在里程碑之前、期间或之后，并不都与里程碑检验同时发生。`},
{i:`3-15`,z:`3`,c:`07`,t:`判断`,q:`在整个机构中使用基础设施防护与改进部件的主要目标是在机构积累的SQA经验基础上消除或至少降低出错率。`,a:`正确`},
{i:`3-16`,z:`3`,c:`07`,t:`判断`,q:`软件质量系统之间各不相同，说明机构SQA系统构建存在固有灵活性。`,a:`正确`},
{i:`3-17`,z:`3`,c:`07`,t:`判断`,q:`在软件产品制定生产计划阶段,不必进行重大的SQA活动。`,a:`错误。 正确说法：SQA应从项目计划阶段开始，包括制定SQA计划、确定质量目标、标准、评审和测试安排。`},
{i:`3-18`,z:`3`,c:`07`,t:`填空`,q:`（填空1） 是一个动态的过程，需要不断调度、协调，保证项目的均衡发展。`,a:`填空1: 项目的进度管理`},
{i:`1-01`,z:`1`,c:`08`,t:`判断`,q:`需求分析是将用户需求准确转化为软件系统的唯一途径。`,a:`F`},
{i:`1-02`,z:`1`,c:`08`,t:`单选`,q:`将软件需求转化为数据结构和软件的系统结构，并定义子系统和它们之间的通信或接口是哪个阶段的任务 A. 详细设计 B. 编码 C. 测试 D. 概要设计`,a:`D. 概要设计`},
{i:`1-03`,z:`1`,c:`08`,t:`判断`,q:`软件设计的基本原则是设计越简单越好`,a:`T`},
{i:`1-04`,z:`1`,c:`08`,t:`单选`,q:`下列耦合度从低到高排列正确的是 A. 特征耦合、数据耦合、外部耦合、公共环境耦合 B. 非直接耦合、特征耦合、公共环境耦合、外部耦合 C. 数据耦合、控制耦合、公共环境耦合、内容耦合 D. 控制耦合、外部耦合、公共环境耦合、特征耦合`,a:`C. 数据耦合、控制耦合、公共环境耦合、内容耦合`},
{i:`1-05`,z:`1`,c:`08`,t:`判断`,q:`软件设计的时候技术远比用户需求重要的多。`,a:`F`},
{i:`1-06`,z:`1`,c:`08`,t:`判断`,q:`常作验证，早作验证是软件设计的原则之一`,a:`T`},
{i:`1-07`,z:`1`,c:`08`,t:`判断`,q:`框架模型主要以一些特殊的问题为目标建立只针对和适应该问题的结构。`,a:`T`},
{i:`1-08`,z:`1`,c:`08`,t:`多选`,q:`体系结构的模型包括 A. 结构模型 B. 功能模型 C. 动态模型 D. 过程模型`,a:`A. 结构模型；B. 功能模型；C. 动态模型；D. 过程模型`},
{i:`1-09`,z:`1`,c:`08`,t:`判断`,q:`C/S与B/S软件体系结构相比，除了用户界面的实现方式不同以外，其他没什么差别。`,a:`F`},
{i:`1-10`,z:`1`,c:`08`,t:`判断`,q:`设计模式使得人们可以更加简单和方便地去复用成功的软件设计和体系结构，从而帮助设计者更快更好地完成系统设计。`,a:`T`},
{i:`8-01`,z:`8`,c:`08`,t:`判断`,q:`需求分析是将用户需求准确转化为软件系统的唯一途径。`,a:`错误。 正确说法：需求分析是理解和定义用户需求的重要环节，但需求还需要通过沟通、建模、原型、评审和验证等活动持续澄清。`},
{i:`8-02`,z:`8`,c:`08`,t:`单选`,q:`将软件需求转化为数据结构和软件的系统结构，并定义子系统和它们之间的通信或接口是哪个阶段的任务 A. 详细设计 B. 编码 C. 测试 D. 概要设计`,a:`D. 概要设计`},

{i:`5-13`,z:`5`,c:`09`,t:`多选`,q:`以下说法正确的是 A. const可以修饰函数的参数、返回值，函数的定义体等。修饰的东西受到强制保护，可以预防意外的变动 B. const既能修饰输入参数也能修饰输出参数 C. void Func(const A &a)的形式可以有效防止参数a被意外修改 D. 如果输入参数采用“指针传递”，那么加const修饰可以防止意外地改动该指针，起到保护作用`,a:`A. const可以修饰函数的参数、返回值，函数的定义体等。修饰的东西受到强制保护，可以预防意外的变动；C. void Func(const A &a)的形式可以有效防止参数a被意外修改；D. 如果输入参数采用“指针传递”，那么加const修饰可以防止意外地改动该指针，起到保护作用`},
{i:`23-01`,z:`23`,c:`?`,t:`多选`,q:`以下可以作为单元的是 A. 一个类 B. 一个页面 C. 一个函数 D. 一个窗口`,a:`A. 一个类；B. 一个页面；C. 一个函数；D. 一个窗口`},
{i:`23-02`,z:`23`,c:`?`,t:`单选`,q:`导致软件缺陷的原因有很多，①—④是可能的原因，其中最主要的原因包括_____ ①软件需求说明书编写的不全面，不完整，不准确，而且经常更改 ②软件设计说明书 ③软件操作人员的水平 ④开发人员不能很好的理解需求说明书和沟通不足 A. ①、②、③ B. ①、③ C. ②、③ D. ①、④`,a:`D. ①、④`},
{i:`23-03`,z:`23`,c:`?`,t:`单选`,q:`一条Bug记录应该包括_____ ①编号 ②Bug描述 ③Bug级别 ④Bug所属模块 ⑤发现人 A. ①②③④ B. ①② C. ①②③④⑤ D. ①②③`,a:`C. ①②③④⑤`},
{i:`23-04`,z:`23`,c:`?`,t:`判断`,q:`测试人员要坚持原则，缺陷未修复完坚决不予通过。`,a:`错误。 正确说法：测试人员应依据缺陷严重程度、优先级和发布准则给出质量风险意见，是否允许发布由项目或质量决策流程决定，不要求所有缺陷都修复后才能通过。`},
{i:`23-05`,z:`23`,c:`?`,t:`单选`,q:`软件设计阶段的质量控制主要采取的方式是 A. 白盒测试 B. 动态测试 C. 黑盒测试 D. 评审`,a:`D. 评审`},
{i:`23-06`,z:`23`,c:`?`,t:`单选`,q:`软件质量保证与测试人员需要的的基本素质有 A. 行业知识 B. 测试专业技能 C. 所有选项都是 D. 计算机专业技能`,a:`C. 所有选项都是`},
{i:`23-07`,z:`23`,c:`?`,t:`单选`,q:`在软件底层进行的测试称为 A. 系统测试 B. 单元测试 C. 功能测试 D. 集成测试`,a:`B. 单元测试`},
{i:`23-08`,z:`23`,c:`?`,t:`单选`,q:`下列中不属于测试原则的是 A. 软件测试是有风险的行为 B. 完全测试程序是不可能的 C. 测试无法找出所有的软件缺陷 D. 找到的缺陷越多，软件遗留的缺陷就越少`,a:`D. 找到的缺陷越多，软件遗留的缺陷就越少`},
{i:`23-09`,z:`23`,c:`?`,t:`单选`,q:`测试人员应在软件生命周期中的下面哪个阶段介入最好______ A. 需求阶段 B. 设计阶段 C. 编码阶段 D. 系统集成阶段`,a:`A. 需求阶段`},
{i:`23-10`,z:`23`,c:`?`,t:`填空`,q:`回归测试的目的是所做的修改 （填空1） ，同时 （填空2） 的正确性。`,a:`填空1: 达到了预定的目的；填空2: 不影响软件原有功能`},
{i:`2-01`,z:`2`,c:`?`,t:`单选`,q:`导致软件缺陷的原因有很多，①—④是可能的原因，其中最主要的原因包括_____ ①软件需求说明书编写的不全面，不完整，不准确，而且经常更改 ②软件设计说明书 ③软件操作人员的水平 ④开发人员不能很好的理解需求说明书和沟通不足 A. ①、②、③ B. ①、③ C. ②、③ D. ①、④`,a:`D. ①、④`},
{i:`2-02`,z:`2`,c:`?`,t:`单选`,q:`一条Bug记录应该包括_____ ①编号 ②Bug描述 ③Bug级别 ④Bug所属模块 ⑤发现人 A. ①②③④ B. ①② C. ①②③④⑤ D. ①②③`,a:`C. ①②③④⑤`},
{i:`2-03`,z:`2`,c:`?`,t:`单选`,q:`下面①--④是关于软件评测师工作原则的描述，正确的判断是_____。 ①对于开发人员提交的程序必须进行完全的测试，以确保程序的质量 ②必须合理安排测试任务，做好周密的测试计划，平均分配软件各个模块的测试时间 ③在测试之前需要与开发人员进行详细的交流，明确开发人员的程序设计思路，并以此为依据开展软件测试工作，最大程度地发现程序中与其设计思路不一致的错误 ④要对自己发现的问题负责，确保每一个问题都能被开发人员理解和修改。 A. ①③ B. 无 C. ①② D. ②③`,a:`B. 无`},
{i:`2-04`,z:`2`,c:`?`,t:`单选`,q:`测试记录包括 ① 测试计划或包含测试用例的测试规格说明。 ② 测试期间出现问题的评估与分析。 ③ 与测试用例相关的所有结果，包括在测试期间出现的所有失败。 ④ 测试中涉及的人员身份。 A. ① ② ③ B. ① ③ ④ C. ② ③ D. ① ② ③ ④`,a:`B. ① ③ ④`},
{i:`2-05`,z:`2`,c:`?`,t:`单选`,q:`下列叙述中，_____是正确的。 A. 白盒测试又称为逻辑驱动测试 B. 穷举路径测试可以查出程序中因遗漏路径而产生的错误 C. 一般而言，黑盒测试对结构的覆盖比白盒测试高 D. 必须根据软件需求说明文档生成用于白盒测试的测试用例`,a:`A. 白盒测试又称为逻辑驱动测试`},
{i:`2-06`,z:`2`,c:`?`,t:`判断`,q:`需求分析 - 设计－实现－测试，软件测试是软件开发末期才需要做的工作。`,a:`错误。 正确说法：软件测试活动应贯穿整个软件生命周期，从需求和设计阶段就开始评审、计划和设计测试。`},
{i:`2-07`,z:`2`,c:`?`,t:`判断`,q:`采用自动化测试工具后一定比手工测试发现的缺陷更多。`,a:`错误。 正确说法：自动化测试能提高重复执行效率，但发现缺陷的能力取决于测试设计和场景覆盖，并不一定比手工测试发现更多缺陷。`},
{i:`2-08`,z:`2`,c:`?`,t:`判断`,q:`测试人员要坚持原则，缺陷未修复完坚决不予通过。`,a:`错误。 正确说法：测试人员应依据缺陷严重程度、优先级和发布准则给出质量风险意见，是否允许发布由项目或质量决策流程决定，不要求所有缺陷都修复后才能通过。`},
{i:`2-09`,z:`2`,c:`?`,t:`判断`,q:`自底向上集成需要测试员编写驱动程序。`,a:`正确`},
{i:`2-10`,z:`2`,c:`?`,t:`单选`,q:`软件设计阶段的质量控制主要采取的方式是 A. 白盒测试 B. 动态测试 C. 黑盒测试 D. 评审`,a:`D. 评审`},
{i:`2-11`,z:`2`,c:`?`,t:`单选`,q:`下列各项中_____不是一个测试计划所应包含的内容。 A. 测试资源、进度安排 B. 测试策略 C. 测试范围 D. 测试预期输出`,a:`D. 测试预期输出`},
{i:`2-12`,z:`2`,c:`?`,t:`单选`,q:`下列中不属于测试原则的是 A. 软件测试是有风险的行为 B. 完全测试程序是不可能的 C. 测试无法显示潜伏的软件缺陷 D. 找到的缺陷越多软件残留的缺陷就越少`,a:`D. 找到的缺陷越多软件残留的缺陷就越少`},
{i:`2-13`,z:`2`,c:`?`,t:`单选`,q:`关于自动化测试局限性的描述，以下描述错误的是 A. 自动测试比手工测试发现的缺陷少 B. 自动化测试对测试设计依赖性极大 C. 自动测试不能提高测试覆盖率 D. 自动化测试不能取代手工测试`,a:`A. 自动测试比手工测试发现的缺陷少`},
{i:`2-14`,z:`2`,c:`?`,t:`单选`,q:`缺陷跟踪就是要确保每个被发现的缺陷最终都能够被_____，而不是不了了之 。 A. 关闭 B. 改正 C. 隐藏 D. 发现`,a:`A. 关闭`},
{i:`2-15`,z:`2`,c:`?`,t:`单选`,q:`_____是对要执行的软件测试及测试的结果进行描述、定义、规定和报告的任何书面或图示信息。 A. 软件测试脚本 B. 软件测试文档 C. 软件测试用例 D. 软件测试结果`,a:`B. 软件测试文档`},
{i:`2-16`,z:`2`,c:`?`,t:`单选`,q:`软件测试是按照特定的规程，_____的过程。 A. 证明程序没有错误 B. 设计并运行测试用例 C. 发现软件错误 D. 说明程序正确`,a:`C. 发现软件错误`},
{i:`2-17`,z:`2`,c:`?`,t:`单选`,q:`软件质量保证与测试人员需要的的基本素质有 A. 行业知识 B. 测试专业技能 C. 所有选项都是 D. 计算机专业技能`,a:`C. 所有选项都是`},
{i:`2-18`,z:`2`,c:`?`,t:`单选`,q:`软件测试人员的工作职责不包括 A. 执行测试过程 B. 对软件缺陷进行修复 C. 制定测试计划 D. 设计测试用例`,a:`B. 对软件缺陷进行修复`},
{i:`2-19`,z:`2`,c:`?`,t:`单选`,q:`关于自动化测试局限性的描述，以下描述错误的是 A. 自动测试比手工测试发现的缺陷少 B. 自动测试不能提高测试覆盖率 C. 自动化测试不能取代手工测试 D. 自动化测试对测试设计依赖性极大`,a:`A. 自动测试比手工测试发现的缺陷少`},
{i:`2-20`,z:`2`,c:`?`,t:`单选`,q:`通过继承机制，子类可以继承父类的特点和功能，这一特征为_____的扩散提供了途径。 A. 消息 B. 代码 C. 数据 D. 缺陷`,a:`D. 缺陷`},
{i:`2-21`,z:`2`,c:`?`,t:`单选`,q:`封装这一特征简化了对对象的使用，但同时也给测试结构的_____、测试路径的选取、测试数据的生成等带来了困难。 A. 合成 B. 分析 C. 定义 D. 提取`,a:`B. 分析`},
{i:`2-22`,z:`2`,c:`?`,t:`单选`,q:`增量式集成测试有3种方式：自顶向下增量测试方法，_____和混合增量测试方式。 A. 从大到小增量测试方法 B. 自上向底增量测试方法 C. 自底向上增量测试方法 D. 从小到大增量测试方法`,a:`C. 自底向上增量测试方法`},
{i:`2-23`,z:`2`,c:`?`,t:`单选`,q:`代码检查法有桌面检查法，走查和 A. 代码审查 B. 静态测试 C. 白盒测试 D. 动态测试`,a:`A. 代码审查`},
{i:`2-24`,z:`2`,c:`?`,t:`填空`,q:`按照是否需要知道被测试程序的内部结构，测试方法可以分为： （填空1） 测试和 （填空2） 测试。`,a:`填空1: 黑盒；填空2: 白盒`},
{i:`2-25`,z:`2`,c:`?`,t:`填空`,q:`动态测试的两个基本要素是 （填空1） 、 （填空2） 。`,a:`填空1: 被测试程序；填空2: 测试用例`},
{i:`2-26`,z:`2`,c:`?`,t:`判断`,q:`发现错误多的模块，残留在模块中的错误也多。`,a:`正确`},
{i:`2-27`,z:`2`,c:`?`,t:`判断`,q:`一个软件存在哪些缺陷，开发者和用户的立场是一致的。`,a:`错误。 正确说法：开发者常从内部实现和规格看缺陷，用户从需求、使用效果和业务价值看缺陷，二者立场可能不同。`},
{i:`2-28`,z:`2`,c:`?`,t:`判断`,q:`软件测试针对的是初级程序员编写的程序，资深程序员编写的程序无需测试。`,a:`错误。 正确说法：任何人编写的软件都可能存在缺陷，资深程序员的代码同样需要测试和评审。`},
{i:`2-29`,z:`2`,c:`?`,t:`单选`,q:`划分软件测试属于白盒测试还是黑盒测试的依据是 A. 运行结果是否确定 B. 是否执行程序代码 C. 是否能看到软件文档 D. 是否能看到被测源程序`,a:`D. 是否能看到被测源程序`},
{i:`2-30`,z:`2`,c:`?`,t:`单选`,q:`软件测试的局限性不包括 A. 有的缺陷与特定的环境条件有关。 B. 软件测试会导致成本增加，项目总体效益降低。 C. 巧合性有时会导致错误的代码得到正确的结果，掩盖了问题。 D. 因为输入/状态空间的无限性，测试不可能完全彻底。`,a:`B. 软件测试会导致成本增加，项目总体效益降低。`},
{i:`2-31`,z:`2`,c:`?`,t:`单选`,q:`较实用的软件测试停止标准是 A. 根据查出的缺陷总数量决定是否停止测试。 B. 测试成本超过了预期计划，则停止测试。 C. 分析发现的缺陷数量和测试投入成本曲线图，确定应继续测试还是停止测试。 D. 测试超过了预定时间，则停止测试。`,a:`C. 分析发现的缺陷数量和测试投入成本曲线图，确定应继续测试还是停止测试。`},
{i:`2-32`,z:`2`,c:`?`,t:`单选`,q:`下列中不属于测试原则的是 A. 软件测试是有风险的行为 B. 完全测试程序是不可能的 C. 测试无法找出所有的软件缺陷 D. 找到的缺陷越多，软件遗留的缺陷就越少`,a:`D. 找到的缺陷越多，软件遗留的缺陷就越少`},
{i:`2-33`,z:`2`,c:`?`,t:`判断`,q:`好的测试员不懈追求完美，保证通过测试的软件不会再有缺陷。`,a:`错误。 正确说法：测试只能证明缺陷存在，不能证明缺陷不存在；好的测试员应关注风险和缺陷发现，而不能保证软件无缺陷。`},
{i:`2-34`,z:`2`,c:`?`,t:`判断`,q:`测试是为了验证软件已正确地实现了用户的要求。`,a:`错误。 正确说法：软件测试的核心目的是发现缺陷并评价质量，验证需求实现只是测试目标之一，不能把测试理解成只证明软件正确。`},
{i:`2-35`,z:`2`,c:`?`,t:`单选`,q:`经验表明，在程序测试中，某模块与其他模块相比，若该模块已发现并改正的错误较多，则该模块中残存的错误数目与其他模块相比，通常应该 A. 相似 B. 不确定 C. 较少 D. 较多`,a:`D. 较多`},
{i:`2-36`,z:`2`,c:`?`,t:`单选`,q:`以下哪一类人员与软件质量保证与测试工作无关？ A. 软件销售人员 B. 软件需求分析人员 C. 代码开发人员 D. 软件设计人员`,a:`A. 软件销售人员`},
{i:`2-37`,z:`2`,c:`?`,t:`单选`,q:`软件测试用例主要由输入数据和_________两部分组成。 A. 测试计划 B. 测试规则 C. 预期输出结果 D. 以往测试记录分析`,a:`C. 预期输出结果`},
{i:`2-38`,z:`2`,c:`?`,t:`单选`,q:`与设计测试用例无关的文档是______ A. 项目开发计划 B. 需求规格说明书 C. 设计说明书 D. 源程序`,a:`A. 项目开发计划`},
{i:`2-39`,z:`2`,c:`?`,t:`多选`,q:`在确定测试目标的过程中，测试人员主要完成以下的________ A. 确定测试的标准和规范 B. 确定测试环境 C. 确定所需要的测试资源 D. 确定用户的特殊要求`,a:`A. 确定测试的标准和规范；B. 确定测试环境；C. 确定所需要的测试资源；D. 确定用户的特殊要求`},
{i:`2-40`,z:`2`,c:`?`,t:`单选`,q:`测试人员应在软件生命周期中的下面哪个阶段介入最好______ A. 需求阶段 B. 设计阶段 C. 编码阶段 D. 系统集成阶段`,a:`A. 需求阶段`},
{i:`2-41`,z:`2`,c:`?`,t:`单选`,q:`软件测试的对象包括_____ A. 需求分析、概要设计和详细设计 B. 程序源代码 C. 需求规格说明 D. 以上所有`,a:`D. 以上所有`},
{i:`2-42`,z:`2`,c:`?`,t:`单选`,q:`从测试的要求来讲，如果想让测试完成的效果更好，测试部门与开发部门的关系最好是下面四种中的____ A. 测试组织与开发组织为同一公司同一部门同一小组，并且测试人员与开发人员为同一组人员，即开发人员测试自己的程序。 B. 测试组织与开发组织为同一公司同一部门同一小组，但测试人员与开发人员为不同人员。 C. 测试组织与开发组织为同一公司，但不在同一部门。 D. 测试组织与开发组织为不同公司。`,a:`D. 测试组织与开发组织为不同公司。`},
{i:`2-43`,z:`2`,c:`?`,t:`判断`,q:`代码评审员一般由测试员担任。`,a:`错误。 正确说法：代码评审通常由开发同伴、技术负责人或相关专家担任，测试人员可以参与，但不通常由测试员单独承担。`},
{i:`2-44`,z:`2`,c:`?`,t:`单选`,q:`以下属于安全测试方法的是。 ①安全功能验证 ②安全漏洞扫描 ③模拟攻击实验 ④数据侦听 A. ①③ B. ①②③ C. ①②④ D. ①②③④`,a:`D. ①②③④`},
{i:`2-45`,z:`2`,c:`?`,t:`单选`,q:`编写测试计划的目的是。 ①使测试工作顺利进行 ②使项目参与人员沟通更舒畅 ③使测试工作更加系统化 ④软件过程规范化的要求 ⑤控制软件质量 A. ②③⑤ B. ①②③ C. ①②④ D. ①②⑤`,a:`B. ①②③`},
{i:`2-46`,z:`2`,c:`?`,t:`单选`,q:`对需求说明书评测的内容包括。 ①系统定义的目标是否与用户的要求一致 ②被开发项目的数据流与数据结构是否足够、确定 ③与所有其它系统交互的重要接口是否都已经描述 ④主要功能是否已包含在规定的软件范围之内，是否都已充分说明 ⑤确认软件的内部接口与外部接口是否已明确定义 A. ①③⑤ B. ②③⑤ C. ①②④⑤ D. ①②③④`,a:`D. ①②③④`},
{i:`2-47`,z:`2`,c:`?`,t:`单选`,q:`以下关于白盒测试和黑盒测试的理解，正确是 A. 白盒测试通过对程序内部结构的分析、检测来寻找问题 B. 白盒测试通过一些表征性的现象、事件、标志来判断内部的运行状态 C. 单元测试可应用白盒测试方法，集成测试则采用黑盒测试方法 D. 在软件生命周期各个阶段都需要用白盒测试方法`,a:`A. 白盒测试通过对程序内部结构的分析、检测来寻找问题`},
{i:`2-48`,z:`2`,c:`?`,t:`单选`,q:`为了使软件测试更加高效，应遵循的原则包括。 ①所有的软件测试都应追溯到用户需求、充分注意缺陷群集现象 ②尽早地和不断地进行软件测试、回归测试 ③为了证明程序的正确性，尽可能多的开发测试用例 ④应由不同的测试人员对测试所发现的缺陷进行确认 ⑤增量测试，由小到大 A. ①②③④ B. ①③④⑤ C. ②③④ D. ①②④⑤`,a:`D. ①②④⑤`},
{i:`2-49`,z:`2`,c:`?`,t:`单选`,q:`不是正确的软件测试目的。 A. 尽最大的可能找出最多的错误 B. 设计一个好的测试用例对用户需求的覆盖度达到100％ C. 对软件质量进行度量和评估，以提高软件的质量 D. 发现开发所采用的软件过程的缺陷，进行软件过程改进`,a:`B. 设计一个好的测试用例对用户需求的覆盖度达到100％`},
{i:`2-50`,z:`2`,c:`?`,t:`单选`,q:`设计功能测试用例的根本依据是。 A. 用户需求规格说明书 B. 用户手册 C. 被测产品的用户界面 D. 概要设计说明书`,a:`A. 用户需求规格说明书`},
{i:`2-51`,z:`2`,c:`?`,t:`单选`,q:`使用软件测试工具的目的不包括。 A. 帮助测试寻找问题 B. 协助问题的诊断 C. 节省测试时间 D. 提高设计质量`,a:`D. 提高设计质量`},
{i:`2-52`,z:`2`,c:`?`,t:`单选`,q:`以下关于软件测试原则的说法中，错误的是 A. 在设计测试用例时，不但要包括合理的输入条件，还要包括不合理的输入条件 B. 测试过程中某模块中查出的错误越多，该模块残留的错误就越少 C. 坚持在软件开发各个阶段进行技术评审，才能在开发过程中尽早发现和预防错误 D. 在测试过程中要严格按照测试计划执行，以避免发生疏漏或重复无效的工作`,a:`B. 测试过程中某模块中查出的错误越多，该模块残留的错误就越少`},
{i:`2-53`,z:`2`,c:`?`,t:`判断`,q:`测试是为了验证软件已正确地实现了用户的要求。`,a:`错误。 正确说法：软件测试的核心目的是发现缺陷并评价质量，验证需求实现只是测试目标之一，不能把测试理解成只证明软件正确。`},
{i:`2-54`,z:`2`,c:`?`,t:`填空`,q:`动态测试技术主要使用的分析方法包括： （填空1） 测试、 （填空2）测试 和 （填空3）测试 。`,a:`填空1: 白盒；填空2: 黑盒；填空3: 灰盒`},
{i:`2-55`,z:`2`,c:`?`,t:`填空`,q:`回归测试的目的是所做的修改 （填空1） ，同时 （填空2） 的正确性。`,a:`填空1: 达到了预定的目的；填空2: 不影响软件原有功能`},
{i:`2-56`,z:`2`,c:`?`,t:`单选`,q:`为了提高测试效率应该_____ A. 随机地选取测试数据 B. 取一切可能的输入数据作为测试数据 C. 在完成编码以后制定软件的测试计划 D. 选择发现错误的可能性大的数据作为测试数据`,a:`D. 选择发现错误的可能性大的数据作为测试数据`},
{i:`2-57`,z:`2`,c:`?`,t:`单选`,q:`测试工程师的工作范围会包括检视代码、评审开发文档，这属于_____ A. 动态测试 B. 静态测试 C. 黑盒测试 D. 白盒测试`,a:`B. 静态测试`},
{i:`2-58`,z:`2`,c:`?`,t:`多选`,q:`软件测试的责任是：_______。 A. 编写合理的测试计划，并与项目整体计划有机地整合在一起 B. 针对测试需求进行相关测试技术的研究 C. 进行缺陷跟踪与分析 D. 编写覆盖率高的测试用例`,a:`A. 编写合理的测试计划，并与项目整体计划有机地整合在一起；B. 针对测试需求进行相关测试技术的研究；C. 进行缺陷跟踪与分析；D. 编写覆盖率高的测试用例`},
{i:`2-59`,z:`2`,c:`?`,t:`单选`,q:`软件测试按照测试层次可以分为______。 A. 黑盒测试、白盒测试 B. 功能性测试和结构性测试 C. 单元测试、集成测试和系统测试 D. 动态测试和静态测试`,a:`C. 单元测试、集成测试和系统测试`},
{i:`2-60`,z:`2`,c:`?`,t:`判断`,q:`在软件测试中, 测试预言是一种检验待测系统在特定执行下是否正确运行的方法。`,a:`正确`},
{i:`2-61`,z:`2`,c:`?`,t:`判断`,q:`测试人员说：没有可运行的程序，我无法进行测试工作。`,a:`错误。 正确说法：没有可运行程序时仍可开展静态测试，如需求评审、设计评审、测试计划和测试用例设计。`},
{i:`2-62`,z:`2`,c:`?`,t:`判断`,q:`项目立项前测试人员不需要提交任何工件。`,a:`正确`},
{i:`2-63`,z:`2`,c:`?`,t:`判断`,q:`发现错误多的模块，残留在模块中的错误也多。`,a:`正确`},
{i:`2-64`,z:`2`,c:`?`,t:`判断`,q:`只要能够达到100％的逻辑覆盖率，就可以保证程序的正确性。`,a:`错误。 正确说法：100%逻辑覆盖只能说明选定结构被执行过，不能保证需求完整、数据正确或程序没有缺陷。`},
{i:`2-65`,z:`2`,c:`?`,t:`判断`,q:`测试人员要坚持原则，缺陷未修复完坚决不予通过。`,a:`错误。 正确说法：测试人员应依据缺陷严重程度、优先级和发布准则给出质量风险意见，是否允许发布由项目或质量决策流程决定，不要求所有缺陷都修复后才能通过。`},
{i:`2-66`,z:`2`,c:`?`,t:`填空`,q:`动态测试技术主要使用的分析方法包括： （填空1） 测试、 （填空2） 测试和 （填空3） 测试。`,a:`填空1: 白盒；填空2: 黑盒；填空3: 灰盒`},
{i:`2-67`,z:`2`,c:`?`,t:`单选`,q:`某软件公司在招聘软件评测师时，应聘者甲向公司做如下保证： ① 经过自己测试的软件今后不会再出现问题； ② 在工作中对所有程序员一视同仁，不会因为在某个程序员编写的程序中发现的问题多，就重点审查该程序，以免不利于团结； ③ 承诺不需要其他人员，自己就可以独立进行测试工作； ④ 发扬咬定青山不放松的精神，不把所有问题都找出来，决不罢休； 你认为应聘者甲的保证 _____。 A. ①、④是正确的 B. ②是正确的 C. 都是正确的 D. 都不正确`,a:`D. 都不正确`},
{i:`2-68`,z:`2`,c:`?`,t:`单选`,q:`软件测试步骤理解有误的是：______。 A. 模块测试通常又称为单元测试目的是保证每个模块作为一个单元能正确运行 B. 系统测试是把经过测试的于系统装配成一个完整的系统来测试 C. 白盒法考虑的是测试用例对程序外部逻辑的覆盖程度 D. 验收测试把软件系统作为单一的实体进行测试，它是在用户积极参与下进行的`,a:`C. 白盒法考虑的是测试用例对程序外部逻辑的覆盖程度`},
{i:`2-69`,z:`2`,c:`?`,t:`单选`,q:`不属于测试工具的优点是_____。 A. 增强了测试的能力，扩展了测试的深度和广度 B. 重现软件缺陷的能力 C. 通过工具我们可以达到 100%的测试覆盖率 D. 减轻了测试工作量并缩短了测试进度`,a:`C. 通过工具我们可以达到 100%的测试覆盖率`},
{i:`2-70`,z:`2`,c:`?`,t:`单选`,q:`下列 _____不属于测试原则的内容。 A. 软件测试是有风险的行为 B. 完全测试程序是不可能的 C. 测试无法显示潜伏的软件缺陷 D. 找到的缺陷越多软件的缺陷就越少`,a:`D. 找到的缺陷越多软件的缺陷就越少`},
{i:`2-71`,z:`2`,c:`?`,t:`单选`,q:`软件测试类型按开发阶段划分是 _____。 A. 需求测试、单元测试、集成测试、验证测试 B. 单元测试、集成测试、确认测试、系统测试、验收测试 C. 单元测试、集成测试、验证测试、确认测试、验收测试 D. 调试、单元测试、集成测试、用户测试`,a:`B. 单元测试、集成测试、确认测试、系统测试、验收测试`},
{i:`2-72`,z:`2`,c:`?`,t:`单选`,q:`_____ 可以作为软件测试结束的标志。 A. 使用了特定的测试用例 B. 错误强度曲线下降到预定的水平 C. 查出了预定数目的错误 D. 按照测试计划中所规定的时间进行了测试`,a:`B. 错误强度曲线下降到预定的水平`},
{i:`2-73`,z:`2`,c:`?`,t:`单选`,q:`对测试用例描述不正确的是______。 A. 为某个特殊目标而编制的一组测试输入 B. 为某个特殊目标而编制执行条件以及预期结果 C. 便于测试某个程序路径或核实是否满足某个特定需求 D. 不同类别的软件，测试用例是相同的`,a:`D. 不同类别的软件，测试用例是相同的`},
{i:`2-74`,z:`2`,c:`?`,t:`多选`,q:`软件测试计划评审会需要哪些人员参加？______。 A. 项目经理 B. SQA 负责人 C. 配置负责人 D. 测试组`,a:`A. 项目经理；B. SQA 负责人；C. 配置负责人；D. 测试组`},
{i:`2-75`,z:`2`,c:`?`,t:`多选`,q:`软件测试过程包括哪些步骤______。 A. 单元测试 B. 集成测试 C. 验收测试 D. 确认测试`,a:`A. 单元测试；B. 集成测试；C. 验收测试；D. 确认测试`},
{i:`2-76`,z:`2`,c:`?`,t:`多选`,q:`测试设计员的职责有：_____。 A. 制定测试计划 B. 设计测试用例 C. 设计测试过程、脚本 D. 评估测试活动`,a:`B. 设计测试用例；C. 设计测试过程、脚本`},
{i:`2-77`,z:`2`,c:`?`,t:`多选`,q:`关于软件测试的概述说法不正确的是______。 A. 用更好的程序语言编写程序可以避免出错 B. 软件测试在软件开发总工作量的比例应最低 C. 软件测试需要人员的交流 D. 软件测试与软件开发并行`,a:`A. 用更好的程序语言编写程序可以避免出错；B. 软件测试在软件开发总工作量的比例应最低`},
{i:`2-78`,z:`2`,c:`?`,t:`多选`,q:`关于软件测试的理解有误的是______。 A. 软件测试是为了寻找软件缺陷而执行程序的过程 B. 软件测试目的是为了改正软件的错误 C. 软件测试与软件开发是同步进行的 D. 应用系统开发完毕，再对它进行软件测试`,a:`B. 软件测试目的是为了改正软件的错误；D. 应用系统开发完毕，再对它进行软件测试`},
{i:`2-79`,z:`2`,c:`?`,t:`判断`,q:`软件测试工具可以代替软件测试员。`,a:`错误。 正确说法：测试工具只能辅助执行、管理或分析测试，不能代替测试人员的判断、设计和质量分析。`},
{i:`2-80`,z:`2`,c:`?`,t:`判断`,q:`软件测试等于程序测试。`,a:`错误。 正确说法：软件测试不仅包括程序执行测试，还包括需求、设计、文档等静态测试和质量评价活动。`},
{i:`2-81`,z:`2`,c:`?`,t:`判断`,q:`最重要的用户界面要素是软件符合现行标准和规范。`,a:`正确`},
{i:`2-82`,z:`2`,c:`?`,t:`判断`,q:`软件测试是有风险的行为，并非所有的软件缺陷都能够被修复。`,a:`正确`},
{i:`2-83`,z:`2`,c:`?`,t:`判断`,q:`传统测试以发现错误为目的，现在测试已经扩展到了错误预防的范畴。`,a:`正确`},
{i:`2-84`,z:`2`,c:`?`,t:`判断`,q:`我们有理由相信只要能够设计出尽可能好的测试方案，经过严格测试之后的软件可以没有缺陷。`,a:`错误。 正确说法：即使测试方案很好，也无法穷尽所有输入、路径和环境，严格测试只能降低风险，不能保证软件没有缺陷。`},
{i:`2-85`,z:`2`,c:`?`,t:`判断`,q:`设计－实现－测试，软件测试是开发后期的一个阶段。`,a:`错误。 正确说法：软件测试不是开发后期单一阶段，应从需求阶段开始并贯穿设计、编码、集成和维护全过程。`},
{i:`2-86`,z:`2`,c:`?`,t:`判断`,q:`永远有缺陷类型会在测试的一个层次上被发现，并且能够在另一个层次上逃避检测。`,a:`正确`},
{i:`2-87`,z:`2`,c:`?`,t:`判断`,q:`程序员兼任测试员可以提高工作效率。`,a:`错误。 正确说法：程序员可以做单元测试，但独立测试能减少认知偏差，不能简单认为由程序员兼任测试员就能提高整体质量和效率。`},
{i:`22-01`,z:`22`,c:`?`,t:`判断`,q:`基路径测试给出了必需进行的测试的上限。`,a:`F`},
{i:`22-02`,z:`22`,c:`?`,t:`判断`,q:`基路径是指从所有的程序路径中选择一个最小的路径集合，程序中的其它路径都可以由这一组路径进行加法和数乘运算得到。`,a:`T`},
{i:`22-03`,z:`22`,c:`?`,t:`单选`,q:`一个程序中所含有的路径数与_____有着直接的关系 A. 程序语句行数 B. 程序指令执行时间 C. 程序模块数 D. 程序的复杂程度`,a:`D. 程序的复杂程度`},

/* ============== 渲染 & 交互 ============== */
const app=document.getElementById('app'),nav=document.getElementById('nav');
const KEY='swtest_done_v1';
let done=JSON.parse(localStorage.getItem(KEY)||'{}');
let total=0;
const CARDS=[];
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

nav.innerHTML='<div class="nt">📑 目录 · 点击跳转</div>';
D.forEach((sec,si)=>{
  const a=document.createElement('a');a.href='#s'+si;a.textContent=sec.g.replace(/^[⭐🚨🎯\s]+/,'');nav.appendChild(a);
  const wrap=document.createElement('section');wrap.className='sec';
  const h=document.createElement('h2');h.id='s'+si;h.textContent=sec.g;wrap.appendChild(h);
  const grid=document.createElement('div');grid.className='grid';
  sec.items.forEach((it,ii)=>{
    total++;
    const id=si+'_'+ii;
    const card=document.createElement('div');card.className='card'+(done[id]?' done':'');
    card.dataset.p=it.p;card.dataset.txt=(it.t+' '+it.b).replace(/<[^>]+>/g,'').toLowerCase();
    if(it.b.length>500||/table|pre/.test(it.b))card.classList.add('full');
    const pn=['p0','p1','p2'][it.p],pl=['P0','P1','P2'][it.p];
    const mn=it.m?`<div class="mnemo">💡 <b>记忆妙招</b>：${it.m}</div>`:'';
    card.innerHTML=`<div class="chead">
        <span class="pill ${pn}">${pl}</span>
        <span class="ct">${it.t}</span>
        <span class="flipbtn" style="display:none">🔄</span>
        <span class="chk" title="标记已背">✓</span>
      </div>
      <div class="faces">
        <div class="face fa"><div class="body">${it.b}${mn}</div></div>
      </div>`;
    card.querySelector('.chk').onclick=e=>{e.stopPropagation();
      done[id]=!done[id];if(!done[id])delete done[id];
      localStorage.setItem(KEY,JSON.stringify(done));card.classList.toggle('done');updateProg();};
    grid.appendChild(card);
    CARDS.push({card,si,title:it.t,btext:(it.t+' '+it.b).replace(/<[^>]+>/g,''),qs:[],noBlur:it.flip===false});
  });
  wrap.appendChild(grid);app.appendChild(wrap);
});

/* ===== 把云班课题库绑定到卡片 + 构建翻面 ===== */
const SEC2CH=[['11','12'],['01'],['02'],['03'],['04'],['05'],['06'],['07'],['08'],['09'],['10'],['11'],['12'],['13'],['14'],['15'],[],[]];
const shg=s=>{s=(s||'').toLowerCase().replace(/[^一-龥a-z0-9]/g,'');const r=Object.create(null);for(let i=0;i<s.length-1;i++)r[s.substr(i,2)]=1;return r;};
const sc=(a,b)=>{let n=0;for(const k in a)if(b[k])n++;return n;};
CARDS.forEach(c=>{c.sh=shg(c.btext);c.ch=SEC2CH[c.si]||[];c.bindable=c.ch.length>0&&!c.noBlur;});
const byCh={};
CARDS.forEach(c=>{if(c.bindable)c.ch.forEach(ch=>{(byCh[ch]=byCh[ch]||[]).push(c);});});
const pool0=CARDS.filter(c=>c.bindable);
const THRESH=4,CAP=3,placed=new Set(),pairs=[];
QBANK.forEach(q=>{
  const pool=(byCh[q.c]&&byCh[q.c].length)?byCh[q.c]:pool0;
  if(!pool.length)return;
  const qsh=shg(q.q+' '+q.a);
  pool.forEach(c=>{const s=sc(qsh,c.sh);if(s>=THRESH)pairs.push([s,q,c]);});
});
pairs.sort((a,b)=>b[0]-a[0]);
pairs.forEach(p=>{const q=p[1],c=p[2];if(placed.has(q.i)||c.qs.length>=CAP)return;c.qs.push(q);placed.add(q.i);});
let boundN=0;
CARDS.forEach(c=>{
  const faces=c.card.querySelector('.faces'),fa=c.card.querySelector('.fa'),btn=c.card.querySelector('.flipbtn');
  if(c.qs.length){
    boundN+=c.qs.length;c.card.classList.add('hasq');
    const fq=document.createElement('div');fq.className='face fq';
    fq.innerHTML=`<div class="qhead">📝 云班课练习题 · ${c.qs.length} 题（来自你练习区导入的云班课 quiz，先做再翻面对知识点）</div>`+
      c.qs.map(q=>`<div class="qitem"><div class="qt"><span class="qtype">${esc(q.t)}</span><span class="qid">云班课 quiz-${esc(q.z)} · 题${esc(q.i)}</span></div><div class="qstem">${esc(q.q)}</div><div class="qa hideable"><b>参考答案：</b>${esc(q.a)}</div></div>`).join('');
    faces.insertBefore(fq,faces.firstChild);
    fa.style.display='none';btn.style.display='';btn.textContent='🔄 看知识点';
    let showQ=true;
    btn.onclick=e=>{e.stopPropagation();showQ=!showQ;
      fq.style.display=showQ?'':'none';fa.style.display=showQ?'none':'';
      btn.textContent=showQ?'🔄 看知识点':'🔄 看练习';};
    c.card.dataset.txt+=' '+c.qs.map(q=>q.q+q.a).join(' ').toLowerCase();
  }else if(!c.noBlur){
    fa.querySelector('.body').classList.add('hideable');
  }
});
// 任意 .hideable 点击显隐（仅翻卡模式生效）
function wireHide(){document.querySelectorAll('.hideable').forEach(el=>{if(el._w)return;el._w=1;
  el.onclick=ev=>{ev.stopPropagation();if(document.body.classList.contains('flip'))el.classList.toggle('show');};});}
wireHide();

function updateProg(){
  const n=Object.keys(done).length;
  document.getElementById('prog').style.width=(n/total*100)+'%';
  document.getElementById('pct').textContent=`${n} / ${total} 已背`;
}
updateProg();

// 滚动高亮当前章节
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
  nav.querySelectorAll('a').forEach(l=>l.classList.remove('active'));
  const cur=nav.querySelector('a[href="#'+e.target.id+'"]');if(cur)cur.classList.add('active');}});},
  {rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('.sec>h2').forEach(h=>obs.observe(h));

// 搜索
document.getElementById('q').oninput=e=>{
  const k=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display=(!k||c.dataset.txt.includes(k))?'':'none';});
};
// 优先级筛选
let curF='all';
document.querySelectorAll('.btn[data-f]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.btn[data-f]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');curF=b.dataset.f;
    document.querySelectorAll('.card').forEach(c=>{
      c.style.display=(curF==='all'||c.dataset.p===curF)?'':'none';});
  };
});
// 翻卡模式
const mb=document.getElementById('modeBtn');
mb.onclick=()=>{
  document.body.classList.toggle('flip');
  const on=document.body.classList.contains('flip');
  mb.textContent='翻卡模式：'+(on?'开':'关');mb.classList.toggle('on',on);
  if(!on)document.querySelectorAll('.hideable').forEach(b=>b.classList.add('show'));
  else document.querySelectorAll('.hideable').forEach(b=>b.classList.remove('show'));
};
// 清空进度
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('确定清空所有"已背"标记？')){done={};localStorage.removeItem(KEY);
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('done'));updateProg();}
};
</script>
</body>
