<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A 卷最后题路径覆盖答案图</title>
  <desc id="desc">左侧展示控制流节点和真假的路径，右侧列出四条路径、测试输入、计算过程和返回值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#26313d"/>
    </marker>
    <style>
      .bg { fill: #fbfcfb; }
      .title { fill: #20242a; font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #5b6673; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node { fill: #f2f7fb; stroke: #365f91; stroke-width: 2.3; }
      .decision { fill: #fff8ed; stroke: #a14f35; stroke-width: 2.5; }
      .end { fill: #f2f8f5; stroke: #2f6f5e; stroke-width: 2.3; }
      .line { fill: none; stroke: #26313d; stroke-width: 2.3; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #26313d; stroke-width: 2; marker-end: url(#arrow); }
      .text { fill: #20242a; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #303843; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #a14f35; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tableHead { fill: #365f91; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tableText { fill: #303843; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: #ffffff; stroke: rgba(32, 36, 42, 0.16); stroke-width: 1.5; }
      .row { stroke: rgba(32, 36, 42, 0.14); stroke-width: 1; }
      .hint { fill: #2f6f5e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="900" rx="26"/>
  <text class="title" x="600" y="52" text-anchor="middle">A 卷最后题：路径覆盖答案图</text>
  <text class="subtitle" x="600" y="84" text-anchor="middle">两个判断点 D1、D2 没有循环，所以路径覆盖要列 4 条完整路径</text>

  <rect class="panel" x="40" y="112" width="500" height="742" rx="16"/>
  <text class="tableHead" x="290" y="148" text-anchor="middle">编号后的控制流</text>

  <rect class="end" x="185" y="178" width="210" height="58" rx="29"/>
  <text class="text" x="290" y="200" text-anchor="middle">1</text>
  <text class="small" x="290" y="222" text-anchor="middle">开始；n = 1</text>

  <path class="line" d="M290 236 L290 276"/>
  <polygon class="decision" points="290,276 420,335 290,394 160,335"/>
  <text class="text" x="290" y="328" text-anchor="middle">2：D1</text>
  <text class="small" x="290" y="352" text-anchor="middle">x &gt; 0 || y &lt; 0 ?</text>

  <path class="line" d="M184 360 L124 360 L124 452"/>
  <text class="label" x="147" y="342" text-anchor="middle">真</text>
  <rect class="node" x="54" y="452" width="140" height="58" rx="10"/>
  <text class="text" x="124" y="475" text-anchor="middle">3</text>
  <text class="small" x="124" y="496" text-anchor="middle">n=n+x</text>

  <path class="line" d="M396 360 L456 360 L456 452"/>
  <text class="label" x="432" y="342" text-anchor="middle">假</text>
  <rect class="node" x="386" y="452" width="140" height="58" rx="10"/>
  <text class="text" x="456" y="475" text-anchor="middle">4</text>
  <text class="small" x="456" y="496" text-anchor="middle">n=n+y</text>

  <path class="thin" d="M124 510 L124 566 L290 566"/>
  <path class="thin" d="M456 510 L456 566 L290 566"/>
  <path class="line" d="M290 566 L290 606"/>

  <polygon class="decision" points="290,606 410,660 290,714 170,660"/>
  <text class="text" x="290" y="654" text-anchor="middle">5：D2</text>
  <text class="small" x="290" y="677" text-anchor="middle">z &gt; 0 ?</text>

  <path class="line" d="M290 714 L290 760"/>
  <text class="label" x="317" y="739">真</text>
  <rect class="node" x="210" y="760" width="160" height="58" rx="10"/>
  <text class="text" x="290" y="783" text-anchor="middle">6</text>
  <text class="small" x="290" y="804" text-anchor="middle">n=n+z</text>

  <path class="line" d="M410 660 L480 660 L480 829 L374 829"/>
  <text class="label" x="438" y="642" text-anchor="middle">假</text>

  <path class="line" d="M290 818 L290 828"/>
  <rect class="end" x="205" y="828" width="170" height="44" rx="22"/>
  <text class="text" x="290" y="857" text-anchor="middle">7：return</text>

  <rect class="panel" x="575" y="112" width="585" height="742" rx="16"/>
  <text class="tableHead" x="867" y="148" text-anchor="middle">路径覆盖最终答案</text>
  <text class="hint" x="610" y="186">先设：D1 = x&gt;0 || y&lt;0；D2 = z&gt;0</text>
  <text class="tableHead" x="610" y="232">路径</text>
  <text class="tableHead" x="704" y="232">真假组合</text>
  <text class="tableHead" x="850" y="232">输入 (x,y,z)</text>
  <text class="tableHead" x="1014" y="232">返回值</text>
  <line class="row" x1="600" y1="250" x2="1136" y2="250"/>

  <text class="tableText" x="610" y="289">P1</text>
  <text class="tableText" x="704" y="289">D1 真，D2 真</text>
  <text class="tableText" x="850" y="289">(1,0,1)</text>
  <text class="tableText" x="1014" y="289">1+1+1 = 3</text>
  <line class="row" x1="600" y1="312" x2="1136" y2="312"/>

  <text class="tableText" x="610" y="351">P2</text>
  <text class="tableText" x="704" y="351">D1 真，D2 假</text>
  <text class="tableText" x="850" y="351">(1,0,0)</text>
  <text class="tableText" x="1014" y="351">1+1 = 2</text>
  <line class="row" x1="600" y1="374" x2="1136" y2="374"/>

  <text class="tableText" x="610" y="413">P3</text>
  <text class="tableText" x="704" y="413">D1 假，D2 真</text>
  <text class="tableText" x="850" y="413">(0,0,1)</text>
  <text class="tableText" x="1014" y="413">1+0+1 = 2</text>
  <line class="row" x1="600" y1="436" x2="1136" y2="436"/>

  <text class="tableText" x="610" y="475">P4</text>
  <text class="tableText" x="704" y="475">D1 假，D2 假</text>
  <text class="tableText" x="850" y="475">(0,0,0)</text>
  <text class="tableText" x="1014" y="475">1+0 = 1</text>

  <rect x="610" y="545" width="500" height="106" rx="14" fill="#f2f8f5" stroke="#2f6f5e" stroke-width="2"/>
  <text class="hint" x="632" y="584">语句覆盖最少 2 组：</text>
  <text class="tableText" x="632" y="615">T1=(1,0,1)：覆盖 n=n+x 和 n=n+z，返回 3</text>
  <text class="tableText" x="632" y="644">T2=(0,0,0)：覆盖 n=n+y，返回 1</text>

  <rect x="610" y="690" width="500" height="104" rx="14" fill="#fff8ed" stroke="#a14f35" stroke-width="2"/>
  <text class="hint" x="632" y="729" fill="#a14f35">不要混淆：</text>
  <text class="tableText" x="632" y="760">基本路径看 V(G)=判断点 2 + 1 = 3</text>
  <text class="tableText" x="632" y="789">路径覆盖看所有完整走法，本题是 4 条。</text>
</svg>
