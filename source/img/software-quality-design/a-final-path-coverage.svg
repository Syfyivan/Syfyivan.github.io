<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A 卷最后题路径覆盖编号版答案图</title>
  <desc id="desc">左侧控制流图只写节点编号，右侧列出编号含义、四条路径、测试输入和返回值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#26313d"/>
    </marker>
    <style>
      .bg { fill: #fbfcfb; }
      .title { fill: #20242a; font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #5b6673; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .node { fill: #f2f7fb; stroke: #365f91; stroke-width: 2.3; }
      .decision { fill: #fff8ed; stroke: #a14f35; stroke-width: 2.5; }
      .end { fill: #f2f8f5; stroke: #2f6f5e; stroke-width: 2.3; }
      .line { fill: none; stroke: #26313d; stroke-width: 2.3; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #26313d; stroke-width: 2; marker-end: url(#arrow); }
      .num { fill: #20242a; font: 800 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #a14f35; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tableHead { fill: #365f91; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tableText { fill: #303843; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: #ffffff; stroke: rgba(32, 36, 42, 0.16); stroke-width: 1.5; }
      .row { stroke: rgba(32, 36, 42, 0.14); stroke-width: 1; }
      .hint { fill: #2f6f5e; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="900" rx="26"/>
  <text class="title" x="600" y="52" text-anchor="middle">A 卷最后题：路径覆盖编号版答案图</text>
  <text class="subtitle" x="600" y="84" text-anchor="middle">控制流图只写编号；路径表再说明每条路的真假组合、输入和返回值</text>

  <rect class="panel" x="40" y="112" width="420" height="742" rx="16"/>
  <text class="tableHead" x="250" y="148" text-anchor="middle">控制流图（只写编号）</text>

  <circle class="node" cx="250" cy="202" r="32"/>
  <text class="num" x="250" y="211" text-anchor="middle">1</text>

  <path class="line" d="M250 234 L250 278"/>
  <polygon class="decision" points="250,278 358,332 250,386 142,332"/>
  <text class="num" x="250" y="341" text-anchor="middle">2</text>

  <path class="line" d="M164 358 L102 358 L102 458"/>
  <text class="label" x="126" y="340" text-anchor="middle">真</text>
  <circle class="node" cx="102" cy="490" r="32"/>
  <text class="num" x="102" y="499" text-anchor="middle">3</text>

  <path class="line" d="M336 358 L398 358 L398 458"/>
  <text class="label" x="374" y="340" text-anchor="middle">假</text>
  <circle class="node" cx="398" cy="490" r="32"/>
  <text class="num" x="398" y="499" text-anchor="middle">4</text>

  <path class="thin" d="M102 522 L102 582 L250 582"/>
  <path class="thin" d="M398 522 L398 582 L250 582"/>
  <path class="line" d="M250 582 L250 620"/>

  <polygon class="decision" points="250,620 348,670 250,720 152,670"/>
  <text class="num" x="250" y="679" text-anchor="middle">5</text>

  <path class="line" d="M250 720 L250 764"/>
  <text class="label" x="278" y="746">真</text>
  <circle class="node" cx="250" cy="796" r="30"/>
  <text class="num" x="250" y="805" text-anchor="middle">6</text>

  <path class="line" d="M348 670 L426 670 L426 836 L314 836"/>
  <text class="label" x="380" y="652" text-anchor="middle">假</text>

  <path class="line" d="M250 826 L250 836"/>
  <rect class="end" x="192" y="836" width="116" height="42" rx="21"/>
  <text class="num" x="250" y="866" text-anchor="middle">7</text>

  <rect class="panel" x="492" y="112" width="668" height="742" rx="16"/>
  <text class="tableHead" x="826" y="148" text-anchor="middle">编号含义 + 路径覆盖最终答案</text>

  <text class="hint" x="525" y="188">编号含义：</text>
  <text class="tableText" x="525" y="220">1: n=1；2: 判断 x&gt;0||y&lt;0；3: n=n+x；4: n=n+y；5: 判断 z&gt;0；6: n=n+z；7: return n</text>

  <line class="row" x1="520" y1="248" x2="1132" y2="248"/>
  <text class="tableHead" x="525" y="282">路径</text>
  <text class="tableHead" x="610" y="282">节点序列</text>
  <text class="tableHead" x="760" y="282">真假组合</text>
  <text class="tableHead" x="920" y="282">输入</text>
  <text class="tableHead" x="1040" y="282">返回值</text>
  <line class="row" x1="520" y1="304" x2="1132" y2="304"/>

  <text class="tableText" x="525" y="342">P1</text>
  <text class="tableText" x="610" y="342">1-2-3-5-6-7</text>
  <text class="tableText" x="760" y="342">D1 真，D2 真</text>
  <text class="tableText" x="920" y="342">(1,0,1)</text>
  <text class="tableText" x="1040" y="342">3</text>
  <line class="row" x1="520" y1="365" x2="1132" y2="365"/>

  <text class="tableText" x="525" y="403">P2</text>
  <text class="tableText" x="610" y="403">1-2-3-5-7</text>
  <text class="tableText" x="760" y="403">D1 真，D2 假</text>
  <text class="tableText" x="920" y="403">(1,0,0)</text>
  <text class="tableText" x="1040" y="403">2</text>
  <line class="row" x1="520" y1="426" x2="1132" y2="426"/>

  <text class="tableText" x="525" y="464">P3</text>
  <text class="tableText" x="610" y="464">1-2-4-5-6-7</text>
  <text class="tableText" x="760" y="464">D1 假，D2 真</text>
  <text class="tableText" x="920" y="464">(0,0,1)</text>
  <text class="tableText" x="1040" y="464">2</text>
  <line class="row" x1="520" y1="487" x2="1132" y2="487"/>

  <text class="tableText" x="525" y="525">P4</text>
  <text class="tableText" x="610" y="525">1-2-4-5-7</text>
  <text class="tableText" x="760" y="525">D1 假，D2 假</text>
  <text class="tableText" x="920" y="525">(0,0,0)</text>
  <text class="tableText" x="1040" y="525">1</text>

  <rect x="525" y="600" width="560" height="104" rx="14" fill="#f2f8f5" stroke="#2f6f5e" stroke-width="2"/>
  <text class="hint" x="548" y="636">语句覆盖最少 2 组：</text>
  <text class="tableText" x="548" y="666">T1=(1,0,1)：覆盖 1、2真、3、5真、6、7，返回 3</text>
  <text class="tableText" x="548" y="694">T2=(0,0,0)：覆盖 1、2假、4、5假、7，返回 1</text>

  <rect x="525" y="738" width="560" height="72" rx="14" fill="#fff8ed" stroke="#a14f35" stroke-width="2"/>
  <text class="tableText" x="548" y="770">基本路径看 V(G)=判断点 2 + 1 = 3；</text>
  <text class="tableText" x="548" y="798">路径覆盖看所有完整可行走法，本题是 4 条。</text>
</svg>
