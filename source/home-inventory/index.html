<header class="top">
  <div class="top-inner">
    <h1>🏠 我的<span class="em">居家清单</span></h1>
    <p class="subtitle">记录家里应有的一切 · 有的打勾，缺的进购物清单 · 为未来的物联网之家打好第一份底稿</p>
    <div class="overview">
      <div class="stat">
        <div class="num" id="stat-total">0</div>
        <div class="lbl">全部条目</div>
      </div>
      <div class="stat">
        <div class="num have" id="stat-have">0</div>
        <div class="lbl">已拥有</div>
      </div>
      <div class="stat">
        <div class="num need" id="stat-need">0</div>
        <div class="lbl">待购买</div>
      </div>
      <div class="stat" style="flex:2;min-width:200px;">
        <div class="num" id="stat-pct">0%</div>
        <div class="lbl">备齐进度</div>
        <div class="bar"><i id="stat-bar"></i></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="search">
      🔍<input type="text" id="search" placeholder="搜索物品，比如「炒锅」「牙刷」…">
    </div>
    <div class="filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="need">待购买</button>
      <button data-filter="have">已拥有</button>
    </div>
    <button class="btn primary" id="open-shop">🛒 购物清单 <span id="shop-badge" style="background:#fff;color:var(--accent);border-radius:20px;padding:0 7px;font-size:12px;font-weight:700;">0</span></button>
  </div>

  <div id="cats"></div>

  <button class="add-cat" id="add-cat">＋ 新增一个分类</button>

  <footer>
    数据自动保存在此浏览器本地，换设备可用「导出/导入」迁移。
    <br><br>
    <button class="btn ghost" id="export-btn">⬇ 导出备份</button>
    <button class="btn ghost" id="import-btn">⬆ 导入备份</button>
    <button class="btn ghost" id="reset-btn">↺ 恢复默认清单</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  </footer>
</div>

<!-- Item / Category Modal -->
<div class="mask" id="modal-mask">
  <div class="modal" id="modal"></div>
</div>

<!-- Shopping Drawer -->
<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>🛒 购物清单</h3>
    <button class="icon-btn" id="close-drawer" style="font-size:20px;">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot">
    <button class="btn ghost" style="flex:1" id="copy-shop">📋 复制清单</button>
    <button class="btn primary" style="flex:1" id="print-shop">🖨 打印</button>
  </div>
</div>

<div class="toast" id="toast"></div>

  {id:'c-safety', emoji:'🧯', name:'安全 · 应急', items:[

    ['门锁 / 智能锁','',1],['监控摄像头','',0]
  ]}
];

const EMOJIS = ['🍳','🍽️','🚿','🛏️','🛋️','🧹','🧺','🚪','💻','💊','🧯','📦','🌿','🐱','🍼','🎮','🛠️','📚','🎨','☕','🔌','🏠'];

/* ---------------- 状态管理 ---------------- */
const LS_KEY = 'home_inventory_v1';
let data = load();
let currentFilter = 'all';
let searchTerm = '';

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return normalize(DEFAULT_DATA);
}
function normalize(arr){
  // 把默认数据的紧凑数组转为对象
  return arr.map(c=>({
    id:c.id||('c-'+Math.random().toString(36).slice(2,8)),
    emoji:c.emoji, name:c.name, collapsed:false,
    items:c.items.map(it=>Array.isArray(it)
      ? {id:'i-'+Math.random().toString(36).slice(2,9), name:it[0], note:it[1]||'', have:!!it[2]}
      : it)
  }));
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(data)); }

/* ---------------- 渲染 ---------------- */
const catsEl = document.getElementById('cats');

function matchFilter(it){
  if(currentFilter==='have' && !it.have) return false;
  if(currentFilter==='need' && it.have) return false;
  if(searchTerm && !it.name.toLowerCase().includes(searchTerm)) return false;
  return true;
}

function render(){
  catsEl.innerHTML='';
  data.forEach(cat=>{
    const visItems = cat.items.filter(matchFilter);
    if((searchTerm||currentFilter!=='all') && visItems.length===0) return; // 过滤时隐藏空分类
    const have = cat.items.filter(i=>i.have).length;
    const total = cat.items.length;
    const pct = total? Math.round(have/total*100):0;

    const catDiv=document.createElement('div');
    catDiv.className='cat'+(cat.collapsed?' collapsed':'');
    catDiv.innerHTML=`
      <div class="cat-head" data-cat="${cat.id}">
        <span class="cat-emoji">${cat.emoji}</span>
        <h3 class="cat-title">${esc(cat.name)}</h3>
        <div class="cat-mini-bar"><i style="width:${pct}%"></i></div>
        <span class="cat-count">${have}/${total}</span>
        <span class="icon-btn edit-cat" data-cat="${cat.id}" title="编辑分类">✎</span>
        <span class="chevron">▼</span>
      </div>
      <div class="items"></div>`;
    const itemsBox=catDiv.querySelector('.items');
    (searchTerm||currentFilter!=='all'? visItems : cat.items).forEach(it=>{
      const row=document.createElement('div');
      row.className='item'+(it.have?' have':'');
      row.innerHTML=`
        <div class="check" data-toggle="${cat.id}:${it.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="item-name">${esc(it.name)}${it.note?`<span class="item-note">· ${esc(it.note)}</span>`:''}</span>
        <span class="tag-need">待购买</span>
        <span class="item-actions">
          <button class="icon-btn edit-item" data-e="${cat.id}:${it.id}" title="编辑">✎</button>
          <button class="icon-btn del-item" data-d="${cat.id}:${it.id}" title="删除">🗑</button>
        </span>`;
      itemsBox.appendChild(row);
    });
    const addRow=document.createElement('div');
    addRow.className='add-item-row';
    addRow.innerHTML=`<button class="btn ghost add-item" data-cat="${cat.id}">＋ 添加物品</button>`;
    itemsBox.appendChild(addRow);
    catsEl.appendChild(catDiv);
  });
  updateStats();
}

function updateStats(){
  let total=0,have=0;
  data.forEach(c=>c.items.forEach(i=>{total++;if(i.have)have++;}));
  const need=total-have;
  const pct=total?Math.round(have/total*100):0;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-have').textContent=have;
  document.getElementById('stat-need').textContent=need;
  document.getElementById('stat-pct').textContent=pct+'%';
  document.getElementById('stat-bar').style.width=pct+'%';
  document.getElementById('shop-badge').textContent=need;
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------------- 事件委托 ---------------- */
catsEl.addEventListener('click',e=>{
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){ toggleItem(toggle.dataset.toggle); return; }
  const delBtn=e.target.closest('.del-item');
  if(delBtn){ delItem(delBtn.dataset.d); return; }
  const editBtn=e.target.closest('.edit-item');
  if(editBtn){ openItemModal(editBtn.dataset.e); return; }
  const addBtn=e.target.closest('.add-item');
  if(addBtn){ openItemModal(addBtn.dataset.cat+':new'); return; }
  const editCat=e.target.closest('.edit-cat');
  if(editCat){ e.stopPropagation(); openCatModal(editCat.dataset.cat); return; }
  const head=e.target.closest('.cat-head');
  if(head){ const c=find(head.dataset.cat); c.collapsed=!c.collapsed; save(); render(); }
});

function find(cid){return data.find(c=>c.id===cid);}
function findItem(cid,iid){const c=find(cid);return c?c.items.find(i=>i.id===iid):null;}

function toggleItem(key){
  const [cid,iid]=key.split(':');
  const it=findItem(cid,iid);
  if(it){it.have=!it.have;save();render();}
}
function delItem(key){
  const [cid,iid]=key.split(':');
  const c=find(cid);
  c.items=c.items.filter(i=>i.id!==iid);
  save();render();toast('已删除');
}

/* ---------------- 物品弹窗 ---------------- */
const mask=document.getElementById('modal-mask');
const modal=document.getElementById('modal');
function closeModal(){mask.classList.remove('show');}
mask.addEventListener('click',e=>{if(e.target===mask)closeModal();});

function openItemModal(key){
  const [cid,iid]=key.split(':');
  const isNew = iid==='new';
  const it = isNew? {name:'',note:'',have:false} : findItem(cid,iid);
  modal.innerHTML=`
    <h3>${isNew?'添加物品':'编辑物品'}</h3>
    <label>物品名称</label>
    <input id="m-name" value="${esc(it.name)}" placeholder="例如：电饭煲">
    <label>备注（可选）</label>
    <input id="m-note" value="${esc(it.note||'')}" placeholder="例如：容量 3L / 品牌偏好">
    <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
      <input type="checkbox" id="m-have" ${it.have?'checked':''} style="width:auto;"> 我已经拥有它
    </label>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModalGlobal()">取消</button>
      <button class="btn primary" id="m-save">保存</button>
    </div>`;
  mask.classList.add('show');
  document.getElementById('m-name').focus();
  document.getElementById('m-save').onclick=()=>{
    const name=document.getElementById('m-name').value.trim();
    if(!name){toast('请填写名称');return;}
    const note=document.getElementById('m-note').value.trim();
    const have=document.getElementById('m-have').checked;
    if(isNew){
      find(cid).items.push({id:'i-'+Math.random().toString(36).slice(2,9),name,note,have});
    }else{it.name=name;it.note=note;it.have=have;}
    save();render();closeModal();toast(isNew?'已添加':'已保存');
  };
}

/* ---------------- 分类弹窗 ---------------- */
function openCatModal(cid){
  const isNew = cid==='new';
  const c = isNew? {emoji:'📦',name:''} : find(cid);
  modal.innerHTML=`
    <h3>${isNew?'新增分类':'编辑分类'}</h3>
    <label>分类名称</label>
    <input id="c-name" value="${esc(c.name)}" placeholder="例如：宠物用品 / 母婴">
    <label>选择图标</label>
    <div class="emoji-pick" id="c-emoji">${EMOJIS.map(em=>`<span data-em="${em}" class="${em===c.emoji?'sel':''}">${em}</span>`).join('')}</div>
    <div class="modal-actions">
      ${isNew?'':'<button class="btn ghost" id="c-del" style="margin-right:auto;color:var(--accent)">删除该分类</button>'}
      <button class="btn ghost" onclick="closeModalGlobal()">取消</button>
      <button class="btn primary" id="c-save">保存</button>
    </div>`;
  mask.classList.add('show');
  let picked=c.emoji;
  modal.querySelector('#c-emoji').addEventListener('click',e=>{
    const s=e.target.closest('[data-em]');if(!s)return;
    picked=s.dataset.em;
    modal.querySelectorAll('#c-emoji span').forEach(x=>x.classList.remove('sel'));
    s.classList.add('sel');
  });
  document.getElementById('c-save').onclick=()=>{
    const name=document.getElementById('c-name').value.trim();
    if(!name){toast('请填写分类名');return;}
    if(isNew){
      data.push({id:'c-'+Math.random().toString(36).slice(2,8),emoji:picked,name,collapsed:false,items:[]});
    }else{c.name=name;c.emoji=picked;}
    save();render();closeModal();toast(isNew?'分类已创建':'已保存');
  };
  const delB=document.getElementById('c-del');
  if(delB)delB.onclick=()=>{
    if(confirm('确定删除「'+c.name+'」及其下所有物品？')){
      data=data.filter(x=>x.id!==cid);save();render();closeModal();toast('分类已删除');
    }
  };
}
window.closeModalGlobal=closeModal;

document.getElementById('add-cat').onclick=()=>openCatModal('new');

/* ---------------- 筛选 / 搜索 ---------------- */
document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');currentFilter=b.dataset.filter;render();
  };
});
document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.trim().toLowerCase();render();
});

/* ---------------- 购物清单抽屉 ---------------- */
const drawer=document.getElementById('drawer');
const drawerMask=document.getElementById('drawer-mask');
function openDrawer(){renderShop();drawer.classList.add('show');drawerMask.classList.add('show');}
function closeDrawer(){drawer.classList.remove('show');drawerMask.classList.remove('show');}
document.getElementById('open-shop').onclick=openDrawer;
document.getElementById('close-drawer').onclick=closeDrawer;
drawerMask.onclick=closeDrawer;

function renderShop(){
  const body=document.getElementById('drawer-body');
  let html='';let count=0;
  data.forEach(c=>{
    const need=c.items.filter(i=>!i.have);
    if(need.length===0)return;
    count+=need.length;
    html+=`<div class="shop-cat">${c.emoji} ${esc(c.name)}</div>`;
    need.forEach(i=>{
      html+=`<div class="shop-item"><span class="dot"></span><span>${esc(i.name)}${i.note?` <span class="item-note">(${esc(i.note)})</span>`:''}</span></div>`;
    });
  });
  body.innerHTML = count? html : '<div class="empty">🎉 太棒了！所有物品都已备齐，没有需要购买的东西。</div>';
}

function shopText(){
  let lines=['🛒 我的购物清单',''];
  data.forEach(c=>{
    const need=c.items.filter(i=>!i.have);
    if(need.length===0)return;
    lines.push(`【${c.name}】`);
    need.forEach(i=>lines.push(`  □ ${i.name}${i.note?`（${i.note}）`:''}`));
    lines.push('');
  });
  return lines.join('\n');
}
document.getElementById('copy-shop').onclick=()=>{
  navigator.clipboard.writeText(shopText()).then(()=>toast('购物清单已复制')).catch(()=>toast('复制失败'));
};
document.getElementById('print-shop').onclick=()=>{
  const w=window.open('','_blank');
  w.document.write('<pre style="font-family:sans-serif;font-size:15px;line-height:1.8;padding:20px;">'+esc(shopText())+'</pre>');
  w.document.close();w.print();
};

/* ---------------- 导入 / 导出 / 重置 ---------------- */
document.getElementById('export-btn').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='居家清单备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();toast('已导出备份文件');
};
document.getElementById('import-btn').onclick=()=>document.getElementById('import-file').click();
document.getElementById('import-file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);if(Array.isArray(d)){data=d;save();render();toast('导入成功');}else toast('文件格式不对');}
    catch(err){toast('文件解析失败');}
  };
  r.readAsText(f);
};
document.getElementById('reset-btn').onclick=()=>{
  if(confirm('恢复默认清单会覆盖当前所有记录，确定吗？（建议先导出备份）')){
    data=normalize(DEFAULT_DATA);save();render();toast('已恢复默认清单');
  }
};

/* ---------------- Toast ---------------- */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* init */
render();
</script>
</body>
</html>
