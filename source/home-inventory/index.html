    {name:'出门用品', items:[['钥匙挂钩','',0],['雨伞','',1],['穿衣镜','',0],['门垫','',0],['收纳篮','',0]]}
  ]},
  {emoji:'💻', name:'数码 · 办公', groups:[
    {name:'设备', items:[['电脑 / 笔记本','',1],['显示器','',0],['打印机','',0],['平板','',0]]},
    {name:'桌面', items:[['书桌','',0],['办公椅','',0],['护眼台灯','',0]]},
    {name:'配件', items:[['充电器 / 数据线','',1],['移动电源','',0],['耳机 / 音箱','',0],['文具','',0],['收纳整理箱','',0]]}
  ]},
  {emoji:'💊', name:'健康 · 医药', groups:[
    {name:'常备药', items:[['感冒药','',1],['退烧药','',1],['肠胃药','',0],['消炎药','',0],['止痛药','',0]]},
    {name:'医疗用品', items:[['创可贴 / 消毒棉','',1],['纱布','',0],['体温计','',1],['血压计','',0],['医药箱','',0]]},
    {name:'防护', items:[['口罩','',1],['防蚊 / 驱虫用品','',0],['维生素','',0]]}
  ]},
  {emoji:'🧯', name:'安全 · 应急', groups:[
    {name:'消防', items:[['灭火器','',0],['烟雾报警器','',0],['灭火毯','',0]]},
    {name:'应急', items:[['手电筒','',1],['应急电池','',0],['急救包','',0],['应急食物 / 水','',0]]},
    {name:'安防', items:[['智能门锁','',1],['监控摄像头','',0],['门窗传感器','',0]]}
  ]}
];

const EMOJIS = ['🍳','🍽️','🚿','🛏️','🛋️','🧹','🧺','🚪','💻','💊','🧯','📦','🌿','🐱','🍼','🎮','🛠️','📚','🎨','☕','🔌','🏠'];

/* ============ 状态 ============ */
const LS_KEY = 'home_inventory_v2';
const LS_OLD = 'home_inventory_v1';
let data = load();
let currentFilter='all', searchTerm='';

function rid(p){return p+Math.random().toString(36).slice(2,9);}

function normalize(arr){
  return arr.map(c=>({
    id:c.id||rid('c-'), emoji:c.emoji, name:c.name, collapsed:false,
    groups:(c.groups||[]).map(g=>({
      id:g.id||rid('g-'), name:g.name, collapsed:false,
      items:(g.items||[]).map(it=>Array.isArray(it)
        ? {id:rid('i-'),name:it[0],note:it[1]||'',have:!!it[2]}
        : {id:it.id||rid('i-'),name:it.name,note:it.note||'',have:!!it.have})
    }))
  }));
}

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  // 从旧版（扁平 items）迁移：把每个大类的 items 放进一个默认子分类
  try{
    const old=localStorage.getItem(LS_OLD);
    if(old){
      const oldData=JSON.parse(old);
      const migrated=oldData.map(c=>({
        id:c.id||rid('c-'),emoji:c.emoji,name:c.name,collapsed:false,
        groups:[{id:rid('g-'),name:'其他',collapsed:false,
          items:(c.items||[]).map(it=>({id:it.id||rid('i-'),name:it.name,note:it.note||'',have:!!it.have}))}]
      }));
      // 尽量把旧勾选状态合并进新默认清单
      const merged=mergeHaveState(normalize(DEFAULT_DATA), migrated);
      return merged;
    }
  }catch(e){}
  return normalize(DEFAULT_DATA);
}

// 把旧数据里的"已拥有"状态按物品名称合并到新默认清单
function mergeHaveState(base, old){
  const haveNames=new Set();
  old.forEach(c=>c.groups.forEach(g=>g.items.forEach(i=>{if(i.have)haveNames.add(i.name.trim());})));
  base.forEach(c=>c.groups.forEach(g=>g.items.forEach(i=>{if(haveNames.has(i.name.trim()))i.have=true;})));
  return base;
}

function save(){localStorage.setItem(LS_KEY,JSON.stringify(data));}

/* ============ 渲染 ============ */
const catsEl=document.getElementById('cats');
const filtering=()=>searchTerm||currentFilter!=='all';

function matchFilter(it){
  if(currentFilter==='have'&&!it.have)return false;
  if(currentFilter==='need'&&it.have)return false;
  if(searchTerm&&!it.name.toLowerCase().includes(searchTerm))return false;
  return true;
}
function catStats(cat){
  let t=0,h=0;cat.groups.forEach(g=>g.items.forEach(i=>{t++;if(i.have)h++;}));return{t,h};
}

function render(){
  catsEl.innerHTML='';
  data.forEach(cat=>{
    const {t,h}=catStats(cat);
    const pct=t?Math.round(h/t*100):0;
    // 过滤模式下，若整个大类没有可见项则跳过
    if(filtering()){
      const vis=cat.groups.some(g=>g.items.some(matchFilter));
      if(!vis)return;
    }
    const catDiv=document.createElement('div');
    catDiv.className='cat'+(cat.collapsed&&!filtering()?' collapsed':'');
    catDiv.innerHTML=`
      <div class="cat-head" data-cat="${cat.id}">
        <span class="cat-emoji">${cat.emoji}</span>
        <h3 class="cat-title">${esc(cat.name)}</h3>
        <div class="cat-mini-bar"><i style="width:${pct}%"></i></div>
        <span class="cat-count">${h}/${t}</span>
        <span class="icon-btn edit-cat" data-cat="${cat.id}" title="编辑大类">✎</span>
        <span class="chevron">▼</span>
      </div>
      <div class="cat-body"></div>`;
    const body=catDiv.querySelector('.cat-body');

    cat.groups.forEach(g=>{
      const visItems=filtering()?g.items.filter(matchFilter):g.items;
      if(filtering()&&visItems.length===0)return;
      const gh=g.items.filter(i=>i.have).length, gt=g.items.length;
      const gDiv=document.createElement('div');
      gDiv.className='group'+(g.collapsed&&!filtering()?' collapsed':'');
      gDiv.innerHTML=`
        <div class="group-head" data-group="${cat.id}:${g.id}">
          <span class="group-dot"></span>
          <h4 class="group-title">${esc(g.name)}</h4>
          <span class="group-count">${gh}/${gt}</span>
          <span class="group-actions">
            <button class="icon-btn edit-group" data-eg="${cat.id}:${g.id}" title="编辑小分类">✎</button>
            <button class="icon-btn del-group" data-dg="${cat.id}:${g.id}" title="删除小分类">🗑</button>
          </span>
          <span class="group-chevron">▼</span>
        </div>
        <div class="items"></div>`;
      const itemsBox=gDiv.querySelector('.items');
      visItems.forEach(it=>{
        const row=document.createElement('div');
        row.className='item'+(it.have?' have':'');
        row.innerHTML=`
          <div class="check" data-toggle="${cat.id}:${g.id}:${it.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="item-name">${esc(it.name)}${it.note?`<span class="item-note">· ${esc(it.note)}</span>`:''}</span>
          <span class="tag-need">待购买</span>
          <span class="item-actions">
            <button class="icon-btn edit-item" data-e="${cat.id}:${g.id}:${it.id}" title="编辑">✎</button>
            <button class="icon-btn del-item" data-d="${cat.id}:${g.id}:${it.id}" title="删除">🗑</button>
          </span>`;
        itemsBox.appendChild(row);
      });
      const addRow=document.createElement('div');
      addRow.className='add-row';
      addRow.innerHTML=`<button class="btn ghost sm add-item" data-add="${cat.id}:${g.id}">＋ 添加物品</button>`;
      itemsBox.appendChild(addRow);
      body.appendChild(gDiv);
    });

    if(!filtering()){
      const ag=document.createElement('div');
      ag.className='add-group-row';
      ag.innerHTML=`<button class="btn ghost sm add-group" data-addg="${cat.id}">＋ 添加小分类</button>`;
      body.appendChild(ag);
    }
    catsEl.appendChild(catDiv);
  });
  updateStats();
}

function updateStats(){
  let t=0,h=0;data.forEach(c=>c.groups.forEach(g=>g.items.forEach(i=>{t++;if(i.have)h++;})));
  const need=t-h,pct=t?Math.round(h/t*100):0;
  document.getElementById('stat-total').textContent=t;
  document.getElementById('stat-have').textContent=h;
  document.getElementById('stat-need').textContent=need;
  document.getElementById('stat-pct').textContent=pct+'%';
  document.getElementById('stat-bar').style.width=pct+'%';
  document.getElementById('shop-badge').textContent=need;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============ 查找 ============ */
function findCat(cid){return data.find(c=>c.id===cid);}
function findGroup(cid,gid){const c=findCat(cid);return c?c.groups.find(g=>g.id===gid):null;}
function findItem(cid,gid,iid){const g=findGroup(cid,gid);return g?g.items.find(i=>i.id===iid):null;}

/* ============ 事件委托 ============ */
catsEl.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){const[c,g,i]=tg.dataset.toggle.split(':');const it=findItem(c,g,i);if(it){it.have=!it.have;save();render();}return;}
  const del=e.target.closest('.del-item');
  if(del){const[c,g,i]=del.dataset.d.split(':');const gr=findGroup(c,g);gr.items=gr.items.filter(x=>x.id!==i);save();render();toast('已删除');return;}
  const ed=e.target.closest('.edit-item');
  if(ed){openItemModal(ed.dataset.e);return;}
  const add=e.target.closest('.add-item');
  if(add){openItemModal(add.dataset.add+':new');return;}
  const eg=e.target.closest('.edit-group');
  if(eg){e.stopPropagation();openGroupModal(eg.dataset.eg);return;}
  const dg=e.target.closest('.del-group');
  if(dg){e.stopPropagation();delGroup(dg.dataset.dg);return;}
  const addg=e.target.closest('.add-group');
  if(addg){openGroupModal(addg.dataset.addg+':new');return;}
  const ec=e.target.closest('.edit-cat');
  if(ec){e.stopPropagation();openCatModal(ec.dataset.cat);return;}
  const gHead=e.target.closest('.group-head');
  if(gHead){const[c,g]=gHead.dataset.group.split(':');const gr=findGroup(c,g);gr.collapsed=!gr.collapsed;save();render();return;}
  const cHead=e.target.closest('.cat-head');
  if(cHead){const c=findCat(cHead.dataset.cat);c.collapsed=!c.collapsed;save();render();return;}
});

function delGroup(key){
  const[c,g]=key.split(':');const cat=findCat(c);const gr=findGroup(c,g);
  if(confirm('确定删除小分类「'+gr.name+'」及其下所有物品？')){
    cat.groups=cat.groups.filter(x=>x.id!==g);save();render();toast('小分类已删除');
  }
}

/* ============ 物品弹窗 ============ */
const mask=document.getElementById('modal-mask');
const modal=document.getElementById('modal');
function closeModal(){mask.classList.remove('show');}
window.closeModalGlobal=closeModal;
mask.addEventListener('click',e=>{if(e.target===mask)closeModal();});

function openItemModal(key){
  const[cid,gid,iid]=key.split(':');
  const isNew=iid==='new';
  const cat=findCat(cid);
  const it=isNew?{name:'',note:'',have:false}:findItem(cid,gid,iid);
  // 所属小分类下拉（可移动）
  const groupOpts=cat.groups.map(g=>`<option value="${g.id}" ${g.id===gid?'selected':''}>${esc(g.name)}</option>`).join('');
  modal.innerHTML=`
    <h3>${isNew?'添加物品':'编辑物品'}</h3>
    <label>物品名称</label>
    <input id="m-name" value="${esc(it.name)}" placeholder="例如：珍珠 / 花椒 / 炒锅">
    <label>备注（可选）</label>
    <input id="m-note" value="${esc(it.note||'')}" placeholder="例如：容量 3L / 品牌偏好 / 数量">
    <label>所属小分类</label>
    <select id="m-group">${groupOpts}</select>
    <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
      <input type="checkbox" id="m-have" ${it.have?'checked':''} style="width:auto;"> 我已经拥有它
    </label>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModalGlobal()">取消</button>
      <button class="btn primary" id="m-save">保存</button>
    </div>`;
  mask.classList.add('show');
  document.getElementById('m-name').focus();
  document.getElementById('m-save').onclick=()=>{
    const name=document.getElementById('m-name').value.trim();
    if(!name){toast('请填写名称');return;}
    const note=document.getElementById('m-note').value.trim();
    const have=document.getElementById('m-have').checked;
    const newGid=document.getElementById('m-group').value;
    if(isNew){
      findGroup(cid,newGid).items.push({id:rid('i-'),name,note,have});
    }else{
      if(newGid!==gid){ // 移动到别的小分类
        const src=findGroup(cid,gid);src.items=src.items.filter(x=>x.id!==iid);
        findGroup(cid,newGid).items.push({id:iid,name,note,have});
      }else{it.name=name;it.note=note;it.have=have;}
    }
    save();render();closeModal();toast(isNew?'已添加':'已保存');
  };
}

/* ============ 小分类弹窗 ============ */
function openGroupModal(key){
  const[cid,gid]=key.split(':');
  const isNew=gid==='new';
  const cat=findCat(cid);
  const g=isNew?{name:''}:findGroup(cid,gid);
  modal.innerHTML=`
    <h3>${isNew?'添加小分类':'编辑小分类'}</h3>
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 4px;">大类：${esc(cat.emoji)} ${esc(cat.name)}</p>
    <label>小分类名称</label>
    <input id="g-name" value="${esc(g.name)}" placeholder="例如：锅具 / 调料 / 香料 / 奶茶原料">
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModalGlobal()">取消</button>
      <button class="btn primary" id="g-save">保存</button>
    </div>`;
  mask.classList.add('show');
  document.getElementById('g-name').focus();
  document.getElementById('g-save').onclick=()=>{
    const name=document.getElementById('g-name').value.trim();
    if(!name){toast('请填写小分类名');return;}
    if(isNew){cat.groups.push({id:rid('g-'),name,collapsed:false,items:[]});}
    else{g.name=name;}
    save();render();closeModal();toast(isNew?'小分类已创建':'已保存');
  };
}

/* ============ 大类弹窗 ============ */
function openCatModal(cid){
  const isNew=cid==='new';
  const c=isNew?{emoji:'📦',name:''}:findCat(cid);
  modal.innerHTML=`
    <h3>${isNew?'新增大类':'编辑大类'}</h3>
    <label>大类名称</label>
    <input id="c-name" value="${esc(c.name)}" placeholder="例如：宠物用品 / 母婴 / 车载">
    <label>选择图标</label>
    <div class="emoji-pick" id="c-emoji">${EMOJIS.map(em=>`<span data-em="${em}" class="${em===c.emoji?'sel':''}">${em}</span>`).join('')}</div>
    <div class="modal-actions">
      ${isNew?'':'<button class="btn ghost" id="c-del" style="margin-right:auto;color:var(--accent)">删除该大类</button>'}
      <button class="btn ghost" onclick="closeModalGlobal()">取消</button>
      <button class="btn primary" id="c-save">保存</button>
    </div>`;
  mask.classList.add('show');
  let picked=c.emoji;
  modal.querySelector('#c-emoji').addEventListener('click',e=>{
    const s=e.target.closest('[data-em]');if(!s)return;picked=s.dataset.em;
    modal.querySelectorAll('#c-emoji span').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');
  });
  document.getElementById('c-save').onclick=()=>{
    const name=document.getElementById('c-name').value.trim();
    if(!name){toast('请填写大类名');return;}
    if(isNew){data.push({id:rid('c-'),emoji:picked,name,collapsed:false,groups:[{id:rid('g-'),name:'其他',collapsed:false,items:[]}]});}
    else{c.name=name;c.emoji=picked;}
    save();render();closeModal();toast(isNew?'大类已创建':'已保存');
  };
  const delB=document.getElementById('c-del');
  if(delB)delB.onclick=()=>{if(confirm('确定删除「'+c.name+'」及其下所有小分类和物品？')){data=data.filter(x=>x.id!==cid);save();render();closeModal();toast('大类已删除');}};
}
document.getElementById('add-cat').onclick=()=>openCatModal('new');

/* ============ 筛选 / 搜索 ============ */
document.querySelectorAll('.filters button').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render();};
});
document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();render();});

/* ============ 购物清单 ============ */
const drawer=document.getElementById('drawer'),drawerMask=document.getElementById('drawer-mask');
function openDrawer(){renderShop();drawer.classList.add('show');drawerMask.classList.add('show');}
function closeDrawer(){drawer.classList.remove('show');drawerMask.classList.remove('show');}
document.getElementById('open-shop').onclick=openDrawer;
document.getElementById('close-drawer').onclick=closeDrawer;
drawerMask.onclick=closeDrawer;

function renderShop(){
  const body=document.getElementById('drawer-body');let html='',count=0;
  data.forEach(c=>{
    const catNeed=c.groups.some(g=>g.items.some(i=>!i.have));
    if(!catNeed)return;
    html+=`<div class="shop-cat">${c.emoji} ${esc(c.name)}</div>`;
    c.groups.forEach(g=>{
      const need=g.items.filter(i=>!i.have);
      if(need.length===0)return;count+=need.length;
      html+=`<div class="shop-group">${esc(g.name)}</div>`;
      need.forEach(i=>{html+=`<div class="shop-item"><span class="dot"></span><span>${esc(i.name)}${i.note?` <span class="item-note">(${esc(i.note)})</span>`:''}</span></div>`;});
    });
  });
  body.innerHTML=count?html:'<div class="empty">🎉 太棒了！所有物品都已备齐，没有需要购买的东西。</div>';
}
function shopText(){
  let lines=['🛒 我的购物清单',''];
  data.forEach(c=>{
    if(!c.groups.some(g=>g.items.some(i=>!i.have)))return;
    lines.push(`【${c.name}】`);
    c.groups.forEach(g=>{
      const need=g.items.filter(i=>!i.have);if(need.length===0)return;
      lines.push(`  · ${g.name}`);
      need.forEach(i=>lines.push(`      □ ${i.name}${i.note?`（${i.note}）`:''}`));
    });
    lines.push('');
  });
  return lines.join('\n');
}
document.getElementById('copy-shop').onclick=()=>{navigator.clipboard.writeText(shopText()).then(()=>toast('购物清单已复制')).catch(()=>toast('复制失败'));};
document.getElementById('print-shop').onclick=()=>{const w=window.open('','_blank');w.document.write('<pre style="font-family:sans-serif;font-size:15px;line-height:1.8;padding:20px;">'+esc(shopText())+'</pre>');w.document.close();w.print();};

/* ============ 导入 / 导出 / 重置 ============ */
document.getElementById('export-btn').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='居家清单备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('已导出备份文件');
};
document.getElementById('import-btn').onclick=()=>document.getElementById('import-file').click();
document.getElementById('import-file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){data=d.some(c=>c.groups)?d:normalize(d.map(c=>({emoji:c.emoji,name:c.name,groups:[{name:'其他',items:c.items||[]}]})));save();render();toast('导入成功');}else toast('文件格式不对');}catch(err){toast('文件解析失败');}};
  r.readAsText(f);
};
document.getElementById('reset-btn').onclick=()=>{if(confirm('恢复默认清单会覆盖当前所有记录，确定吗？（建议先导出备份）')){data=normalize(DEFAULT_DATA);save();render();toast('已恢复默认清单');}};

/* ============ Toast ============ */
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

render();
</script>
</body>
</html>
