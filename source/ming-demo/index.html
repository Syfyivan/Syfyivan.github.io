<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="明代江南普通人的文字人生模拟：从五路立身走到成家、当户、养老、死亡传承与下一代重开。">
<meta name="theme-color" content="#241a12">
<title>明·江南一生 · 文字原型</title>
<style>
  @font-face{ font-family:'Pixel'; src:url('./assets/fonts/PixelifySans-Medium.ttf') format('truetype'); font-weight:400 700; }
  @font-face{ font-family:'Mono'; src:url('./assets/fonts/DMMono-Regular.ttf') format('truetype'); font-weight:400; }
  :root{
    --bg:#241a12; --bg2:#2f2417; --bg3:#3a2c1c; --ink:#f2e7d5; --muted:#a9967c;
    --rule:#4a3a2a; --accent:#e0a44e; --accent2:#8bbf6a; --danger:#c96a6a; --info:#5fb0c9;
    --font:'Pixel','PingFang SC','Noto Sans CJK SC',sans-serif;
    --mono:'Mono','PingFang SC',monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); color:var(--ink); line-height:1.7;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(224,164,78,0.08), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(139,191,106,0.06), transparent 60%),
      var(--bg);
  }
  .wrap{ max-width:1080px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 14px; }
  /* 吸顶：标题栏 + 状态栏滚动时固定 */
  .topbar{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--rule); box-shadow:0 4px 12px rgba(0,0,0,.35); }
  header{ padding:.8rem 0 .6rem; display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
  header h1{ font-size:1.3rem; color:var(--accent); letter-spacing:.04em; }
  header .sub{ font-family:var(--mono); font-size:.72rem; color:var(--muted); }
  header .spacer{ flex:1; }
  header button{ font-family:var(--font); cursor:pointer; color:var(--ink); background:var(--bg3); border:1px solid var(--rule); border-radius:6px; padding:.25rem .7rem; font-size:.78rem; }
  header button:hover{ border-color:var(--accent); color:var(--accent); }
  button:focus-visible,summary:focus-visible{ outline:2px solid var(--info); outline-offset:2px; }

  /* 状态栏 */
  .status{ display:flex; gap:.5rem; flex-wrap:wrap; padding:.6rem 0; }
  .chip{ font-family:var(--mono); font-size:.76rem; background:var(--bg2); border:1px solid var(--rule); border-radius:6px; padding:.2rem .55rem; }
  .chip b{ color:var(--accent); }
  .chip.hp b{ color:var(--accent2); }
  .chip.coin b{ color:var(--info); }
  .chip.debt{ border-color:var(--danger); }
  .chip.debt b{ color:var(--danger); }
  .chip.crop{ display:inline-flex; align-items:center; gap:.35rem; }
  .g-dot{ width:.55rem; height:.55rem; border-radius:50%; display:inline-block; background:var(--muted); }
  .g-dot.g-none{ background:var(--muted); }
  .g-dot.g-bad{ background:var(--danger); }
  .g-dot.g-thin{ background:var(--accent); }
  .g-dot.g-ok{ background:var(--accent2); }
  .g-dot.g-good{ background:var(--accent2); box-shadow:0 0 6px var(--accent2); }

  /* 庄稼长势条 */
  .crop-bar{ background:var(--bg3); border:1px solid var(--rule); border-left:3px solid var(--accent2); border-radius:0 8px 8px 0; padding:.5rem .7rem; margin-bottom:.7rem; }
  .crop-bar.g-none{ border-left-color:var(--muted); }
  .crop-bar.g-bad{ border-left-color:var(--danger); }
  .crop-bar.g-thin{ border-left-color:var(--accent); }
  .crop-bar.g-ok,.crop-bar.g-good{ border-left-color:var(--accent2); }
  .cb-head{ display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; flex-wrap:wrap; }
  .cb-title{ font-size:.84rem; color:var(--ink); }
  .cb-val{ font-family:var(--mono); font-size:.78rem; color:var(--accent2); }
  .crop-bar.g-none .cb-val{ color:var(--muted); }
  .crop-bar.g-bad .cb-val{ color:var(--danger); }
  .crop-bar.g-thin .cb-val{ color:var(--accent); }
  .cb-track{ height:8px; background:var(--bg); border-radius:5px; margin:.4rem 0 .35rem; overflow:hidden; border:1px solid var(--rule); }
  .cb-track i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .3s; }
  .crop-bar.g-bad .cb-track i{ background:var(--danger); }
  .cb-tip{ font-size:.72rem; color:var(--muted); }

  .main{ display:grid; grid-template-columns:1fr 320px; gap:16px; padding:.4rem 0 2rem; flex:1; }
  @media(max-width:820px){
    .main{ grid-template-columns:1fr; }
    .topbar{ margin:0 -14px; padding:0 14px; }
    .status{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin; padding-bottom:.7rem; }
    .chip{ flex:0 0 auto; }
    aside{ position:static; max-height:none; }
  }

  /* 叙事区 */
  .stage{ background:var(--bg2); border:1px solid var(--rule); border-radius:10px; padding:1rem 1.1rem; }
  .season-line{ font-family:var(--mono); font-size:.78rem; color:var(--accent); margin-bottom:.5rem; }
  .narr{ font-size:.95rem; margin-bottom:.7rem; }
  .narr .em{ color:var(--accent); }
  .events{ display:flex; flex-direction:column; gap:.5rem; margin:.6rem 0; }
  .evt{ border-left:3px solid var(--rule); padding:.35rem .6rem; background:var(--bg3); border-radius:0 6px 6px 0; font-size:.86rem; }
  .evt.nong{ border-left-color:var(--accent2); }
  .evt.rel{ border-left-color:var(--danger); }
  .evt.rand{ border-left-color:var(--info); }
  .evt .tag{ font-family:var(--mono); font-size:.7rem; color:var(--muted); margin-right:.4rem; }

  /* 行动点 */
  .ap-head{ display:flex; align-items:center; gap:.5rem; margin:.9rem 0 .5rem; border-top:1px dashed var(--rule); padding-top:.8rem; }
  .ap-head h3{ font-size:.95rem; color:var(--accent); }
  .ap-dots{ font-family:var(--mono); font-size:.8rem; color:var(--muted); }
  .ap-dots b{ color:var(--accent); font-size:1rem; }
  .actions{ display:flex; flex-direction:column; gap:.5rem; }
  .act{ text-align:left; font-family:var(--font); cursor:pointer; color:var(--ink); background:var(--bg3); border:1px solid var(--rule); border-radius:8px; padding:.5rem .7rem; transition:.12s; display:flex; flex-direction:column; gap:.15rem; }
  .act:hover:not(:disabled){ border-color:var(--accent); transform:translateX(2px); }
  .act:disabled{ opacity:.4; cursor:not-allowed; }
  .act .a-top{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
  .act .a-name{ font-size:.9rem; }
  .act .a-cost{ font-family:var(--mono); font-size:.72rem; color:var(--accent); }
  .act .a-eff{ font-family:var(--mono); font-size:.72rem; color:var(--accent2); }
  .act .a-desc{ font-size:.76rem; color:var(--muted); }
  .act .a-picked{ font-family:var(--mono); font-size:.72rem; color:var(--accent2); }

  .commit{ margin-top:.9rem; display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .commit button{ font-family:var(--font); cursor:pointer; font-size:.9rem; padding:.5rem 1.1rem; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#241a12; font-weight:700; }
  .commit button:disabled{ opacity:.4; cursor:not-allowed; background:var(--bg3); color:var(--muted); border-color:var(--rule); }
  .commit .hint{ font-size:.76rem; color:var(--muted); }

  /* 结算面板 */
  .resolve{ background:var(--bg3); border:1px solid var(--accent); border-radius:8px; padding:.7rem .8rem; margin-top:.8rem; font-size:.86rem; }
  .resolve h4{ color:var(--accent); font-size:.86rem; margin-bottom:.4rem; }
  .resolve .line{ font-family:var(--mono); font-size:.78rem; margin:.15rem 0; }
  .resolve .good{ color:var(--accent2); }
  .resolve .bad{ color:var(--danger); }

  /* 人生阶段决策卡 */
  .season-line.phase{ color:var(--accent); font-size:.82rem; border-left:3px solid var(--accent); padding-left:.5rem; }
  .phase-note{ font-size:.74rem; color:var(--muted); background:var(--bg3); border:1px dashed var(--rule); border-radius:6px; padding:.4rem .6rem; margin:.4rem 0 .7rem; }
  .choices{ display:flex; flex-direction:column; gap:.6rem; }
  .choice{ text-align:left; font-family:var(--font); cursor:pointer; color:var(--ink); background:var(--bg3); border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:.6rem .8rem; transition:.12s; display:flex; flex-direction:column; gap:.2rem; }
  .choice:hover:not(:disabled){ border-color:var(--accent); transform:translateX(2px); box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .choice:disabled{ opacity:.4; cursor:not-allowed; border-left-color:var(--rule); }
  .choice .ch-name{ font-size:.92rem; color:var(--accent); }
  .choice .ch-line{ font-family:var(--mono); font-size:.74rem; }
  .choice .ch-cost{ color:var(--danger); }
  .choice .ch-gain{ color:var(--accent2); }
  .choice .ch-prob{ color:var(--info); }
  .choice .ch-desc{ font-family:var(--font); font-size:.76rem; color:var(--muted); }

  /* 父快照是立身前置条件，不沿用浏览器默认按钮样式。 */
  .switch-choice{ text-align:left; font-family:var(--font); cursor:pointer; color:var(--ink); background:var(--bg3); border:1px solid var(--rule); border-left:3px solid var(--info); border-radius:0 8px 8px 0; padding:.6rem .8rem; transition:.12s; display:flex; flex-direction:column; gap:.2rem; }
  .switch-choice:hover:not(:disabled){ border-color:var(--info); transform:translateX(2px); }
  .switch-choice:disabled{ cursor:default; opacity:1; background:rgba(95,176,201,.1); border-color:var(--info); }
  .switch-choice .ch-name{ font-size:.92rem; color:var(--info); }
  .switch-choice .ch-line{ font-size:.76rem; color:var(--muted); }

  /* 设计与验收信息保留可查，但不再压住玩家的第一步选择。 */
  .design-notes{ margin:.7rem 0; border:1px solid var(--rule); border-radius:8px; background:rgba(36,26,18,.45); }
  .design-notes summary{ cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:baseline; gap:.7rem; padding:.55rem .7rem; color:var(--accent); }
  .design-notes summary::-webkit-details-marker{ display:none; }
  .design-notes summary::before{ content:'＋'; font-family:var(--mono); color:var(--info); }
  .design-notes[open] summary::before{ content:'－'; }
  .design-notes summary span{ flex:1; font-size:.86rem; }
  .design-notes summary small{ color:var(--muted); font-size:.68rem; }
  .design-notes-body{ padding:0 .65rem .05rem; }
  @media(max-width:520px){
    header{ align-items:flex-start; }
    header .sub{ flex-basis:100%; order:3; }
    header button{ min-height:34px; }
    .stage{ padding:.85rem .8rem; }
    .design-notes summary small{ display:none; }
  }

  /* 侧栏流水账 */
  aside{ background:var(--bg2); border:1px solid var(--rule); border-radius:10px; padding:.8rem; align-self:start; position:sticky; top:118px; max-height:calc(100vh - 130px); overflow:auto; }
  aside .lg-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.5rem; }
  aside .lg-head span:first-child{ color:var(--accent); font-size:.9rem; }
  aside .lg-sum{ font-family:var(--mono); font-size:.72rem; color:var(--muted); }
  .lg-item{ border-left:3px solid var(--rule); padding:.3rem .5rem; margin-bottom:.4rem; background:var(--bg3); border-radius:0 6px 6px 0; }
  .lg-top{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:.68rem; color:var(--muted); }
  .lg-name{ font-size:.8rem; color:var(--ink); }
  .lg-d{ font-family:var(--mono); font-size:.72rem; }
  .lg-up{ color:var(--accent2); margin-right:.4rem; }
  .lg-down{ color:var(--danger); margin-right:.4rem; }
  .lg-flat{ color:var(--muted); }

  .end{ text-align:center; padding:1.2rem; }
  .end h2{ color:var(--accent); margin-bottom:.6rem; }
  .end .stat{ font-family:var(--mono); font-size:.82rem; color:var(--ink); margin:.2rem 0; }
  footer{ text-align:center; font-family:var(--mono); font-size:.7rem; color:var(--muted); padding:.8rem 0; border-top:1px solid var(--rule); }
  .credi{ font-family:var(--mono); font-size:.68rem; color:var(--muted); }
</style>
</head>
<body>
<noscript>这个文字 Demo 需要启用 JavaScript 才能记账与推进人生。</noscript>
<div class="wrap">
  <div class="topbar">
    <header>
      <h1>明·江南一生</h1>
      <span class="sub">文字原型 · 从同一户出发，走完一生，让账与选择传给下一代</span>
      <span class="spacer"></span>
      <button id="btn-restart">重开（16岁起）</button>
      <button id="btn-restart-birth">从出生跑起</button>
    </header>

    <div class="status" id="status"></div>
  </div>

  <div class="main">
    <section class="stage" id="stage"></section>
    <aside id="ledger"></aside>
  </div>

  <footer>每年以“四季 × 上中下三个代表旬位”压缩呈现 &nbsp;|&nbsp; 数值为玩法占位，非史实精确值 <span class="credi">[需核原书]</span></footer>
</div>

<script src="assets/game.js"></script>
</body>
</html>
