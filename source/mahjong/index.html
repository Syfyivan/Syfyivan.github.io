<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>麻将局</title>
    <meta name="description" content="可和朋友联机的麻将网页桌。" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="mahjong-app">
      <section class="table-shell" aria-label="麻将局">
        <header class="table-header">
          <a class="brand" href="./" aria-label="麻将局首页">
            <span class="brand-mark" aria-hidden="true">麻</span>
            <span>麻将局</span>
          </a>
          <div class="status-strip" aria-live="polite">
            <span class="status-pill" id="connectionStatus">未连接</span>
            <span class="status-pill" id="roomStatus">房间 --</span>
            <span class="status-pill" id="wallStatus">牌山 --</span>
          </div>
        </header>

        <section class="lobby-panel" id="lobbyPanel" aria-label="房间">
          <form class="join-form" id="joinForm">
            <label>
              <span>名字</span>
              <input id="nameInput" name="name" type="text" maxlength="16" autocomplete="nickname" required />
            </label>
            <label>
              <span>房号</span>
              <input id="roomInput" name="room" type="text" maxlength="8" autocapitalize="characters" required />
            </label>
            <fieldset class="segmented-field">
              <legend>玩法</legend>
              <div class="segmented-control" role="radiogroup" aria-label="玩法">
                <label>
                  <input type="radio" name="variant" value="sichuan" checked />
                  <span>川麻</span>
                </label>
                <label>
                  <input type="radio" name="variant" value="dongbei" />
                  <span>东北</span>
                </label>
              </div>
            </fieldset>
            <fieldset class="segmented-field">
              <legend>人数</legend>
              <div class="segmented-control" role="radiogroup" aria-label="人数">
                <label>
                  <input type="radio" name="seatCount" value="3" checked />
                  <span>三人局</span>
                </label>
                <label>
                  <input type="radio" name="seatCount" value="4" />
                  <span>四人局</span>
                </label>
              </div>
            </fieldset>
            <label>
              <span>服务器</span>
              <input id="serverInput" name="server" type="text" inputmode="url" autocomplete="off" required />
            </label>
            <div class="form-actions">
              <button class="primary-button" type="submit">创建/加入</button>
              <button class="ghost-button" type="button" id="randomRoomButton">新房号</button>
            </div>
          </form>
          <div class="invite-panel" aria-label="邀请码">
            <label>
              <span>邀请码</span>
              <input id="inviteInput" type="text" autocomplete="off" placeholder="粘贴房主发来的 MJ1 邀请码" />
            </label>
            <button class="ghost-button" type="button" id="applyInviteButton">使用邀请码</button>
          </div>
          <div class="lobby-note" id="lobbyNote">房主先生成房号</div>
        </section>

        <section class="game-layout" id="gamePanel" aria-label="牌桌" hidden>
          <aside class="side-panel" aria-label="房间状态">
            <div class="room-card">
              <div>
                <span class="meta-label">房间</span>
                <strong id="activeRoomLabel">--</strong>
                <span class="room-mode" id="roomConfigLabel">--</span>
              </div>
              <button class="icon-action" type="button" id="copyRoomButton" aria-label="复制房间信息">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M8 8h10v10H8z" />
                  <path d="M6 14H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" />
                </svg>
              </button>
            </div>
            <div class="player-list" id="playerList"></div>
            <div class="room-actions">
              <button class="ghost-button" type="button" id="readyButton">准备</button>
              <button class="ghost-button" type="button" id="addBotButton">补人机</button>
              <button class="primary-button" type="button" id="startButton" disabled>开局</button>
              <button class="ghost-button" type="button" id="newRoundButton" hidden>再来</button>
            </div>
            <section class="rules-panel" aria-label="规则">
              <div class="rules-title" id="rulesTitle">规则</div>
              <ul id="rulesList"></ul>
            </section>
            <div class="event-log" id="eventLog" aria-live="polite"></div>
          </aside>

          <section class="mahjong-table" aria-label="麻将桌">
            <div class="seat seat-top" id="seatTop"></div>
            <div class="seat seat-left" id="seatLeft"></div>
            <div class="seat seat-right" id="seatRight"></div>

            <div class="center-board">
              <div class="round-chip" id="roundLabel">第 0 局</div>
              <div class="dice-tray" id="diceTray" hidden></div>
              <div class="bao-tray" id="baoTray" hidden></div>
              <div class="turn-label" id="turnLabel">等待入座</div>
              <div class="last-discard" id="lastDiscard"></div>
            </div>

            <div class="discard-river-board" id="discardRiver" aria-label="出过的牌"></div>

            <div class="claim-bar" id="claimBar" hidden></div>

            <section class="self-area" aria-label="我的手牌">
              <div class="meld-row" id="selfMelds"></div>
              <div class="hand-row" id="handRow"></div>
              <div class="action-row" id="actionRow"></div>
            </section>
          </section>
        </section>
      </section>
      <div class="end-modal" id="endModal" role="dialog" aria-modal="true" aria-labelledby="endTitle" hidden>
        <div class="end-card">
          <div class="end-kicker">本局结束</div>
          <h2 id="endTitle">结算</h2>
          <p id="endResult">--</p>
          <div class="end-actions">
            <button class="primary-button" type="button" id="modalNewRoundButton">再来</button>
            <button class="ghost-button" type="button" id="modalExitButton">退出</button>
          </div>
        </div>
      </div>
    </main>
    <script src="./client.js"></script>
  </body>
</html>
