<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共享画室</title>
    <meta name="description" content="多人协作画家工会原型，可以在博客上直接游玩。" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="studio-app" aria-label="共享画室">
      <header class="studio-header">
        <a class="brand" href="./" aria-label="共享画室">
          <span class="brand-mark" aria-hidden="true">画</span>
          <span>共享画室</span>
        </a>
        <div class="hud" aria-live="polite">
          <span><b id="dayLabel">第 1 天</b></span>
          <span>金币 <b id="coinLabel">120</b></span>
          <span>颜料 <b id="paintLabel">42</b></span>
          <span>声望 <b id="prestigeLabel">8</b></span>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="pauseButton" type="button" aria-label="暂停" title="暂停">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 5v14M16 5v14" />
            </svg>
          </button>
          <button class="icon-button" id="speedButton" type="button" aria-label="切换速度" title="切换速度">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 12h9M13 6l6 6-6 6" />
            </svg>
          </button>
          <button class="icon-button" id="resetButton" type="button" aria-label="重新开始" title="重新开始">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
          </button>
        </div>
      </header>

      <section class="connection-panel" aria-label="联机房间">
        <form class="connection-form" id="connectionForm">
          <label>
            <span>名字</span>
            <input id="playerNameInput" name="playerName" maxlength="16" autocomplete="nickname" />
          </label>
          <label>
            <span>房间</span>
            <input id="roomIdInput" name="roomId" maxlength="16" autocomplete="off" />
          </label>
          <label class="server-field">
            <span>服务器</span>
            <input id="serverUrlInput" name="serverUrl" placeholder="ws://localhost:8788/guild-ws" autocomplete="url" />
          </label>
          <button class="small-button" id="connectButton" type="submit">联机</button>
          <button class="small-button" id="disconnectButton" type="button" disabled>断开</button>
        </form>
        <div class="connection-status" id="connectionStatus">本地试玩</div>
      </section>

      <section class="game-layout">
        <aside class="panel painter-panel" aria-label="画家">
          <div class="panel-heading">
            <h2>画家</h2>
            <span id="selectedPainterLabel">青岚</span>
          </div>
          <div class="painter-list" id="painterList"></div>
          <div class="action-dock" aria-label="行动">
            <button type="button" data-mode="fast">快画</button>
            <button type="button" data-mode="steady">稳画</button>
            <button type="button" data-mode="detail">精修</button>
            <button type="button" data-action="idle">停手</button>
          </div>
        </aside>

        <section class="studio-stage" aria-label="画室">
          <div class="studio-topline">
            <div>
              <span class="kicker">Guild Room</span>
              <h1>多人协作画室</h1>
            </div>
            <div class="trend-pill" id="trendLabel">今日流行：肖像</div>
          </div>

          <div class="room-grid" id="roomGrid" aria-label="家具和画家"></div>

          <section class="gallery-strip" aria-label="小镇作品">
            <div class="gallery-title">
              <span>小镇作品</span>
              <b id="artCountLabel">0</b>
            </div>
            <div class="artwork-track" id="artworkTrack"></div>
          </section>
        </section>

        <aside class="panel order-panel" aria-label="订单">
          <div class="panel-heading">
            <h2>订单</h2>
            <button class="small-button" id="newOrderButton" type="button">新订单</button>
          </div>
          <div class="order-list" id="orderList"></div>

          <div class="panel-heading shop-heading">
            <h2>工坊</h2>
          </div>
          <div class="shop-list" id="shopList"></div>
          <div class="event-log" id="eventLog" aria-live="polite"></div>
        </aside>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
