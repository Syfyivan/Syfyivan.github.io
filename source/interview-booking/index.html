---
layout: false
---
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>面试预约表</title>
    <meta
      name="description"
      content="一个可编辑的面试预约表：按日期列、时间行展示5-7天"
    />
    <style>
      :root {
        --bg: radial-gradient(1200px 500px at 10% -20%, #f9d29d 0%, transparent 40%),
          radial-gradient(900px 420px at 90% 0%, #b2d9ff 0%, transparent 45%),
          linear-gradient(135deg, #1f2933, #111827);
        --card: #ffffffcc;
        --ink: #14213d;
        --line: #d6deef;
        --muted: #64748b;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Trebuchet MS", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        background: var(--bg);
        padding: clamp(1rem, 2vw, 2rem);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
      }

      .hero {
        animation: rise 500ms ease;
        padding: 1.6rem;
        border-radius: 20px;
        background: var(--card);
        backdrop-filter: blur(8px);
        border: 1px solid #e5e7eb;
        box-shadow: 0 20px 50px #00000022;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: clamp(1.5rem, 2.3vw, 2rem);
        letter-spacing: 0.02em;
        color: #0f172a;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .toolbar {
        margin-top: 1rem;
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar button,
      .toolbar .meta {
        border-radius: 999px;
        border: 1px solid #d1d5db;
        padding: 0.58rem 1.1rem;
        background: #fff;
        cursor: pointer;
      }

      .toolbar button {
        font-weight: 600;
        transition:
          transform 160ms ease,
          background-color 160ms ease,
          color 160ms ease;
      }

      .toolbar button:hover {
        transform: translateY(-1px);
        background: #f1f5ff;
      }

      .toolbar button.active {
        color: #fff;
        border-color: var(--accent);
        background: var(--accent);
      }

      .toolbar .meta {
        color: #334155;
        border-style: dashed;
        border-color: #cbd5e1;
      }

      .table-wrap {
        margin-top: 1rem;
        overflow: auto;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        background: #fff;
        animation: fadeIn 600ms ease;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }

      th,
      td {
        border: 1px solid var(--line);
        min-width: 110px;
      }

      th {
        background: #f8fafc;
        color: #0f172a;
        position: sticky;
        top: 0;
        z-index: 2;
      }

      thead th:first-child {
        left: 0;
        z-index: 3;
      }

      .time-col {
        width: 95px;
        background: #f1f5f9;
        font-weight: 600;
        text-align: center;
      }

      .date-col {
        text-align: center;
        padding: 0.6rem;
        min-width: 140px;
      }

      .date-short,
      .corner-short {
        display: none;
      }

      .weekday {
        font-size: 0.82rem;
        color: #64748b;
      }

      .slot-cell {
        position: relative;
        background: #f8fafc;
        vertical-align: top;
        height: 86px;
        padding: 0.45rem;
        cursor: pointer;
        transition: background-color 140ms ease;
      }

      .slot-cell[data-filled="true"] {
        font-weight: 600;
      }

      .slot-text {
        min-height: 62px;
        border-radius: 10px;
        border: 1px dashed #cbd5e1;
        background: rgba(255, 255, 255, 0.72);
        padding: 0.45rem 1.85rem 0.45rem 0.55rem;
        line-height: 1.35;
        outline: none;
        white-space: pre-wrap;
        pointer-events: none;
      }

      .slot-text:focus {
        border-style: solid;
        border-color: #94a3b8;
      }

      .slot-color {
        position: absolute;
        right: 0.45rem;
        top: 0.45rem;
        height: 22px;
        width: 22px;
        border: none;
        padding: 0;
        background: transparent;
        border-radius: 6px;
        pointer-events: none;
      }

      .slot-color::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .slot-color::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
      }

      .actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }

      .actions button {
        border: 1px solid #1d4ed8;
        background: #1d4ed8;
        color: #fff;
        border-radius: 10px;
        padding: 0.55rem 1rem;
        cursor: pointer;
      }

      .actions button.secondary {
        background: #fff;
        color: #334155;
        border-color: #cbd5e1;
      }

      .slot-editor {
        width: min(calc(100% - 1rem), 460px);
        margin: auto auto 0.5rem;
        padding: 1rem;
        color: var(--ink);
        background: #fff;
        border: 0;
        border-radius: 18px;
        box-shadow: 0 24px 70px #0f172a55;
      }

      .slot-editor::backdrop {
        background: #0f172a80;
        backdrop-filter: blur(3px);
      }

      .slot-editor h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .editor-slot-label {
        margin: 0.25rem 0 0.8rem;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .editor-field-label {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .editor-text {
        display: block;
        width: 100%;
        min-height: 96px;
        resize: vertical;
        padding: 0.7rem;
        color: var(--ink);
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
        font-size: 16px;
        line-height: 1.4;
        outline: none;
      }

      .editor-text:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px #2563eb1a;
      }

      .editor-color-row {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) minmax(0, 1fr);
        gap: 0.55rem;
        align-items: center;
        margin-top: 0.8rem;
      }

      .editor-color-row .editor-field-label {
        grid-column: 1 / -1;
        margin-bottom: 0;
      }

      .editor-color {
        width: 48px;
        height: 42px;
        padding: 2px;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
      }

      .color-action {
        min-height: 42px;
        min-width: 0;
        padding: 0 0.35rem;
        color: #334155;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
      }

      .save-color {
        color: #fff;
        border-color: var(--accent);
        background: var(--accent);
      }

      .saved-colors-panel {
        margin-top: 0.7rem;
      }

      .saved-colors-head {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.4rem;
        color: #475569;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .saved-colors {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.45rem;
      }

      .saved-color-item {
        position: relative;
        min-width: 0;
      }

      .saved-color-use {
        width: 100%;
        height: 42px;
        padding: 0;
        border: 2px solid #fff;
        border-radius: 10px;
        box-shadow: 0 0 0 1px #cbd5e1;
        cursor: pointer;
      }

      .saved-color-remove {
        position: absolute;
        right: -5px;
        top: -6px;
        width: 21px;
        height: 21px;
        padding: 0;
        color: #475569;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        font-size: 0.8rem;
        line-height: 1;
        cursor: pointer;
      }

      .saved-colors-empty {
        grid-column: 1 / -1;
        margin: 0;
        padding: 0.65rem;
        color: #94a3b8;
        background: #f8fafc;
        border-radius: 9px;
        font-size: 0.72rem;
        text-align: center;
      }

      .editor-duration {
        margin: 0.9rem 0 0;
        padding: 0;
        border: 0;
      }

      .editor-duration legend {
        margin-bottom: 0.4rem;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .duration-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      .duration-choice input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .duration-choice span {
        display: grid;
        min-height: 44px;
        place-items: center;
        padding: 0.45rem;
        color: #334155;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
        cursor: pointer;
      }

      .duration-choice input:checked + span {
        color: #fff;
        border-color: var(--accent);
        background: var(--accent);
      }

      .duration-choice input:disabled + span {
        color: #94a3b8;
        background: #f1f5f9;
        cursor: not-allowed;
      }

      .duration-hint {
        min-height: 1.2em;
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.4;
      }

      .slot-cell[data-span="2"] .slot-text {
        display: flex;
        min-height: 148px;
        align-items: center;
      }

      .slot-cell[data-span="2"]::after {
        content: "2h";
        position: absolute;
        right: 0.45rem;
        bottom: 0.45rem;
        padding: 0.12rem 0.3rem;
        color: #475569;
        background: #ffffffcc;
        border-radius: 999px;
        font-size: 0.62rem;
        font-weight: 700;
      }

      .editor-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
        margin-top: 1rem;
      }

      .editor-actions button {
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #fff;
        color: #334155;
        font-weight: 700;
      }

      .editor-actions .primary {
        color: #fff;
        border-color: var(--accent);
        background: var(--accent);
      }

      @media (max-width: 768px) {
        body {
          padding: 0.45rem;
        }

        .hero {
          padding: 0.7rem;
          border-radius: 14px;
        }

        h1 {
          font-size: 1.25rem;
        }

        .hint {
          font-size: 0.78rem;
          line-height: 1.45;
        }

        .toolbar {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 0.4rem;
          margin-top: 0.7rem;
        }

        .toolbar button,
        .toolbar .meta {
          min-width: 0;
          padding: 0.45rem 0.2rem;
          font-size: 0.72rem;
          text-align: center;
        }

        .toolbar .meta {
          grid-column: 1 / -1;
        }

        .actions {
          gap: 0.4rem;
          margin-top: 0.65rem;
        }

        .actions button {
          flex: 1;
          min-width: 0;
          padding: 0.48rem 0.3rem;
          font-size: 0.75rem;
        }

        .table-wrap {
          margin-top: 0.65rem;
          overflow-x: hidden;
          border-radius: 10px;
        }

        table {
          width: 100%;
          min-width: 0;
          table-layout: fixed;
        }

        th,
        td {
          min-width: 0;
        }

        .time-col {
          width: 42px;
          font-size: 0.62rem;
          line-height: 1.15;
        }

        .date-col {
          min-width: 0;
          padding: 0.3rem 0.05rem;
          font-size: 0.66rem;
          line-height: 1.2;
        }

        .date-full,
        .corner-long {
          display: none;
        }

        .date-short,
        .corner-short {
          display: block;
        }

        .weekday {
          margin-top: 0.12rem;
          font-size: 0.58rem;
        }

        .slot-cell {
          min-width: 0;
          height: 68px;
          padding: 2px;
          cursor: pointer;
        }

        .slot-text {
          min-height: 62px;
          padding: 0.25rem 0.12rem;
          border-radius: 5px;
          font-size: 0.65rem;
          line-height: 1.2;
          overflow-wrap: anywhere;
          pointer-events: none;
        }

        .slot-color {
          right: 3px;
          top: 3px;
          width: 14px;
          height: 14px;
          border-radius: 4px;
          opacity: 0.88;
          pointer-events: none;
        }

        .slot-cell[data-span="2"] .slot-text {
          min-height: 130px;
        }

        .slot-cell[data-span="2"]::after {
          right: 3px;
          bottom: 3px;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0.5;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1>面试预约表（可编辑）</h1>
        <p class="hint">
          点任意格子填写预约内容并自定义颜色；选择 2 小时会自动合并下一时段。页面会自动保存到
          浏览器本地（当前电脑 + 当前浏览器）。
        </p>

        <div class="toolbar">
          <button type="button" class="range-btn" data-range="5">显示 5 天</button>
          <button type="button" class="range-btn" data-range="6">显示 6 天</button>
          <button type="button" class="range-btn active" data-range="7">显示 7 天</button>
          <span id="rangeLabel" class="meta">当前范围：7 天</span>
        </div>

        <div class="actions">
          <button id="jumpToday" type="button">定位到今天</button>
          <button id="clearAll" class="secondary" type="button">清空当前范围</button>
        </div>

        <div class="table-wrap">
          <table id="bookingTable">
            <thead>
              <tr id="tableHead">
                <th class="time-col">
                  <span class="corner-long">时间 / 日期</span><span class="corner-short">时间</span>
                </th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="slotEditor" class="slot-editor" aria-labelledby="editorTitle">
      <form method="dialog">
        <h2 id="editorTitle">编辑面试预约</h2>
        <p id="editorSlotLabel" class="editor-slot-label"></p>
        <label class="editor-field-label" for="editorText">预约内容</label>
        <textarea
          id="editorText"
          class="editor-text"
          rows="4"
          maxlength="160"
          placeholder="候选人 / 电话 / 备注"
        ></textarea>
        <div class="editor-color-row">
          <label class="editor-field-label" for="editorColor">标记颜色</label>
          <input id="editorColor" class="editor-color" type="color" value="#f8fafc" />
          <button id="saveColor" class="color-action save-color" type="button">保存颜色</button>
          <button id="resetColor" class="color-action" type="button">恢复默认</button>
        </div>
        <div class="saved-colors-panel">
          <div class="saved-colors-head">
            <span>已保存颜色</span><span id="savedColorsCount">0 / 8</span>
          </div>
          <div id="savedColors" class="saved-colors"></div>
        </div>
        <fieldset class="editor-duration">
          <legend>预约时长</legend>
          <div class="duration-options">
            <label class="duration-choice">
              <input id="durationOne" type="radio" name="duration" value="1" checked />
              <span>1 小时</span>
            </label>
            <label class="duration-choice">
              <input id="durationTwo" type="radio" name="duration" value="2" />
              <span>2 小时（合并下一格）</span>
            </label>
          </div>
          <p id="durationHint" class="duration-hint"></p>
        </fieldset>
        <div class="editor-actions">
          <button type="submit" value="cancel">取消</button>
          <button id="saveEditor" class="primary" type="button">保存</button>
        </div>
      </form>
    </dialog>

    <script>
      (() => {
        const STORAGE_KEY = "interview_booking_slots_v1";
        const PALETTE_STORAGE_KEY = "interview_booking_saved_colors_v1";
        const MAX_SAVED_COLORS = 8;
        const tableHead = document.getElementById("tableHead");
        const tableBody = document.getElementById("tableBody");
        const rangeLabel = document.getElementById("rangeLabel");
        const rangeButtons = Array.from(document.querySelectorAll(".range-btn"));
        const jumpTodayBtn = document.getElementById("jumpToday");
        const clearBtn = document.getElementById("clearAll");
        const slotEditor = document.getElementById("slotEditor");
        const editorSlotLabel = document.getElementById("editorSlotLabel");
        const editorText = document.getElementById("editorText");
        const editorColor = document.getElementById("editorColor");
        const saveColorBtn = document.getElementById("saveColor");
        const resetColorBtn = document.getElementById("resetColor");
        const savedColorsEl = document.getElementById("savedColors");
        const savedColorsCount = document.getElementById("savedColorsCount");
        const durationOne = document.getElementById("durationOne");
        const durationTwo = document.getElementById("durationTwo");
        const durationHint = document.getElementById("durationHint");
        const saveEditorBtn = document.getElementById("saveEditor");

        const timeSlots = [
          "09:00",
          "10:00",
          "11:00",
          "14:00",
          "15:00",
          "16:00",
          "17:00",
          "19:00",
          "20:00",
          "21:00"
        ];
        const defaultColor = "#f8fafc";

        let state = loadState();
        let savedColors = loadSavedColors();
        let dayCount = 7;
        let startDate = new Date();
        let mobileEditTarget = null;

        resetColorBtn.addEventListener("click", () => {
          editorColor.value = defaultColor;
        });

        saveColorBtn.addEventListener("click", () => {
          const color = editorColor.value.toLowerCase();
          savedColors = [color, ...savedColors.filter((item) => item !== color)].slice(
            0,
            MAX_SAVED_COLORS
          );
          persistSavedColors();
          renderSavedColors();
        });

        durationOne.addEventListener("change", updateEditorSlotLabel);
        durationTwo.addEventListener("change", updateEditorSlotLabel);

        saveEditorBtn.addEventListener("click", () => {
          if (!mobileEditTarget) return;
          const value = editorText.value;
          const color = editorColor.value;
          const span = durationTwo.checked ? 2 : 1;
          if (span === 2 && mobileEditTarget.nextCellId) {
            delete state[mobileEditTarget.nextCellId];
          }
          saveCell(mobileEditTarget.cellId, value, color, span);
          slotEditor.close();
          render();
        });

        slotEditor.addEventListener("close", () => {
          mobileEditTarget = null;
        });

        rangeButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            dayCount = Number(btn.dataset.range);
            updateRangeButtons();
            render();
          });
        });

        jumpTodayBtn.addEventListener("click", () => {
          startDate = startOfToday();
          render();
        });

        clearBtn.addEventListener("click", () => {
          const keys = Object.keys(state);
          const targets = getVisibleCellIds();
          if (!targets.length) return;
          targets.forEach((id) => delete state[id]);
          persist();
          render();
        });

        function startOfToday() {
          const now = new Date();
          now.setHours(0, 0, 0, 0);
          return now;
        }

        function fmtDate(date) {
          return `${date.getMonth() + 1}月${date.getDate()}日`;
        }

        function toISODate(date) {
          const year = date.getFullYear();
          const month = `${date.getMonth() + 1}`.padStart(2, "0");
          const day = `${date.getDate()}`.padStart(2, "0");
          return `${year}-${month}-${day}`;
        }

        function toCNWeekday(date) {
          return ["日", "一", "二", "三", "四", "五", "六"][date.getDay()];
        }

        function saveCell(cellId, text, color, span = 1) {
          state[cellId] = { text, color, span };
          persist();
        }

        function getVisibleCellIds() {
          const ids = [];
          for (let d = 0; d < dayCount; d++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + d);
            const dateKey = toISODate(date);
            for (const slot of timeSlots) {
              ids.push(`${dateKey}|${slot}`);
            }
          }
          return ids;
        }

        function keyFor(date, time) {
          return `${toISODate(date)}|${time}`;
        }

        function hourOf(time) {
          return Number(time.slice(0, 2));
        }

        function endOfSlot(time, span = 1) {
          return `${String(hourOf(time) + span).padStart(2, "0")}:00`;
        }

        function canMergeSlot(slotIndex) {
          if (slotIndex < 0 || slotIndex >= timeSlots.length - 1) return false;
          return hourOf(timeSlots[slotIndex + 1]) - hourOf(timeSlots[slotIndex]) === 1;
        }

        function hasCellContent(cellState) {
          if (!cellState) return false;
          return Boolean(
            (cellState.text || "").trim() ||
              (cellState.color && cellState.color !== defaultColor) ||
              cellState.span === 2
          );
        }

        function updateEditorSlotLabel() {
          if (!mobileEditTarget) return;
          const span = durationTwo.checked ? 2 : 1;
          const { date, time } = mobileEditTarget;
          editorSlotLabel.textContent = `${fmtDate(date)} 周${toCNWeekday(date)} · ${time}–${endOfSlot(time, span)}`;
        }

        function openMobileEditor(cellId, cell, text, picker, date, time, slotIndex) {
          const existingSpan = state[cellId]?.span === 2 && canMergeSlot(slotIndex) ? 2 : 1;
          const nextCellId = canMergeSlot(slotIndex)
            ? keyFor(date, timeSlots[slotIndex + 1])
            : null;
          const nextOccupied =
            existingSpan !== 2 && nextCellId && hasCellContent(state[nextCellId]);
          const canUseTwoHours = canMergeSlot(slotIndex) && !nextOccupied;

          mobileEditTarget = { cellId, cell, text, picker, date, time, slotIndex, nextCellId };
          editorText.value = text.textContent || "";
          editorColor.value = picker.value;
          durationTwo.disabled = !canUseTwoHours;
          durationTwo.checked = existingSpan === 2 && canUseTwoHours;
          durationOne.checked = !durationTwo.checked;

          if (!canMergeSlot(slotIndex)) {
            durationHint.textContent = "下一格属于休息时间或已到当前时段末尾，不能合并。";
          } else if (nextOccupied) {
            durationHint.textContent = "下一格已有预约内容或颜色，不能覆盖合并。";
          } else {
            durationHint.textContent = "选择 2 小时会把当前格与下一格合并。";
          }

          updateEditorSlotLabel();
          slotEditor.showModal();
          editorText.focus();
        }

        function loadState() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return {};
            return JSON.parse(raw);
          } catch (_e) {
            return {};
          }
        }

        function loadSavedColors() {
          try {
            const raw = localStorage.getItem(PALETTE_STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return Array.from(
              new Set(
                parsed
                  .filter((color) => typeof color === "string" && /^#[0-9a-f]{6}$/i.test(color))
                  .map((color) => color.toLowerCase())
              )
            ).slice(0, MAX_SAVED_COLORS);
          } catch (_e) {
            return [];
          }
        }

        function persist() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function persistSavedColors() {
          localStorage.setItem(PALETTE_STORAGE_KEY, JSON.stringify(savedColors));
        }

        function renderSavedColors() {
          savedColorsEl.innerHTML = "";
          savedColorsCount.textContent = `${savedColors.length} / ${MAX_SAVED_COLORS}`;

          if (!savedColors.length) {
            const empty = document.createElement("p");
            empty.className = "saved-colors-empty";
            empty.textContent = "还没有保存颜色";
            savedColorsEl.appendChild(empty);
            return;
          }

          savedColors.forEach((color) => {
            const item = document.createElement("div");
            item.className = "saved-color-item";

            const useButton = document.createElement("button");
            useButton.className = "saved-color-use";
            useButton.type = "button";
            useButton.style.backgroundColor = color;
            useButton.title = `使用颜色 ${color}`;
            useButton.setAttribute("aria-label", `使用颜色 ${color}`);
            useButton.addEventListener("click", () => {
              editorColor.value = color;
            });

            const removeButton = document.createElement("button");
            removeButton.className = "saved-color-remove";
            removeButton.type = "button";
            removeButton.textContent = "×";
            removeButton.title = `删除颜色 ${color}`;
            removeButton.setAttribute("aria-label", `删除颜色 ${color}`);
            removeButton.addEventListener("click", () => {
              savedColors = savedColors.filter((itemColor) => itemColor !== color);
              persistSavedColors();
              renderSavedColors();
            });

            item.appendChild(useButton);
            item.appendChild(removeButton);
            savedColorsEl.appendChild(item);
          });
        }

        function buildDateHeaders() {
          tableHead.innerHTML = "";
          const corner = document.createElement("th");
          corner.className = "time-col";
          corner.innerHTML =
            '<span class="corner-long">时间 / 日期</span><span class="corner-short">时间</span>';
          tableHead.appendChild(corner);

          for (let i = 0; i < dayCount; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);
            const th = document.createElement("th");
            th.className = "date-col";
            th.innerHTML = `
              <div class="date-full">${fmtDate(date)}</div>
              <div class="date-short">${date.getMonth() + 1}/${date.getDate()}</div>
              <div class="weekday">周${toCNWeekday(date)}</div>
            `;
            tableHead.appendChild(th);
          }
        }

        function createRow(time, timeIndex) {
          const row = document.createElement("tr");
          const timeCell = document.createElement("th");
          timeCell.className = "time-col";
          timeCell.textContent = time;
          row.appendChild(timeCell);

          for (let i = 0; i < dayCount; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);

            if (timeIndex > 0 && canMergeSlot(timeIndex - 1)) {
              const previousId = keyFor(date, timeSlots[timeIndex - 1]);
              if (state[previousId]?.span === 2) continue;
            }

            const cellId = keyFor(date, time);
            const cell = document.createElement("td");
            cell.className = "slot-cell";
            cell.dataset.id = cellId;
            const cellSpan = state[cellId]?.span === 2 && canMergeSlot(timeIndex) ? 2 : 1;
            if (cellSpan === 2) {
              cell.rowSpan = 2;
              cell.dataset.span = "2";
            }

            const text = document.createElement("div");
            text.className = "slot-text";
            text.contentEditable = "false";
            text.setAttribute("role", "textbox");
            text.setAttribute(
              "aria-label",
              `${time} 到 ${endOfSlot(time, cellSpan)} ${fmtDate(date)} ${toCNWeekday(date)} 预约内容`
            );
            text.textContent = state[cellId]?.text || "";

            cell.tabIndex = 0;
            cell.setAttribute("role", "button");
            cell.setAttribute(
              "aria-label",
              `${time} 到 ${endOfSlot(time, cellSpan)} ${fmtDate(date)} 周${toCNWeekday(date)}，点按编辑预约`
            );

            const picker = document.createElement("input");
            picker.className = "slot-color";
            picker.type = "color";
            picker.title = "设置格子颜色";
            picker.tabIndex = -1;
            picker.setAttribute("aria-hidden", "true");
            picker.value = state[cellId]?.color || "#f8fafc";
            cell.style.backgroundColor = picker.value;
            if ((state[cellId]?.text || "").trim()) {
              cell.dataset.filled = "true";
            }

            cell.addEventListener("click", () => {
              openMobileEditor(cellId, cell, text, picker, date, time, timeIndex);
            });

            cell.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openMobileEditor(cellId, cell, text, picker, date, time, timeIndex);
              }
            });

            cell.appendChild(text);
            cell.appendChild(picker);
            row.appendChild(cell);
          }

          return row;
        }

        function render() {
          startDate = startOfToday();
          buildDateHeaders();
          tableBody.innerHTML = "";
          timeSlots.forEach((time, timeIndex) => {
            tableBody.appendChild(createRow(time, timeIndex));
          });
          rangeLabel.textContent = `当前范围：${dayCount} 天（从 ${fmtDate(startDate)} 起）`;
          updateRangeButtons();
        }

        function updateRangeButtons() {
          rangeButtons.forEach((btn) => {
            btn.classList.toggle("active", Number(btn.dataset.range) === dayCount);
          });
        }

        renderSavedColors();
        render();
      })();
    </script>
  </body>
</html>
