<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西部大闭环在线高德路线与地点地图</title>
  <style>
    :root{--bg:#f4f1ec;--card:#fff;--ink:#282522;--muted:#6d6761;--line:#e4ddd5;--accent:#c75b39;--accent-soft:#fff0e9;--shadow:0 14px 36px rgba(62,45,34,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--ink)}
    button,input{font:inherit}.app{display:grid;grid-template-columns:360px minmax(0,1fr);height:100vh;min-height:680px;overflow:hidden}
    .sidebar{background:rgba(255,255,255,.97);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr;min-height:0;position:relative;z-index:5}
    .brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:19px;line-height:1.35;margin:0}.brand p{font-size:12px;color:var(--muted);line-height:1.6;margin:7px 0 0}
    .mode-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#e9f8ef;color:#167345;padding:6px 9px;font-size:11px;font-weight:800;white-space:nowrap}.mode-dot{width:7px;height:7px;border-radius:50%;background:#18a05e;box-shadow:0 0 0 4px rgba(24,160,94,.12)}
    .quick-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.quick-actions button,.quick-actions a{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}.quick-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .search-wrap{padding:12px 18px 8px}.search{width:100%;border:1px solid var(--line);background:#faf8f5;border-radius:12px;padding:10px 12px;outline:none;font-size:13px}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(199,91,57,.11)}
    .layers{padding:0 18px 12px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.layer-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px}.layer-chip::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--chip)}.layer-chip.active{color:var(--ink);border-color:var(--chip);box-shadow:0 0 0 2px color-mix(in srgb,var(--chip) 14%,transparent)}
    .browser{min-height:0;display:grid;grid-template-rows:auto 1fr}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:10px 18px 8px;gap:8px}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}.tab.active{background:var(--accent-soft);color:var(--accent);border-color:#efbea9}.list-panel{overflow:auto;padding:0 12px 18px}.list-panel[hidden]{display:none}.list{display:flex;flex-direction:column;gap:7px}
    .list-btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px;cursor:pointer;transition:.18s}.list-btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(60,45,34,.08)}.list-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(199,91,57,.12)}.list-title{font-size:13px;font-weight:800;line-height:1.4;display:flex;align-items:flex-start;gap:7px}.idx,.poi-dot{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:22px;height:22px;border-radius:50%;color:#fff;font-size:10px;font-weight:900}.list-meta{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px;padding-left:29px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px}
    .viewer{position:relative;min-width:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:16px;gap:12px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.topbar h2{font-size:21px;margin:0}.topbar p{margin:4px 0 0;font-size:12px;color:var(--muted)}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;color:var(--muted)}
    .map-shell{position:relative;min-height:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}#map{position:absolute;inset:0}.map-hint{position:absolute;left:14px;bottom:14px;z-index:2;background:rgba(38,35,32,.86);color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;pointer-events:none;backdrop-filter:blur(8px)}
    .detail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 15px;display:grid;grid-template-columns:minmax(180px,.65fr) minmax(240px,1.35fr);gap:16px;align-items:center}.detail h3{margin:0;font-size:15px}.detail p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.detail strong{color:var(--ink)}
    .error{position:absolute;z-index:10;top:16px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 32px));background:#fff1f1;border:1px solid #efcaca;color:#9b2c2c;border-radius:14px;padding:12px 14px;font-size:13px;display:none}
    .amap-maps,.amap-drags{cursor:grab!important}.amap-maps:active,.amap-drags:active{cursor:grabbing!important}.route-node{display:flex;align-items:center;gap:5px;white-space:nowrap;transform:translate(-12px,-12px)}.route-node b{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:50%;background:#1f2937;color:#fff;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.28);font-size:10px}.route-node span{display:none;background:rgba(255,255,255,.93);border:1px solid #d8d2ca;border-radius:7px;padding:3px 6px;color:#292521;font-size:11px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12)}.route-node:hover span,.route-node.active span{display:block}
    .poi-marker{display:flex;align-items:center;gap:5px;white-space:nowrap;transform:translate(-15px,-15px)}.poi-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;background:var(--poi);color:#fff;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25);font-size:11px;font-weight:900}.poi-name{display:none;max-width:190px;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.95);border:1px solid color-mix(in srgb,var(--poi) 45%,#ddd);border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800;color:#292521;box-shadow:0 2px 8px rgba(0,0,0,.12)}.poi-marker:hover .poi-name,.poi-marker.active .poi-name{display:block}.poi-info{min-width:220px;max-width:320px;padding:4px}.poi-info h4{font-size:14px;margin:0 0 5px}.poi-info .kind{font-size:11px;font-weight:800;margin-bottom:6px}.poi-info p{font-size:12px;color:#5f5953;line-height:1.55;margin:0}.poi-info small{display:block;margin-top:7px;color:#8a8178}
    @media(max-width:900px){.app{grid-template-columns:1fr;height:auto;min-height:100vh;overflow:visible}.sidebar{height:auto;max-height:52vh;border-right:0;border-bottom:1px solid var(--line)}.viewer{height:72vh;min-height:620px;padding:10px}.brand{padding:14px}.search-wrap,.layers{padding-left:14px;padding-right:14px}.detail{grid-template-columns:1fr}.map-hint{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-row"><h1>西部大闭环路线与地点</h1><span class="mode-badge"><span class="mode-dot"></span>在线高德</span></div>
        <p>路线、住宿、景点、吃饭、采购、厕所和救援节点使用同一套规划数据。放大后高德底图会继续显示道路与周边地点。</p>
        <div class="quick-actions">
          <button id="showAllBtn" class="primary" type="button">查看全程</button>
          <a href="./route-map-offline.html?v=8">切到离线版</a>
          <a href="./index.html#overview">返回攻略</a>
        </div>
      </div>
      <div class="search-wrap"><input id="searchInput" class="search" type="search" placeholder="搜索住宿、景点、补给或路段" aria-label="搜索地图地点"></div>
      <div id="layerChips" class="layers" aria-label="地点图层"></div>
      <div class="browser">
        <div class="tabs"><button class="tab active" data-panel="routes" type="button">路线分段</button><button class="tab" data-panel="places" type="button">地点清单 <span id="poiCount"></span></button></div>
        <div id="routePanel" class="list-panel"><div id="segmentList" class="list"></div></div>
        <div id="placePanel" class="list-panel" hidden><div id="poiList" class="list"></div></div>
      </div>
    </aside>
    <main class="viewer">
      <div class="topbar">
        <div><h2 id="pageTitle">全程路线</h2><p id="pageSub">滚轮缩放，按住拖动；点击左侧路段或地点自动聚焦。</p></div>
        <div class="stats"><span class="stat" id="statSegments"></span><span class="stat" id="statPois"></span><span class="stat" id="offlineStatus">离线包准备中</span></div>
      </div>
      <div class="map-shell">
        <div id="errorBox" class="error"></div>
        <div id="map" aria-label="西部大闭环在线高德地图"></div>
        <div class="map-hint">滚轮缩放 · 按住拖动 · 点路线或图标看详情</div>
      </div>
      <div class="detail"><div><h3 id="detailTitle">全程路线</h3><p id="detailMeta">20 段城市间导航骨架</p></div><p id="detailText">已显示全部主干路线。地点图层可单独开关，避免住宿、餐饮和厕所同时显示造成拥挤。</p></div>
    </main>
  </div>
  <script>window.AMAP_LOCAL_CONFIG = window.AMAP_LOCAL_CONFIG || null;</script>
  <script src="./assets/amap-config.public.js"></script>
  <script src="./assets/route_segments_amap.js"></script>
  <script src="./assets/route_map_pois.js"></script>
  <script>
    const ROUTE = window.ROAD_TRIP_ROUTE_DATA;
    const PLACES = window.ROAD_TRIP_POI_DATA;
    const categories = PLACES.categories;
    const visibleCategories = new Set(Object.entries(categories).filter(([, value]) => value.defaultVisible).map(([key]) => key));
    const list = document.getElementById('segmentList');
    const poiList = document.getElementById('poiList');
    const pageTitle = document.getElementById('pageTitle');
    const pageSub = document.getElementById('pageSub');
    const detailTitle = document.getElementById('detailTitle');
    const detailMeta = document.getElementById('detailMeta');
    const detailText = document.getElementById('detailText');
    const errorBox = document.getElementById('errorBox');
    const searchInput = document.getElementById('searchInput');
    const layerChips = document.getElementById('layerChips');
    const mapEl = document.getElementById('map');
    let map = null;
    let AMapRef = null;
    let infoWindow = null;
    let activeSegmentId = '';
    let activePoiId = '';
    const segmentOverlays = new Map();
    const routeNodeMarkers = new Map();
    const poiMarkers = new Map();

    const totalKm = ROUTE.segments.reduce((sum, seg) => sum + seg.lengthKm, 0);
    document.getElementById('statSegments').textContent = `路线 ${ROUTE.segments.length} 段 · ${totalKm.toFixed(0)} km`;
    document.getElementById('statPois').textContent = `规划地点 ${PLACES.pois.length} 个`;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = message;
    }

    function renderLayers() {
      layerChips.innerHTML = '';
      Object.entries(categories).forEach(([key, category]) => {
        const count = PLACES.pois.filter(poi => poi.category === key).length;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `layer-chip${visibleCategories.has(key) ? ' active' : ''}`;
        button.style.setProperty('--chip', category.color);
        button.dataset.category = key;
        button.textContent = `${category.label} ${count}`;
        button.addEventListener('click', () => toggleCategory(key));
        layerChips.appendChild(button);
      });
    }

    function toggleCategory(category, forceOn) {
      const shouldShow = forceOn === true || !visibleCategories.has(category);
      if (shouldShow) visibleCategories.add(category); else visibleCategories.delete(category);
      document.querySelectorAll('.layer-chip').forEach(button => button.classList.toggle('active', visibleCategories.has(button.dataset.category)));
      updatePoiVisibility();
      renderPoiList();
    }

    function updatePoiVisibility() {
      poiMarkers.forEach((marker, id) => {
        const poi = PLACES.pois.find(item => item.id === id);
        marker.setMap(poi && visibleCategories.has(poi.category) ? map : null);
      });
    }

    function activateSegmentButton(id) {
      document.querySelectorAll('.route-btn').forEach(button => button.classList.toggle('active', button.dataset.id === id));
      const segment = ROUTE.segments.find(item => item.id === id);
      mapEl.querySelectorAll('.route-node').forEach(node => node.classList.toggle('active', !!segment && (node.dataset.name === segment.from.name || node.dataset.name === segment.to.name)));
    }

    function activatePoiButton(id) {
      document.querySelectorAll('.poi-btn').forEach(button => button.classList.toggle('active', button.dataset.id === id));
      mapEl.querySelectorAll('.poi-marker').forEach(marker => marker.classList.toggle('active', marker.dataset.id === id));
    }

    function renderSegmentList() {
      list.innerHTML = '';
      const query = searchInput.value.trim().toLowerCase();
      ROUTE.segments.filter(seg => !query || `${seg.title} ${seg.group} ${(PLACES.segmentNotes[seg.id] || {}).roads || ''}`.toLowerCase().includes(query)).forEach(seg => {
        const note = PLACES.segmentNotes[seg.id] || {};
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'list-btn route-btn';
        button.dataset.id = seg.id;
        button.innerHTML = `<div class="list-title"><span class="idx" style="background:${seg.color}">${seg.index}</span><span>${escapeHtml(seg.title)}</span></div><div class="list-meta">${escapeHtml(note.roads || seg.group)} · ${seg.lengthKm} km</div>`;
        button.addEventListener('click', () => selectSegment(seg.id));
        list.appendChild(button);
      });
      if (!list.children.length) list.innerHTML = '<div class="empty">没有匹配的路段</div>';
      activateSegmentButton(activeSegmentId);
    }

    function filteredPois() {
      const query = searchInput.value.trim().toLowerCase();
      return PLACES.pois.filter(poi => visibleCategories.has(poi.category) && (!query || `${poi.name} ${poi.area} ${poi.note} ${categories[poi.category].label}`.toLowerCase().includes(query)));
    }

    function renderPoiList() {
      const result = filteredPois();
      document.getElementById('poiCount').textContent = `(${result.length})`;
      poiList.innerHTML = '';
      result.forEach(poi => {
        const category = categories[poi.category];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'list-btn poi-btn';
        button.dataset.id = poi.id;
        button.innerHTML = `<div class="list-title"><span class="poi-dot" style="background:${category.color}">${category.short}</span><span>${escapeHtml(poi.name)}</span></div><div class="list-meta">${escapeHtml(category.label)} · ${escapeHtml(poi.area)}</div>`;
        button.addEventListener('click', () => focusPoi(poi.id));
        poiList.appendChild(button);
      });
      if (!result.length) poiList.innerHTML = '<div class="empty">打开更多图层，或换一个关键词</div>';
      activatePoiButton(activePoiId);
    }

    function openPoiInfo(poi) {
      if (!map || !AMapRef) return;
      const category = categories[poi.category];
      infoWindow.setContent(`<div class="poi-info"><h4>${escapeHtml(poi.name)}</h4><div class="kind" style="color:${category.color}">${escapeHtml(category.label)} · ${escapeHtml(poi.area)}</div><p>${escapeHtml(poi.note)}</p><small>经纬度 ${poi.lng.toFixed(3)}, ${poi.lat.toFixed(3)}</small></div>`);
      infoWindow.open(map, [poi.lng, poi.lat]);
      detailTitle.textContent = poi.name;
      detailMeta.textContent = `${category.label} · ${poi.area}`;
      detailText.textContent = poi.note;
    }

    function focusPoi(id) {
      const poi = PLACES.pois.find(item => item.id === id);
      if (!poi || !map) return;
      if (!visibleCategories.has(poi.category)) toggleCategory(poi.category, true);
      activePoiId = id;
      activeSegmentId = '';
      activateSegmentButton('');
      activatePoiButton(id);
      map.setZoomAndCenter(11, [poi.lng, poi.lat], true);
      openPoiInfo(poi);
      pageTitle.textContent = poi.name;
      pageSub.textContent = `${categories[poi.category].label} · ${poi.area}`;
      window.parent.postMessage({ type: 'route-map-state', mode: 'online', poi: id }, '*');
    }

    function showAll() {
      if (!map) return;
      activeSegmentId = '';
      activePoiId = '';
      segmentOverlays.forEach(polyline => polyline.setOptions({ strokeOpacity: .58, strokeWeight: 6 }));
      map.setFitView([...segmentOverlays.values(), ...routeNodeMarkers.values()], false, [70, 70, 70, 70], 14);
      if (infoWindow) infoWindow.close();
      activateSegmentButton('');
      activatePoiButton('');
      pageTitle.textContent = '全程路线';
      pageSub.textContent = '滚轮缩放，按住拖动；点击左侧路段或地点自动聚焦。';
      detailTitle.textContent = '全程路线';
      detailMeta.textContent = `${ROUTE.segments.length} 段 · 城市间主干约 ${totalKm.toFixed(0)} km`;
      detailText.textContent = '地点图层可单独开关。在线高德底图在继续放大后会显示更多道路、村镇和周边设施。';
      window.parent.postMessage({ type: 'route-map-state', mode: 'online', segment: '' }, '*');
    }

    function selectSegment(id) {
      const seg = ROUTE.segments.find(item => item.id === id);
      if (!seg || !map) return;
      const note = PLACES.segmentNotes[id] || {};
      activeSegmentId = id;
      activePoiId = '';
      segmentOverlays.forEach((polyline, segId) => polyline.setOptions({ strokeOpacity: segId === id ? 1 : .10, strokeWeight: segId === id ? 9 : 4 }));
      const overlays = [segmentOverlays.get(id), routeNodeMarkers.get(seg.from.name), routeNodeMarkers.get(seg.to.name)].filter(Boolean);
      map.setFitView(overlays, false, [90, 90, 90, 90], 16);
      if (infoWindow) infoWindow.close();
      activateSegmentButton(id);
      activatePoiButton('');
      pageTitle.textContent = seg.title;
      pageSub.textContent = `${note.roads || seg.group} · 约 ${seg.lengthKm} km`;
      detailTitle.textContent = seg.title;
      detailMeta.innerHTML = `<strong>${escapeHtml(note.roads || seg.group)}</strong> · ${seg.lengthKm} km · 路线点 ${seg.displayPointCount}`;
      detailText.textContent = note.note || `第 ${seg.index} 段城市间主干导航。`;
      window.parent.postMessage({ type: 'route-map-state', mode: 'online', segment: id }, '*');
    }

    function createMap(AMap) {
      AMapRef = AMap;
      map = new AMap.Map('map', { viewMode: '2D', zoom: 4.8, center: [95.5, 36.5], mapStyle: 'amap://styles/normal', dragEnable: true, zoomEnable: true, scrollWheel: true, doubleClickZoom: true, keyboardEnable: true });
      map.addControl(new AMap.Scale({ position: 'LB' }));
      map.addControl(new AMap.ToolBar({ position: { right: '18px', top: '18px' } }));
      map.addControl(new AMap.MapType({ defaultType: 0, showTraffic: false, showRoad: true }));
      infoWindow = new AMap.InfoWindow({ anchor: 'bottom-center', offset: new AMap.Pixel(0, -18) });

      const routeNodes = [];
      const seen = new Set();
      ROUTE.segments.forEach(seg => [seg.from, seg.to].forEach(point => { if (!seen.has(point.name)) { seen.add(point.name); routeNodes.push(point); } }));
      routeNodes.forEach((node, index) => {
        const marker = new AMap.Marker({ position: [node.lng, node.lat], title: node.name, content: `<div class="route-node" data-name="${escapeHtml(node.name)}"><b>${index + 1}</b><span>${escapeHtml(node.name)}</span></div>`, offset: new AMap.Pixel(0, 0), zIndex: 180 });
        marker.setMap(map);
        marker.on('click', () => { map.setZoomAndCenter(Math.max(map.getZoom(), 8), [node.lng, node.lat], true); pageTitle.textContent = node.name; pageSub.textContent = '主路线节点'; });
        routeNodeMarkers.set(node.name, marker);
      });

      ROUTE.segments.forEach(seg => {
        const polyline = new AMap.Polyline({ path: seg.polyline, strokeColor: seg.color, strokeOpacity: .58, strokeWeight: 6, lineJoin: 'round', lineCap: 'round', zIndex: 80, extData: { id: seg.id } });
        polyline.setMap(map);
        polyline.on('click', () => selectSegment(seg.id));
        segmentOverlays.set(seg.id, polyline);
      });

      PLACES.pois.forEach(poi => {
        const category = categories[poi.category];
        const marker = new AMap.Marker({ position: [poi.lng, poi.lat], title: poi.name, content: `<div class="poi-marker" data-id="${escapeHtml(poi.id)}" style="--poi:${category.color}"><span class="poi-icon">${category.short}</span><span class="poi-name">${escapeHtml(poi.name)}</span></div>`, offset: new AMap.Pixel(0, 0), zIndex: poi.category === 'stay' ? 240 : 210 });
        marker.on('click', () => { activePoiId = poi.id; activatePoiButton(poi.id); openPoiInfo(poi); });
        poiMarkers.set(poi.id, marker);
      });
      updatePoiVisibility();
      showAll();

      const params = new URLSearchParams(location.search);
      const requestedSegment = params.get('segment');
      const requestedPoi = params.get('poi');
      if (requestedSegment) selectSegment(requestedSegment);
      if (requestedPoi) focusPoi(requestedPoi);
    }

    document.getElementById('showAllBtn').addEventListener('click', showAll);
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item === tab));
      document.getElementById('routePanel').hidden = tab.dataset.panel !== 'routes';
      document.getElementById('placePanel').hidden = tab.dataset.panel !== 'places';
    }));
    searchInput.addEventListener('input', () => { renderSegmentList(); renderPoiList(); });
    window.addEventListener('message', event => { if (event.data && event.data.type === 'route-map-resize' && map) map.resize(); });
    renderLayers();
    renderSegmentList();
    renderPoiList();

    const cfg = window.AMAP_LOCAL_CONFIG;
    if (!cfg || !cfg.jsKey || !cfg.securityJsCode) {
      showError('没有检测到高德 JS API 配置。可以先切换离线版，路线和规划地点仍然可用。');
    } else {
      window._AMapSecurityConfig = { securityJsCode: cfg.securityJsCode };
      const loaderScript = document.createElement('script');
      loaderScript.src = 'https://webapi.amap.com/loader.js';
      loaderScript.onload = async () => {
        try {
          const AMap = await AMapLoader.load({ key: cfg.jsKey, version: '2.0', plugins: ['AMap.Scale', 'AMap.ToolBar', 'AMap.MapType'] });
          createMap(AMap);
        } catch (error) {
          showError(`高德底图加载失败：${error && error.message ? error.message : error}。离线版仍可使用。`);
        }
      };
      loaderScript.onerror = () => showError('当前网络无法加载高德底图。请切换离线版。');
      document.head.appendChild(loaderScript);
    }

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./route-map-sw.js').then(() => navigator.serviceWorker.ready).then(() => { document.getElementById('offlineStatus').textContent = '离线包已缓存'; }).catch(() => { document.getElementById('offlineStatus').textContent = '离线缓存未就绪'; });
    } else {
      document.getElementById('offlineStatus').textContent = '本地文件模式';
    }
  </script>
</body>
</html>
