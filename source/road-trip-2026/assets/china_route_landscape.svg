    <circle cx="640" cy="520" r="9"/>
    <circle cx="760" cy="525" r="9"/>
    <circle cx="710" cy="430" r="9"/>
    <circle cx="610" cy="310" r="9"/>
    <circle cx="485" cy="240" r="9"/>
    <circle cx="395" cy="210" r="9"/>
    <circle cx="330" cy="270" r="9"/>
    <circle cx="420" cy="405" r="9"/>
    <circle cx="470" cy="540" r="9"/>
    <circle cx="515" cy="650" r="9"/>
    <circle cx="665" cy="690" r="9"/>
    <circle cx="825" cy="640" r="9"/>
    <circle cx="945" cy="590" r="9"/>
    <circle cx="1055" cy="565" r="9"/>
    <circle cx="1090" cy="620" r="9"/>
    <circle cx="1060" cy="700" r="9"/>
