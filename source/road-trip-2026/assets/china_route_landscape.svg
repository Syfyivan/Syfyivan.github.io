<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">免费大地风景优先版72天路线示意图</title>
  <desc id="desc">北京出发，经张掖、G227、青海湖北岸、G315、敦煌、哈密、北疆、南疆、新藏线、西藏、滇藏线、川西、成都、西安返回北京的分段路线示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .city{font:700 20px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#1f2937}
      .minor{font:600 16px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#334155}
      .meta{font:600 14px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#64748b}
      .legend{font:600 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#0f172a}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect x="38" y="38" width="1524" height="824" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="90" y="95" class="city" style="font-size:34px">72天免费大地风景优先版路线示意图</text>
  <text x="90" y="130" class="meta">示意图重点表达新版路线骨架与分段关系，不按精确地图投影绘制；以页面日程文字为准</text>

  <!-- soft region hints -->
  <rect x="105" y="180" width="280" height="120" rx="18" fill="#fef3c7"/>
  <text x="130" y="215" class="minor">华北起点</text>
  <text x="130" y="245" class="small">北京 → 河套 → 张掖</text>
  <rect x="340" y="235" width="320" height="160" rx="18" fill="#fff7ed"/>
  <text x="365" y="270" class="minor">青甘风景公路</text>
  <text x="365" y="300" class="small">G227 祁连 · 青海湖北岸 · G315 柴达木</text>
  <rect x="630" y="120" width="360" height="250" rx="18" fill="#eff6ff"/>
  <text x="655" y="155" class="minor">新疆段</text>
  <text x="655" y="185" class="small">哈密 · 白哈巴/禾木 · 赛里木湖 · 独库 · 喀什 · 帕米尔</text>
  <rect x="860" y="330" width="360" height="220" rx="18" fill="#f0fdf4"/>
  <text x="885" y="365" class="minor">西藏段</text>
  <text x="885" y="395" class="small">G219 新藏线 · 阿里 · 珠峰 · 拉萨 · 林芝</text>
  <rect x="760" y="565" width="300" height="165" rx="18" fill="#ecfeff"/>
  <text x="785" y="600" class="minor">滇藏线 / 云南</text>
  <text x="785" y="630" class="small">然乌 · 梅里 · 雨崩 · 丽江</text>
  <rect x="1030" y="620" width="380" height="160" rx="18" fill="#f5f3ff"/>
  <text x="1055" y="655" class="minor">川西与返程</text>
  <text x="1055" y="685" class="small">亚丁 · 新都桥 · 成都 · 西安 · 北京</text>

  <!-- route lines -->
  <polyline points="180,235 265,240 350,255 430,275 505,295 580,320 650,310" fill="none" stroke="#e74c3c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="650,310 700,250 750,215 805,195 860,180 915,205 955,250 925,305" fill="none" stroke="#e67e22" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="925,305 960,350 985,405 950,455 895,470" fill="none" stroke="#d4a017" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="895,470 930,420 1000,390 1075,405 1135,455 1105,525 1025,535" fill="none" stroke="#229954" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1025,535 980,590 925,640 875,665 845,690" fill="none" stroke="#2980b9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="845,690 930,675 1020,690 1105,720 1200,705 1285,640 1300,550 1255,470 1215,395 1260,300 1345,245" fill="none" stroke="#8B5E3C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes -->
  <g fill="#fff" stroke="#0f172a" stroke-width="4">
    <circle cx="180" cy="235" r="10"/><circle cx="350" cy="255" r="10"/><circle cx="505" cy="295" r="10"/><circle cx="650" cy="310" r="10"/>
    <circle cx="805" cy="195" r="10"/><circle cx="955" cy="250" r="10"/><circle cx="925" cy="305" r="10"/>
    <circle cx="950" cy="455" r="10"/><circle cx="1000" cy="390" r="10"/><circle cx="1135" cy="455" r="10"/><circle cx="1105" cy="525" r="10"/>
    <circle cx="925" cy="640" r="10"/><circle cx="845" cy="690" r="10"/>
    <circle cx="1105" cy="720" r="10"/><circle cx="1285" cy="640" r="10"/><circle cx="1300" cy="550" r="10"/><circle cx="1345" cy="245" r="10"/>
  </g>

  <!-- labels -->
  <text x="145" y="220" class="city">北京</text>
  <text x="320" y="245" class="minor">张掖</text>
  <text x="445" y="285" class="minor">青海湖北岸</text>
  <text x="600" y="345" class="minor">敦煌/哈密</text>
  <text x="730" y="185" class="minor">白哈巴/禾木</text>
  <text x="925" y="235" class="minor">伊宁/独库</text>
  <text x="885" y="295" class="minor">库车</text>
  <text x="905" y="485" class="minor">喀什/塔县</text>
  <text x="975" y="375" class="minor">阿里</text>
  <text x="1145" y="448" class="minor">拉萨</text>
  <text x="1115" y="552" class="minor">林芝/然乌</text>
  <text x="890" y="635" class="minor">梅里</text>
  <text x="807" y="715" class="minor">丽江</text>
  <text x="1060" y="747" class="minor">亚丁/新都桥</text>
  <text x="1260" y="635" class="minor">成都</text>
  <text x="1270" y="535" class="minor">西安</text>
  <text x="1360" y="248" class="minor">北京</text>

  <!-- legend -->
  <rect x="90" y="770" width="1420" height="58" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
  <line x1="118" y1="799" x2="176" y2="799" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>
  <text x="188" y="805" class="legend">青甘风景公路</text>
  <line x1="405" y1="799" x2="463" y2="799" stroke="#e67e22" stroke-width="10" stroke-linecap="round"/>
  <text x="475" y="805" class="legend">北疆秋色</text>
  <line x1="630" y1="799" x2="688" y2="799" stroke="#d4a017" stroke-width="10" stroke-linecap="round"/>
  <text x="700" y="805" class="legend">南疆/帕米尔</text>
  <line x1="905" y1="799" x2="963" y2="799" stroke="#229954" stroke-width="10" stroke-linecap="round"/>
  <text x="975" y="805" class="legend">新藏线/西藏</text>
  <line x1="1170" y1="799" x2="1228" y2="799" stroke="#2980b9" stroke-width="10" stroke-linecap="round"/>
  <text x="1240" y="805" class="legend">滇藏线/云南</text>
  <line x1="1380" y1="799" x2="1438" y2="799" stroke="#8B5E3C" stroke-width="10" stroke-linecap="round"/>
  <text x="1450" y="805" class="legend">川西返程</text>
</svg>