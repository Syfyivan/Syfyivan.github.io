  <g fill="#fff" stroke="#0f172a" stroke-width="3.5">
    <circle cx="1260" cy="215" r="9"/>
    <circle cx="1110" cy="235" r="9"/>
    <circle cx="945" cy="270" r="9"/>
    <circle cx="770" cy="325" r="9"/>
