<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">72天青甘完整核心 + 西部主线均衡版路线图</title>
  <desc id="desc">北京出发，经张掖丹霞、青海湖、茶卡、德令哈、大柴旦、敦煌、哈密、北疆、喀什、阿里、拉萨、林芝、梅里、丽江、亚丁、成都、西安返回北京的近似地理方位路线图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#1f2937}
      .meta{font:600 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#64748b}
      .city{font:700 18px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#0f172a}
      .minor{font:600 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#334155}
      .tiny{font:500 13px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#64748b}
      .legend{font:600 15px -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC',sans-serif;fill:#0f172a}
    </style>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <rect x="36" y="36" width="1528" height="908" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="86" y="96" class="title">72天青甘完整核心 + 西部主线均衡版路线图</text>
  <text x="86" y="130" class="meta">当前版本改成更接近真实方位关系的示意图：重点看路线相对位置，不看精确公里测绘</text>

  <!-- faint china-like silhouette -->
  <path d="M280,200
           C360,170 460,150 580,155
           C710,160 830,185 930,175
           C1040,165 1160,175 1260,215
           C1330,245 1380,300 1380,365
           C1380,430 1340,470 1310,525
           C1280,575 1280,640 1240,700
           C1195,770 1110,820 1010,845
           C885,875 770,872 655,850
           C560,832 490,788 435,750
           C385,715 325,660 300,600
           C270,530 250,465 250,395
           C250,325 255,260 280,200 Z"
        fill="#f8fafc" stroke="#e5e7eb" stroke-width="2"/>

  <!-- route segments -->
  <polyline points="1260,215 1110,235 945,270 770,325 640,380 585,455 640,520 760,525"
            fill="none" stroke="#e74c3c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="760,525 710,430 610,310 485,240 395,210 330,270"
            fill="none" stroke="#f39c12" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="330,270 420,405 470,540 515,650"
            fill="none" stroke="#d4a017" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="515,650 665,690 825,640 945,590 1055,565"
            fill="none" stroke="#229954" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="1055,565 1090,620 1060,700 990,770"
            fill="none" stroke="#2980b9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="990,770 1095,740 1180,705 1240,630 1210,535 1185,430 1215,315 1260,215"
            fill="none" stroke="#8B5E3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

