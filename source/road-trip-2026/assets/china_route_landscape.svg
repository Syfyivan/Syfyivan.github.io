    <circle cx="1210" cy="535" r="9"/>
    <circle cx="1185" cy="430" r="9"/>
    <circle cx="1215" cy="315" r="9"/>
  </g>

  <!-- labels -->
  <text x="1280" y="210" class="city">北京</text>
  <text x="1080" y="222" class="minor">西安</text>
  <text x="905" y="258" class="minor">张掖丹霞</text>
  <text x="725" y="315" class="minor">青海湖北岸</text>
  <text x="605" y="372" class="minor">茶卡</text>
  <text x="530" y="447" class="minor">德令哈</text>
  <text x="590" y="545" class="minor">大柴旦 / G315</text>
  <text x="735" y="550" class="minor">敦煌 / 哈密</text>

  <text x="670" y="420" class="minor">白哈巴 / 禾木</text>
  <text x="560" y="300" class="minor">伊宁 / 赛里木湖</text>
  <text x="435" y="228" class="minor">独库</text>
  <text x="300" y="197" class="minor">库车</text>

  <text x="350" y="398" class="minor">喀什 / 塔县</text>
  <text x="430" y="565" class="minor">阿里</text>
  <text x="470" y="675" class="minor">萨嘎 / 日喀则</text>

  <text x="640" y="715" class="minor">拉萨</text>
  <text x="800" y="632" class="minor">林芝 / 然乌</text>
  <text x="930" y="580" class="minor">梅里 / 雨崩</text>
  <text x="1070" y="562" class="minor">丽江</text>
  <text x="1112" y="618" class="minor">亚丁 / 新都桥</text>
  <text x="1072" y="720" class="minor">成都</text>
  <text x="1185" y="695" class="minor">返程华北</text>
  <text x="1220" y="522" class="minor">回到北京</text>

  <!-- callouts -->
  <rect x="92" y="170" width="230" height="110" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="112" y="205" class="city" style="font-size:20px">青甘完整核心</text>
  <text x="112" y="235" class="tiny">张掖丹霞 → G227 → 青海湖</text>
  <text x="112" y="257" class="tiny">→ 茶卡 → 德令哈 → 大柴旦</text>
  <text x="112" y="279" class="tiny">→ G315 → 敦煌 → 哈密</text>

  <rect x="92" y="310" width="230" height="110" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="112" y="345" class="city" style="font-size:20px">新疆主线</text>
  <text x="112" y="375" class="tiny">白哈巴 / 禾木 → 赛里木湖</text>
  <text x="112" y="397" class="tiny">→ 独库 → 喀什 / 帕米尔</text>

  <rect x="92" y="450" width="230" height="128" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="112" y="485" class="city" style="font-size:20px">西藏主线</text>
  <text x="112" y="515" class="tiny">新藏线 G219 → 阿里 → 日喀则</text>
  <text x="112" y="537" class="tiny">→ 拉萨 → 林芝 / 然乌</text>
  <text x="112" y="559" class="tiny">城市景点压缩，把时间让给青甘</text>

  <rect x="92" y="608" width="230" height="122" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="112" y="643" class="city" style="font-size:20px">云南 / 川西 / 返程</text>
  <text x="112" y="673" class="tiny">梅里 / 雨崩 → 丽江 → 亚丁</text>
  <text x="112" y="695" class="tiny">→ 成都 → 西安 → 北京</text>
  <text x="112" y="717" class="tiny">保留徒步主菜，不深刷城市景点</text>

  <!-- legend -->
  <rect x="86" y="864" width="1428" height="54" rx="16" fill="#f8fafc" stroke="#e5e7eb"/>
  <line x1="118" y1="891" x2="172" y2="891" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>
  <text x="184" y="897" class="legend">青甘完整核心</text>
  <line x1="384" y1="891" x2="438" y2="891" stroke="#f39c12" stroke-width="10" stroke-linecap="round"/>
  <text x="450" y="897" class="legend">北疆 / 独库</text>
  <line x1="628" y1="891" x2="682" y2="891" stroke="#d4a017" stroke-width="10" stroke-linecap="round"/>
  <text x="694" y="897" class="legend">喀什 / 阿里 / 日喀则</text>
  <line x1="940" y1="891" x2="994" y2="891" stroke="#229954" stroke-width="10" stroke-linecap="round"/>
  <text x="1006" y="897" class="legend">拉萨 / 林芝</text>
  <line x1="1170" y1="891" x2="1224" y2="891" stroke="#2980b9" stroke-width="10" stroke-linecap="round"/>
